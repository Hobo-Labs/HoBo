# Copy into the Bindle's repository as .gitlab-ci.yml.
# GitLab issues an OIDC id_token for the `hobo.cd` audience. HoBo.CD trusts it
# only when project_path, ref, ref_protected and ref_type exactly match the
# TrustedPublisherRecord in src/hobo.delivery.ts. No HoBo secret is stored in
# CI variables. The push is a nudge: CD polls the Git repository and the
# registry itself, and the verified read becomes Freight.
stages: [build, publish]

build-api:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/api:main-${CI_COMMIT_SHA:0:12}" .
    - docker push "$CI_REGISTRY_IMAGE/api:main-${CI_COMMIT_SHA:0:12}"

publish-freight:
  stage: publish
  image: node:22
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  id_tokens:
    HOBO_ID_TOKEN:
      aud: hobo.cd
  script:
    - npm install --global @hobo/cli
    # Nudge: schedules a poll of the `billing` source; never creates Freight from this payload.
    - hobo deploy source poll billing --publisher-token-stdin <<<"$HOBO_ID_TOKEN"
