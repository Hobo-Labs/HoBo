syntax = "proto3";

package hobo.yardworld.v1;

// Normalized activity the yard world reacts to. OTLP/JSON intake payloads are
// parsed into these records at the hosting service's boundary; everything
// downstream (reducer, snapshots, read stores) consumes the parsed forms.
message SpanRecord {
  string trace_id = 1;
  string span_id = 2;
  string parent_span_id = 3;
  string name = 4;
  // OTLP span kind number (1=internal, 2=server, 3=client, 4=producer, 5=consumer).
  uint32 kind = 5;
  // OTLP status code number (0=unset, 1=ok, 2=error).
  uint32 status_code = 6;
  uint64 start_time_unix_nano = 7;
  uint64 end_time_unix_nano = 8;
}

message LogRecord {
  string trace_id = 1;
  uint32 severity_number = 2;
  string severity_text = 3;
  string body = 4;
}

message MetricSample {
  string metric = 1;
  double value = 2;
}

// HoBo primitive identity carried on OTLP resource attributes.
message PrimitiveRef {
  string service_name = 1; // bindle id (or hobo.bindle override)
  string station = 2;      // hobo.station
  string yard = 3;         // hobo.yard
  string camp = 4;         // hobo.camp
  string junction = 5;     // hobo.junction
  string primitive = 6;    // hobo.primitive: bindle|crew|actor
}

// Character state machine states, mirroring src/model.ts.
enum CharacterState {
  CHARACTER_STATE_UNSPECIFIED = 0;
  CHARACTER_STATE_IDLE = 1;
  CHARACTER_STATE_WORKING = 2;
  CHARACTER_STATE_READING = 3;
  CHARACTER_STATE_STUCK = 4;
}

// ── HoBo CD views (plan 0024 WP19) ─────────────────────────────────────────
// Wire forms of the read models in src/cd-views.ts (TS interfaces of the same
// shape without the Record suffix are their parsed domain views).

// One delivery of one Freight to one Camp (a CD task run).
message FreightTimelineEntryRecord {
  string freight_id = 1;
  string run_id = 2;      // cicd.pipeline.run.id (promotion id)
  string pipeline = 3;    // cicd.pipeline.name
  string node = 4;        // hobo.cd.pipeline.node
  string camp_id = 5;     // hobo.camp.id
  string station_id = 6;  // hobo.station.id
  string environment = 7; // deployment.environment.name
  string result = 8;      // cicd.pipeline.task.run.result, or "pending"
  uint64 start_ms = 9;
  uint64 end_ms = 10;
}

message FreightTimelineRecord {
  string freight_id = 1;
  repeated FreightTimelineEntryRecord entries = 2;
}

message PipelineGraphNodeRecord {
  string id = 1;
  repeated string camps = 2;
  string last_freight_id = 3;
  string last_result = 4;
  int64 last_at_ms = 5;
}

message PipelineGraphEdgeRecord {
  string from = 1;
  string to = 2;
  uint32 freight_count = 3;
}

message PipelineGraphRecord {
  string pipeline = 1;
  repeated PipelineGraphNodeRecord nodes = 2;
  repeated PipelineGraphEdgeRecord edges = 3;
}

message FleetTaintRecord {
  string key = 1;
  string effect = 2; // no_place | no_run | unspecified
}

// One Camp row of the fleet view (Camps by condition and taint).
message FleetCampRowRecord {
  string camp_id = 1;
  map<string, string> conditions = 2; // condition → true | false | unknown
  repeated FleetTaintRecord taints = 3;
}

// One cell of the compliance heatmap (Rail × control).
message ComplianceCellRecord {
  string rail = 1;    // hobo.rail.digest
  string control = 2; // hobo.policy.control; "*" = overall
  string mode = 3;    // enforce | inform
  double ratio = 4;   // noncompliant ratio 0..1
  string band = 5;    // ok | watch | breach
}
