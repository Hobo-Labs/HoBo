syntax = "proto3";
package hobo.provider.oci_registry.v1;

// Plan 0024 (invariant I14): the package's declaration that every product it
// catalogs has a realization path (a shipped resolver) or a typed refusal,
// and which traffic offerings it can and cannot realize. A registry realizes
// none. Metadata only: no credentials, endpoints or provider responses.
message HostingCoverage {
  // Always "hobo.provider-hosting-coverage/v1".
  string contract = 1;
  string provider_id = 2;
  repeated string resolved_product_ids = 3;
  repeated UnresolvedHostingProduct unresolved = 4;
  TrafficCoverage traffic = 5;
}

// A catalogued product refused with RESOLVER_PRODUCT_UNSUPPORTED.
message UnresolvedHostingProduct {
  string product_id = 1;
  string reason = 2;
  string remediation = 3;
}

message TrafficCoverage {
  // Always "other": the core union has no registry member.
  string kind = 1;
  // Always empty: a registry routes no workload traffic.
  repeated string offerings = 2;
  repeated string fallbacks = 3;
  repeated AbsentTrafficOffering absent = 4;
}

// ADR-0144: an offering nothing can realize is declared absent, not preview.
message AbsentTrafficOffering {
  string offering_id = 1;
  string reason = 2;
}
