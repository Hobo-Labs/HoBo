syntax = "proto3";

package hobo.provider.vercel_blob.v1;

// The Vercel Blob binding of the ephemeral-state port. The port's own records
// (entries, leases, ring windows) are hobo.core.v1 in
// packages/core/data-models/ephemeral_state.proto; these are what is specific
// to keeping them as one private blob per key and to metering that against
// Vercel Blob's billable operation classes.

// The body of one key's blob, written as protobuf JSON. The version token a
// caller sees is "<incarnation>:<revision>"; the blob's ETag is what a
// conditional write (ifMatch) is bound to.
message VercelBlobEphemeralRecord {
  // Always "hobo.vercel-blob.ephemeral/v1"; a blob under the namespace with
  // any other format is refused as a contract error, never overwritten.
  string format = 1;
  string value = 2;
  // Chosen by the write that created this incarnation of the key; never
  // reused, so a version from a deleted or expired incarnation cannot match.
  string incarnation = 3;
  // 1 on create, +1 on every value write of the same incarnation. `expire`
  // rewrites the blob without changing it.
  int64 revision = 4;
  // Absolute expiry in milliseconds since the Unix epoch, by the writer's
  // clock. A record with expires_at_ms <= now reads as absent.
  int64 expires_at_ms = 5;
  // Random per write. A write whose reply was lost (the SDK retried it and the
  // retry was refused) is recognised as the caller's own by reading it back.
  string write_id = 6;
}

// What one port call costs on Vercel Blob in the classes Blob bills
// (https://vercel.com/docs/vercel-blob/usage-and-pricing): simple operations
// (a cache-miss read), advanced operations (an upload, copy or list), and
// deletes (free, but counted against the advanced-operation rate limit).
message VercelBlobOperationCost {
  string operation = 1;
  int32 simple_operations = 2;
  int32 advanced_operations = 3;
  int32 deletes = 4;
  // True when the figures are per key asked (getMany, ring reads).
  bool per_key = 5;
}

// SDK calls counted by the meter over a period, by billable class.
message VercelBlobUsage {
  int64 simple_operations = 1;
  int64 advanced_operations = 2;
  int64 deletes = 3;
  map<string, int64> calls_by_method = 4;
}

// What one bounded purge pass did.
message VercelBlobPurgeReport {
  // Blobs listed under the namespace (one advanced operation per page).
  int64 listed = 1;
  // Blobs read to learn their expiry.
  int64 read = 2;
  // Expired blobs deleted (ETag-conditional).
  int64 deleted = 3;
  // Where the next pass continues; empty when the listing is exhausted.
  string cursor = 4;
}

// The environment variable names a Blob binding was configured from, and
// which credentials the SDK would find. Names and presence only: a value
// never reaches this record.
message VercelBlobEnvSource {
  string store_id_variable = 1;
  bool oidc_token_in_env = 2;
  bool read_write_token_present = 3;
}
