syntax = "proto3";

package hobo.secret_store_claim.v1;

// The config/secret store a HoBo deployment chooses when it runs, and the
// claim that hands it to its owner (ADR-0179 amendment "Secret store chosen
// at deploy, provisioned by claim"). The capability is
// `secrets.config-service/v1`. Every record here is refs-only: no claim URL,
// token, password or connection string is a field of any message.

// One way to satisfy the capability, as HoBo policy ranks it.
message SecretStoreOffer {
  // "auth-md" | "cloudflare-temporary" | "infisical-self-hosted" |
  // "infisical-cloud-attach" | "1password-attach" | "bitwarden-attach".
  string kind = 1;
  // 1 is preferred first. Unique per offer.
  uint32 preference = 2;
  // How the owner takes it: "auth-md-claim" (the store's own auth.md claim),
  // "provider-claim-url" (the provider's claim page),
  // "hobo-sealed-claim" (`hobo claim open` reveals a credential HoBo sealed),
  // "owner-sign-in" (the owner signs in to an organization they already own).
  string claim_mechanism = 3;
  // The provider's claim deadline in minutes; 0 when there is none.
  uint32 claim_window_minutes = 4;
  // "built": the relay can read this store today. "designed": provisioning
  // and claim exist, the relay's runtime binding does not yet.
  string runtime_binding = 5;
  // Plain-language cost and availability, for the plan and the owner.
  string cost = 6;
  string availability = 7;
  // Where the facts above come from, and the day they were read.
  string source_url = 8;
  string checked_at = 9;
  // The secrets manager behind the offer: "auth-md" (whichever store),
  // "cloudflare", "infisical", "1password" or "bitwarden".
  string provider = 10;
  // How a workload (the relay on Vercel, a GitHub Actions job) signs in:
  // "workload-identity" (OIDC federation, no stored credential) or
  // "stored-token" (a token must live where the workload runs). Routing
  // passes over "stored-token" offers for the relay's runtime reads.
  string runtime_auth = 11;
}

// What the deploy observed about one offer when it ran.
message SecretStoreEvidence {
  string kind = 1;
  bool available = 2;
  // Why not, when unavailable; a short phrase, never a response body.
  string detail = 3;
}

message SecretStoreSkip {
  string kind = 1;
  string reason = 2;
}

// The routing decision a deploy records: the chosen offer, and why each
// preferred one was passed over.
message SecretStoreSelection {
  string capability = 1;
  string selected_kind = 2;
  repeated SecretStoreSkip skipped = 3;
  string decided_at = 4;
}

// Where the relay and the deploy workflow read config once the store exists:
// non-secret coordinates only, committed as
// `packages/ci-vercel/deploy/secret-store.binding.json`.
message SecretStoreBinding {
  string kind = 1;
  // The store's HTTPS origin (an Infisical site, a Worker URL).
  string endpoint = 2;
  string project_id = 3;
  string environment = 4;
  string secret_path = 5;
  // The relay's read-only identity (trusts the Vercel team issuer).
  string relay_identity_id = 6;
  // The deploy workflow's identity (trusts GitHub Actions on main).
  string deploy_identity_id = 7;
  // The Vercel team the relay project lives in, `team_…`.
  string vercel_team_id = 8;
  // The HoBo claim bundle that hands the store to its owner.
  string claim_bundle_id = 9;
  // "pending" until every claim item is complete, then "claimed".
  string claim_state = 10;
  // The project holding the deploy credential (`VERCEL_TOKEN`), apart from
  // the relay's so the relay's identity cannot read it.
  string deploy_project_id = 11;
}
