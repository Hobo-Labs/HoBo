syntax = "proto3";
package hobo.ci.gh_actions.v1;


message StoredMachine {
  string id = 1;
  string name = 2;
}

message WorkerEvent {
  string type = 1;
  string machine_id = 2;
  double at_ms = 3;
  optional string detail = 4;
  optional uint32 busy = 5;
  optional uint32 slots = 6;
  optional bool paused = 7;
  optional string reason = 8;
  optional double job_id = 9;
  optional string repository = 10;
  optional string runner = 11;
  optional uint32 running = 12;
}
