syntax = "proto3";
package hobo.ci.gh_actions.v1;

message RelayOwnerDeviceAuthorization {
  string device_code = 1 [json_name = "device_code"];
  string user_code = 2 [json_name = "user_code"];
  string verification_uri = 3 [json_name = "verification_uri"];
  uint32 expires_in = 4 [json_name = "expires_in"];
  uint32 interval = 5 [json_name = "interval"];
}

message RelayOwnerTokenRequest {
  string device_code = 1 [json_name = "device_code"];
}

message RelayOwnerSession {
  string session_token = 1 [json_name = "session_token"];
  uint32 expires_in = 2 [json_name = "expires_in"];
}

message RelayOwnerCredentialRequest {
  string ref = 1 [json_name = "ref"];
  string scope = 2 [json_name = "scope"];
}

message RelayOwnerCredential {
  string token = 1 [json_name = "token"];
  uint32 expires_in = 2 [json_name = "expires_in"];
}

message RelayOwnerLoginError {
  string error = 1 [json_name = "error"];
  optional uint32 interval = 2 [json_name = "interval"];
}
