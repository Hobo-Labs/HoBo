# The fleet's own Turborepo remote cache: one content-addressed store every box
# job, ARC pod and GitHub-hosted runner reads and writes, so a main run replays
# what the merge queue built wherever its jobs land (docs/ci/findings/0144).
#
# Free and self-hosted: the open-source `turborepo-remote-cache` server with a
# local volume. Nothing here runs unless an operator starts it, and CI uses it
# only once the repository has all three of:
#   - variable HOBO_CI_TURBO_API  (this server's URL, reachable from every runner)
#   - variable TURBO_TEAM         (any slug, for example `hobo`)
#   - secret   TURBO_TOKEN        (the same value as HOBO_CI_TURBO_CACHE_TOKEN)
#
#   docker compose --env-file /abs/path/to/turbo-cache.env \
#     -f packages/ci-gh-actions/deploy/turbo-cache/compose.yml up -d
#
# The env file holds HOBO_CI_TURBO_CACHE_TOKEN (and the optional settings below);
# keep it outside the checkout and readable only by the operator.
#
# Fork pull requests get no token (GitHub withholds secrets from them), so they
# neither read nor write this cache.
name: hobo-ci-turbo-cache
services:
  turbo-cache:
    # 3.0.3, pinned by digest (multi-arch index).
    image: ducktors/turborepo-remote-cache:3.0.3@sha256:2ad6692bf9c5eed7a3c12f606820abd0af3b2b0f081c7d3bf40f2a015fe27a2f
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Loopback by default. To serve ARC pods or another box, bind the private
    # address they reach this host on; never a public one without TLS in front.
    ports:
      - "${HOBO_CI_TURBO_CACHE_BIND:-127.0.0.1}:${HOBO_CI_TURBO_CACHE_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      AUTH_MODE: static
      TURBO_TOKEN: ${HOBO_CI_TURBO_CACHE_TOKEN:?Set the cache token (the TURBO_TOKEN secret's value)}
      STORAGE_PROVIDER: local
      STORAGE_PATH: /var/lib/turbo-cache
      STORAGE_PATH_USE_TMP_FOLDER: "false"
      ENABLE_STATUS_LOG: "false"
    volumes:
      - turbo-cache-data:/var/lib/turbo-cache
volumes:
  turbo-cache-data:
    name: ${HOBO_CI_TURBO_CACHE_VOLUME:-hobo-ci-turbo-cache}
