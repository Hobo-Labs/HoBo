syntax = "proto3";

// Wire records for the CI project's GitHub connection: the configuration
// `hobo ci up` reads, the stored credential names, and the prepare step's
// report. No record carries a credential value.
package hobo.hobo_ci.v1;

// What `hobo ci up` needs to connect GitHub (the owner's environment).
message GithubConnectionConfig {
  // The relay's public HTTPS origin (HOBO_CI_PUBLIC_URL).
  string relay_url = 1;
  // The GitHub user who owns the App (HOBO_CI_GITHUB_OWNER / _OWNER_ID).
  string owner = 2;
  int64 owner_id = 3;
  // infisical | 1password (HOBO_CI_SECRET_STORE)
  string secret_store = 4;
}

// The prepare step's report for the GitHub connection.
message GithubConnectionStep {
  // Always "github-app".
  string id = 1;
  // created | unchanged | would-create
  string outcome = 2;
  string detail = 3;
}

// Where the App's credentials live: references only.
message GithubAppCredentialRefs {
  // infisical | 1password
  string store = 1;
  // HOBO_CI_GITHUB_APP_PRIVATE_KEY ... HOBO_CI_GITHUB_APP_ID, as references.
  repeated string references = 2;
}
