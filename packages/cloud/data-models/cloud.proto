syntax = "proto3";

package hobo.cloud.v1;


message ResourceIntent {
  string name = 1;
  string port = 2;
  repeated string require = 3;
  repeated string prefer = 4;
  string negotiation = 5;
  repeated string deps = 6;
  string region = 7;
  string objective = 8;
  PlacementCriteria placement = 9;
  repeated string ready_deps = 10;
  repeated string completed_deps = 11;
}


message PlacementPropertySelector {
  string key = 1;
  string op = 2;
  repeated string values = 3;
}

message PlacementAffinityRule {
  string mode = 1;
  string target_port = 2;
  string scope = 3;
}

message PlacementSpread {
  string dimension = 1;
}

message PlacementPickN {
  uint32 count = 1;
}

message PlacementCriteria {
  repeated PlacementPropertySelector selectors = 1;
  repeated PlacementAffinityRule affinities = 2;
  PlacementSpread spread = 3;
  PlacementPickN pick_n = 4;
}

message ResourceDefinitionRef {
  string id = 1;
  string provider_id = 2;
  string port = 3;
  repeated string features = 4;
  repeated string regions = 5;
  uint32 specificity = 6;
  uint32 priority = 7;
  string cost_sku = 8;
  string cost_unit = 9;
  string marginal_price = 10;
  optional string pricing_status = 11;
  optional string product_id = 12;
}

message CapabilityVerdict {
  string kind = 1;
  repeated string missing = 2;
}

message RankedCandidate {
  string definition_id = 1;
  string provider_id = 2;
  uint32 specificity = 3;
  uint32 priority = 4;
}

message RejectedCandidate {
  string definition_id = 1;
  string reason = 2;
}

message MatchDecided {
  string deployment_id = 1;
  string resource = 2;
  string winner = 3;
  string provider_id = 4;
  string port = 5;
  uint32 specificity = 6;
  string objective = 7;
  string region = 8;
  string rationale = 9;
  repeated RankedCandidate ranking = 10;
  repeated RejectedCandidate rejected_candidates = 11;
  bool tie = 12;
  string catalog_content_hash = 13;
  string product_id = 14;
  repeated string applied_rows = 15;
  map<string, string> realization_parameters = 16;
  repeated string non_portable_rows = 17;
}

message ResourcePlan {
  string name = 1;
  string port = 2;
  string provider = 3;
  repeated string deps = 4;
  string strategy = 5;
  string region = 6;
  string deployment_id = 7;
  string product_id = 8;
  map<string, string> realization_parameters = 9;
  repeated string non_portable_rows = 10;
  repeated string ready_deps = 11;
  repeated string completed_deps = 12;
}

message DeploymentPlan {
  string schema = 1;
  repeated ResourcePlan resources = 2;
  repeated string dependency_order = 3;
  string objective = 4;
}

message DeploymentPlanned {
  string deployment_id = 1;
  string plan_hash = 2;
  DeploymentPlan plan = 3;
}

message PlanRemediation {
  string resource = 1;
  string code = 2;
  string required_port = 3;
  repeated string required_features = 4;
  repeated string missing = 5;
  string suggested_provider = 6;
  string remediation = 7;
}

message DeploymentPlanRejected {
  string deployment_id = 1;
  string reason = 2;
  repeated PlanRemediation remediations = 3;
}

message RegistryCatalogEntry {
  string provider_id = 1;
  repeated ResourceDefinitionRef definitions = 2;
  string manifest_index_digest = 3;
}

message ProviderApprovedRecord {
  string provider_id = 1;
  string approved_by = 2;
}

message ResourceDefinitionCostRecord {
  string sku = 1;
  string unit = 2;
  string marginal_price = 3;
  optional string pricing_status = 4;
}

message ResourceDefinitionEventRecord {
  string id = 1;
  optional string product_id = 2;
  string provider_id = 3;
  string port = 4;
  repeated string features = 5;
  repeated string regions = 6;
  uint32 specificity = 7;
  uint32 priority = 8;
  ResourceDefinitionCostRecord cost = 9;
}

message ResourceDefinitionChanged {
  string provider_id = 1;
  ResourceDefinitionEventRecord definition = 2;
  string manifest_index_digest = 3;
}


message IacProgram {
  string program_id = 1;
  string deployment_id = 2;
  string resource_id = 3;
  string provider = 4;
  string driver = 5;
  string action = 6;
  string stack_name = 7;
  ResourcePlan resource = 8;
}

message ScopedCredential {
  string id = 1;
  string scope = 2;
  uint32 ttl_seconds = 3;
  bool ambient = 4;
}

message ExecOutputRecord {
  string exec_id = 1;
  string stream = 2;
  string line = 3;
}

message ExecDiffRecord {
  string exec_id = 1;
  string summary = 2;
  uint32 changes = 3;
}

message ExecSucceededRecord {
  string exec_id = 1;
  string outputs_hash = 2;
  map<string, string> outputs = 3;
}

message ExecFailedRecord {
  string exec_id = 1;
  string classification = 2;
  string reason = 3;
}

message ResourceActorSnapshot {
  string deployment_id = 1;
  string resource_id = 2;
  string state = 3;
  uint32 sequence = 4;
  map<string, string> outputs = 5;
  repeated string deps = 6;
}

message ResourceProvisioningRecord {
  string deployment_id = 1;
  string resource_id = 2;
  string exec_id = 3;
  string program_hash = 4;
  optional string spec_hash = 5;
  optional string provider_id = 6;
}

message ResourceProvisionedRecord {
  string deployment_id = 1;
  string resource_id = 2;
  map<string, string> outputs = 3;
  string exec_id = 4;
  optional string spec_hash = 5;
}

message ResourceFailedRecord {
  string deployment_id = 1;
  string resource_id = 2;
  string reason = 3;
  string classification = 4;
  bool crossed_no_go_threshold = 5;
}

message ResourceDestroyingRecord {
  string deployment_id = 1;
  string resource_id = 2;
  string reason = 3;
}

message ResourceDestroyedRecord {
  string deployment_id = 1;
  string resource_id = 2;
  string final_state_hash = 3;
}

message DeploymentDeployedRecord {
  string deployment_id = 1;
  string set_id = 2;
  repeated string resource_ids = 3;
}

message DeploymentRolledBackRecord {
  string deployment_id = 1;
  string target_set_id = 2;
  string reason = 3;
}


message CredentialAuditScope {
  string port = 1;
  string resource = 2;
  string action = 3;
}

message CredentialGrantAudit {
  string grant_id = 1;
  string svid_subject = 2;
  CredentialAuditScope scope = 3;
  string token_ref = 4;
  string status = 5;
  string granted_at = 6;
  string used_at = 7;
  string revoked_at = 8;
  string revoked_reason = 9;
  uint32 use_count = 10;
}

message CredentialAuditTimelineEntry {
  uint32 seq = 1;
  string type = 2;
  string grant_id = 3;
  string event_id = 4;
  string stream_id = 5;
  string time = 6;
  string actor_kind = 7;
  string actor_id = 8;
  string tool = 9;
  string subject = 10;
  string effect = 11;
  string reason = 12;
  string name = 13;
  string ref = 14;
  string code = 15;
  string ticket_id = 16;
  string target = 17;
  string channel = 18;
}

message CredentialAuditRecord {
  string correlation_id = 1;
  repeated CredentialGrantAudit grants = 2;
  repeated string identity_ids = 3;
  repeated string session_ids = 4;
  repeated CredentialAuditTimelineEntry timeline = 5;
  uint32 grant_count = 6;
  uint32 use_count = 7;
  uint32 revoke_count = 8;
  string tenant = 9;
  repeated string connection_ids = 10;
  repeated string config_names = 11;
  repeated string secret_value_refs = 12;
  repeated string migration_ids = 13;
  uint32 config_resolve_count = 14;
  uint32 secret_access_count = 15;
  uint32 migration_event_count = 16;
}

message ResolvedDeploymentSetRecord {
  string schema_version = 1;
  string set_id = 2;
  string tenant = 3;
  string environment = 4;
  string camp_id = 5;
  string plan_hash = 6;
  string content_hash = 7;
  string gatekeeper_decision_id = 8;
  string gatekeeper_decision = 9;
}

message AttestedPrincipalRecord {
  string svid_subject = 1;
  string identity_id = 2;
  string tenant = 3;
  string code_digest = 4;
  string component_image_digest = 5;
  string attestation_state = 6;
  string isolation_tier = 7;
}

message SecretFreeStatusRecord {
  string schema_version = 1;
  string resource_id = 2;
  string state = 3;
  bool secret_free = 4;
}

message SafetyEnvelopeRecord {
  string schema_version = 1;
  string blast_radius = 2;
  bool reversible = 3;
  uint32 spend_cap_usd = 4;
  uint32 estimated_spend_usd = 5;
  bool self_causation = 6;
  uint32 max_attempts = 7;
  uint32 attempts_used = 8;
  bool requires_lane = 9;
}

message A2HHandoffRecord {
  string schema_version = 1;
  string incident_id = 2;
  string signal = 3;
  string tenant = 4;
  string environment = 5;
  string deployment_id = 6;
  string set_id = 7;
  string deadline = 8;
  string obligation_id = 9;
}


message TopologyNode {
  string id = 1;
  string kind = 2;
  string label = 3;
  string port = 4;
  string provider_id = 5;
  string region = 6;
  string lifecycle = 7;
}

message TopologyEdge {
  string from = 1;
  string to = 2;
  string kind = 3;
  string region = 4;
}

message TopologyViewRow {
  string deployment_id = 1;
  string bindle_hash = 2;
  repeated TopologyNode nodes = 3;
  repeated TopologyEdge edges = 4;
}

message LaneGrantRecord {
  string lane_id = 1;
  string tenant = 2;
  string membership = 3;
  bool fork_on_touch = 4;
  bool baseline_single_writer_lease = 5;
  bool baseline_mutation = 6;
  string external_side_effects = 7;
}
