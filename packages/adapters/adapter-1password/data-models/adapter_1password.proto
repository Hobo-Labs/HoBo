syntax = "proto3";

package hobo.adapter_1password.v1;

// Where a HoBo deployment's secrets live in 1Password: one vault, one
// Password item per secret (title = the secret's name, the value in the
// built-in concealed `password` field). Coordinates only: the credential the
// SDK client signs in with (a service-account token, or the owner's desktop
// app) never appears in a record. CUE constraints: adapter_1password.cue.
message OnePasswordBinding {
  // The vault's id (26 lowercase letters and digits).
  string vault_id = 1;
  // How the injected client signs in: "service-account" or "desktop-app".
  string auth_mode = 2;
  // The desktop app's account name or id, for "desktop-app" (not a secret).
  string account_name = 3;
}

// A reference to one secret: never its value.
message OnePasswordSecretRef {
  string vault_id = 1;
  string item_id = 2;
  string field_id = 3;
}
