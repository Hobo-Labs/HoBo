syntax = "proto3";

package hobo.packs.better_auth.v1;

message BetterAuthBundlePortRefsRecord {
  string relational_bindle = 1;
  string http_bindle = 2;
  string signing_secret_ref = 3;
}

message BetterAuthParsedConfigRecord {
  string contract = 1;
  string adapter_id = 2;
  string base_path = 3;
  string secret_ref = 4;
  string database_profile = 5;
  bool email_and_password_enabled = 6;
  repeated string social_providers = 7;
  bool organizations_enabled = 8;
}

message BetterAuthBundlePlanRecord {
  string pack_id = 1;
  string descriptor_id = 2;
  string claims_mapping_version = 3;
  repeated string required_ports = 4;
  string adapter_id = 5;
  string base_path = 6;
  string route_pattern = 7;
  BetterAuthBundlePortRefsRecord ports = 8;
  BetterAuthParsedConfigRecord parsed_config = 9;
}

message BetterAuthRelationalMigrationRecord {
  string pack_id = 1;
  string relational_bindle = 2;
  string database_profile = 3;
  string migration_plan_contract = 4;
  string migration_plan_digest = 5;
  uint32 expand_step_count = 6;
}