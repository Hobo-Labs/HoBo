syntax = "proto3";

package hobo.bindles.v1;

message ResourceDescriptor {
  string kind = 1;
  string name = 2;
  string stable_id = 3;
  repeated string port_ref = 4;
  repeated string allow_verbs = 5;
  repeated string declared_allow = 6;
}

message LoweringDescriptor {
  string lowers_to = 1;
  string kind = 2;
  string name = 3;
  string handle_stable_id = 4;
  repeated string port_ref = 5;
  string verb = 6;
}

message CatalogEntry {
  string factory = 1;
  repeated string port_ref = 2;
  repeated string allow_verbs = 3;
}

message BindleEdge {
  string from = 1;
  string to = 2;
}

message ProviderAnnotation {
  string provider = 1;
  string option = 2;
}

message BindleResourceRecord {
  string kind = 1;
  string name = 2;
  string stable_id = 3;
  repeated string declared_allow = 4;
  repeated ProviderAnnotation annotations = 5;
  repeated string depends_on = 6;
}

message BindleGraph {
  string name = 1;
  map<string, BindleResourceRecord> resources = 2;
  repeated BindleEdge edges = 3;
}

// The continuity trait's config (`continuity()`, src/continuity.ts): a
// stateful resource's HA/DR, replication and migration policy.
message ContinuityPolicy {
  string tier = 1;
  string on_loss = 2;
  int64 recovery_point_ms = 3;
  int64 failover_after_ms = 4;
  int32 standbys = 5;
  string migration = 6;
  int64 backup_every_ms = 7;
  int32 backups_kept = 8;
  optional int64 monthly_budget_micros = 9;
}
