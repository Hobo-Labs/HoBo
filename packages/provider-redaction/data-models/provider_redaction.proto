syntax = "proto3";
package hobo.provider_redaction.v1;

// What one provider adds to the shared redaction, as data: each pattern's
// source and flags, which `redactionPattern` parses into a RedactionPattern.
message PatternSource {
  string source = 1;
  string flags = 2;
}

message RedactionProfileDescriptor {
  repeated PatternSource patterns = 1;
  repeated PatternSource fallbacks = 2;
  PatternSource keep = 3;
  bool decode_percent = 4;
  bool collapse_whitespace = 5;
}
