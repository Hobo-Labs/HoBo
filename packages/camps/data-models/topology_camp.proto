syntax = "proto3";

package hobo.camps.v1;

message CampTopology {
  string id = 1;
  string env = 2;
  string env_type = 3;
  string derived_provider_id = 4;
  string enclosing_yard_id = 5;
  repeated string require = 6;
  repeated string prefer = 7;
  map<string, string> labels = 8;
  repeated string runtime_requirements = 9;
  string logical_id = 10;
}

message CampContract {
  optional string id = 1;
  optional string logical_id = 2;
  optional string env = 3;
  optional string env_type = 4;
  repeated string require = 5;
  repeated string prefer = 6;
  map<string, string> labels = 7;
  repeated string runtime_requirements = 8;
}
