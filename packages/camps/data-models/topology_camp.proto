syntax = "proto3";

package hobo.camps.v1;

import "google/protobuf/struct.proto";

message CampTopology {
  string id = 1;
  string env = 2;
  string env_type = 3;
  string derived_provider_id = 4;
  string enclosing_yard_id = 5;
  repeated string require = 6;
  repeated string prefer = 7;
  map<string, string> labels = 8;
  repeated string runtime_requirements = 9;
  string logical_id = 10;
}

message CampContract {
  optional string id = 1;
  optional string logical_id = 2;
  optional string env = 3;
  optional string env_type = 4;
  repeated string require = 5;
  repeated string prefer = 6;
  map<string, string> labels = 7;
  repeated string runtime_requirements = 8;
}

message ProviderSelection {
  string kind = 1;
  string provider_id = 2;
  string selector = 3;
  option deprecated = true;
}

message LegacyCampMappingSelector {
  optional string resource_kind = 1;
  optional string resource_name = 2;
  optional string port_ref = 3;
  map<string, string> labels = 4;
}

message LegacyCampMappingRule {
  LegacyCampMappingSelector selector = 1;
  optional string definition_id = 2;
  optional string resolver_id = 3;
  optional string class_name = 4;
  repeated string require = 5;
  repeated string prefer = 6;
  google.protobuf.Struct properties = 7;
}

message ParsedLegacyCampMappings {
  repeated LegacyCampMappingRule resource_mappings = 1;
  string deprecation = 2;
}
