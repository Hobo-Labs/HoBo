syntax = "proto3";
package hobo.cd.vercel.v1;

// The committed store coordinates HoBo.CD on Vercel signs in with
// (deploy/secret-store.binding.json): the fields of SecretStoreBinding it
// reads. Ids only; no value. relay_identity_id is the record's name for the
// workload identity.
message CdStoreBinding {
  string kind = 1;
  string endpoint = 2;
  string project_id = 3;
  string environment = 4;
  string secret_path = 5;
  string relay_identity_id = 6;
}

// /readyz while CD cannot compose: why, by code.
message CdNotReady {
  bool ready = 1;
  bool started = 2;
  string code = 3;
}

// /healthz: the function is up, and the build's commit.
message CdHealth {
  bool ok = 1;
  string commit = 2;
}
