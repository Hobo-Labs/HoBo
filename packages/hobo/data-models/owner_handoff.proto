syntax = "proto3";

package hobo.hobo.handoff.v1;

message OwnerHandoffRegistration {
  OwnerHandoffOffer offer = 1;
  string collect_digest = 2;
}

message OwnerHandoffOffer {
  string mailbox_id = 1;
  string recipient_key = 2;
  string binding = 3;
  double expires_at_ms = 4;
  string key_proof = 5;
}

message OwnerHandoffEnvelope {
  string sender_key = 1;
  string iv = 2;
  string ciphertext = 3;
}

message OwnerHandoffCollected {
  OwnerHandoffEnvelope envelope = 1;
}

message OwnerHandoffSealedAnswer {
  uint32 v = 1;
  string mailbox_id = 2;
  string binding = 3;
  map<string, string> answer = 4;
}
