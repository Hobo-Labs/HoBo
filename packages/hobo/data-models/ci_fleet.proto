syntax = "proto3";
package hobo.ci.fleet.v1;

message CiFleetHost {
  string provider = 1;
  string id = 2;
  string hostname = 3;
  string state = 4;
  string plan = 5;
  string ipv4 = 6;
  string actions_lock = 7;
}

message CiFleetStatus {
  string provider = 1;
  repeated CiFleetHost hosts = 2;
}

message CiFleetPowerAction {
  string provider = 1;
  CiFleetHost host = 2;
  string action = 3;
  string action_id = 4;
  string action_state = 5;
}
