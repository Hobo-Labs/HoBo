syntax = "proto3";
package hobo.componentize.v1;

message ToolchainLockRecord {
  string jco = 1;
  string componentize_js = 2;
  string wasm_tools = 3;
  string wasmtime = 4;
}

message ComponentBuildRecord {
  string path = 1;
  string media_type = 2;
  string digest = 3;
  uint64 byte_length = 4;
  string wit_world = 5;
  string metadata_digest = 6;
  ToolchainLockRecord toolchain = 7;
}

message OciBlobRecord {
  string media_type = 1;
  string digest = 2;
  uint64 size = 3;
}

message OciManifestRecord {
  string artifact_type = 1;
  string manifest_digest = 2;
  OciBlobRecord config = 3;
  repeated OciBlobRecord layers = 4;
  map<string, string> annotations = 5;
}

message WasmtimeInvocationRecord {
  string component_digest = 1;
  string export_name = 2;
  string engine_version = 3;
  int32 exit_code = 4;
  string stdout = 5;
}
