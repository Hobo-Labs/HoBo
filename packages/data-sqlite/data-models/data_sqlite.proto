// Wire records for the SQLite data engine (ADR-0177).
//
// The engine implements the @hobo/data-core SPI; the records it shares with
// every engine (datasets, envelopes, digests, declarations) are defined once
// in packages/data-core/data-models/data_core.proto. These are the records
// that are SQLite's own: how a store is opened, the rows of its metadata
// tables, and the evidence its dual-run port reports.
//
// No field is a credential — a SQLite store is a file path — and no evidence
// record carries a row.

syntax = "proto3";

package hobo.data.sqlite.v1;

message SqliteEngineOptions {
  // Store file path, or ":memory:". A file is required for the schema port.
  string path = 1;
}

// One row of hobo_data_journal: the transactional outbox capture reads.
// `record_json` is the canonical record; absent for a delete. A row exists
// only while some subscription has yet to acknowledge it.
message SqliteJournalRow {
  uint64 seq = 1;
  string dataset = 2;
  string tenant_id = 3;
  string key = 4;
  string op = 5; // upsert | delete
  optional string record_json = 6;
  // The journal head when the row's write began: rows that share it are one
  // transaction, which a capture batch never splits. Absent on a row written
  // before writes were marked.
  optional uint64 tx = 7;
}

// One row of hobo_data_fences: a durable write fence.
message SqliteFenceRow {
  string dataset = 1;
  string tenant_id = 2; // empty string fences the whole dataset
  string fence_token = 3; // random; a credential, never derived or logged
  string fenced_at = 4;
}

// One row of hobo_data_watermarks: how far one source has been applied.
message SqliteWatermarkRow {
  string dataset = 1;
  string source = 2;
  string position = 3;
}

// One row of hobo_data_subscriptions: a capture reader and its progress.
message SqliteSubscriptionRow {
  string name = 1;
  string dataset = 2;
  uint64 start_position = 3;
  uint64 ack_position = 4;
  // The tenant the name is bound to ("" spans the dataset); unset on a row
  // written before the tenant was kept.
  optional string tenant_id = 5;
}

message SqliteDualSideEvidence {
  uint64 count = 1;
  string digest = 2; // 64 lowercase hex characters
}

// Digest evidence over both stores of a dual run. Counts and digests only.
message DataDualEvidence {
  SqliteDualSideEvidence source = 1;
  SqliteDualSideEvidence target = 2;
  bool consistent = 3;
  string fidelity = 4; // always "live"
}

message CreateSqliteDataDualPortOptions {
  string source_path = 1;
  string target_path = 2;
  optional string table = 3;
  optional string tenant = 4;
}
