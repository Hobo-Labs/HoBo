syntax = "proto3";

package hobo.core.slo.v1;

message SloMetadataRecord {
  string name = 1;
  map<string, string> labels = 2;
}

message SloTelemetryRecord {
  string query = 1;
  optional string unit = 2;
}

message SloTelemetryQueryRecord {
  SloTelemetryRecord telemetry = 1;
}

message SloRatioMetricRecord {
  optional bool counter = 1;
  SloTelemetryQueryRecord good = 2;
  SloTelemetryQueryRecord total = 3;
}

message SloIndicatorRecord {
  SloRatioMetricRecord ratio_metric = 1;
}

message SloCalendarRecord {
  string start_time = 1;
  string time_zone = 2;
}

message SloTimeWindowRecord {
  string duration = 1;
  optional bool is_rolling = 2;
  optional SloCalendarRecord calendar = 3;
}

message SloObjectiveRecord {
  string display_name = 1;
  double target = 2;
  optional string time_slice_window = 3;
  optional double time_slice_target = 4;
}

message SloBurnThresholdRecord {
  string name = 1;
  double threshold = 2;
  string lookback_window = 3;
  string sampling_interval = 4;
}

message SloSpecRecord {
  string service = 1;
  SloIndicatorRecord indicator = 2;
  SloTimeWindowRecord time_window = 3;
  string budgeting_method = 4;
  repeated SloObjectiveRecord objectives = 5;
  repeated SloBurnThresholdRecord burn_rate_thresholds = 6;
}

message SloDefinitionRecord {
  string schema = 1;
  string api_version = 2;
  string kind = 3;
  SloMetadataRecord metadata = 4;
  SloSpecRecord spec = 5;
}
