syntax = "proto3";

package hobo.core.slo.v1;

message SloMetadataRecord {
  string name = 1;
  map<string, string> labels = 2;
}

message SloTelemetryRecord {
  string query = 1;
  optional string unit = 2;
}

message SloTelemetryQueryRecord {
  SloTelemetryRecord telemetry = 1;
}

message SloRatioMetricRecord {
  optional bool counter = 1;
  SloTelemetryQueryRecord good = 2;
  SloTelemetryQueryRecord total = 3;
}

message SloIndicatorRecord {
  SloRatioMetricRecord ratio_metric = 1;
}

message SloCalendarRecord {
  string start_time = 1;
  string time_zone = 2;
}

message SloTimeWindowRecord {
  string duration = 1;
  optional bool is_rolling = 2;
  optional SloCalendarRecord calendar = 3;
}

message SloObjectiveRecord {
  string display_name = 1;
  double target = 2;
  optional string time_slice_window = 3;
  optional double time_slice_target = 4;
}

message SloBurnThresholdRecord {
  string name = 1;
  double threshold = 2;
  string lookback_window = 3;
  string sampling_interval = 4;
}

message SloSpecRecord {
  string service = 1;
  SloIndicatorRecord indicator = 2;
  SloTimeWindowRecord time_window = 3;
  string budgeting_method = 4;
  repeated SloObjectiveRecord objectives = 5;
  repeated SloBurnThresholdRecord burn_rate_thresholds = 6;
}

message SloDefinitionRecord {
  string schema = 1;
  string api_version = 2;
  string kind = 3;
  SloMetadataRecord metadata = 4;
  SloSpecRecord spec = 5;
}

message SliSampleRecord {
  string time = 1;
  double good = 2;
  double total = 3;
}

message SloWindowEvaluationRecord {
  string start_time = 1;
  string end_time = 2;
  string status = 3;
  optional double good = 4;
  optional double total = 5;
  optional double errors = 6;
  optional double error_budget = 7;
  optional double burn_rate = 8;
  optional double remaining_budget_ratio = 9;
  uint32 slices = 10;
}

message SloBurnEvaluationRecord {
  string name = 1;
  double threshold = 2;
  bool triggered = 3;
  SloWindowEvaluationRecord window = 4;
  string lookback_window = 5;
  string sampling_interval = 6;
}

message SloObjectiveEvaluationRecord {
  string display_name = 1;
  double target = 2;
  string status = 3;
  SloWindowEvaluationRecord window = 4;
  repeated SloBurnEvaluationRecord burn_windows = 5;
}

message SloEvaluationRecord {
  string schema = 1;
  string slo_name = 2;
  string service = 3;
  string evaluated_at = 4;
  string status = 5;
  repeated SloObjectiveEvaluationRecord objectives = 6;
}

message SloDeclaredRecord {
  string schema = 1;
  string slo_name = 2;
  string definition_hash = 3;
}

message SloBudgetObservationRecord {
  string schema = 1;
  string slo_name = 2;
  string objective = 3;
  string window = 4;
  double good = 5;
  double total = 6;
  double burn_rate = 7;
  double remaining_budget_ratio = 8;
}

message SloBudgetProjectionRecord {
  string slo_name = 1;
  string objective = 2;
  bool gateable = 3;
  double consumed_budget_ratio = 4;
  double remaining_budget_ratio = 5;
  bool exhausted = 6;
  optional double last_seq = 7;
  optional string last_event_id = 8;
  optional string last_event_hash = 9;
  optional string reason = 10;
}
