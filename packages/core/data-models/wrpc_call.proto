syntax = "proto3";

package hobo.core.v1;

message WrpcCallEvent {
  string type = 1;
  string component_id = 2;
  string import_interface = 3;
  string provider_id = 4;
  string export_interface = 5;
  string operation = 6;
  string boundary_mode = 7;
  string transport = 8;
  string codec = 9;
  optional string deadline = 10;
  optional string outcome = 11;
  optional string failure_kind = 12;
  optional string cancellation = 13;
}
