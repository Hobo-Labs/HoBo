syntax = "proto3";

package hobo.core.v1;

message WrpcLinkManifestWire {
  string interface_id = 1;
  string version = 2;
  string minor = 3;
  string stability = 4;
  string floor = 5;
}

message WrpcLinkManifestEntry {
  string component_id = 1;
  string import_interface = 2;
  string provider_id = 3;
  string export_interface = 4;
  WrpcLinkManifestWire wire = 5;
}

message WrpcLinkManifest {
  string schema = 1;
  repeated WrpcLinkManifestEntry links = 2;
}
