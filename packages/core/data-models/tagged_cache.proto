syntax = "proto3";

package hobo.core.cache.v1;

message TaggedCacheTagEpochRecord {
  string tag = 1;
  string epoch = 2;
}

message TaggedCacheEntryRecord {
  string value = 1;
  repeated TaggedCacheTagEpochRecord tag_epochs = 2;
}

message TaggedCacheReadRecord {
  bool hit = 1;
  optional string value = 2;
}

message CacheEntryRecord {
  string key = 1;
  bytes value = 2;
  uint32 ttl_ms = 3;
  repeated string tags = 4;
}

message CacheInvalidateCommandRecord {
  string tag = 1;
}

message CacheReadRecord {
  bool hit = 1;
  optional bytes value = 2;
}
