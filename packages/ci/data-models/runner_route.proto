syntax = "proto3";
package hobo.ci.v1;

// One step of a runner order. `key` is `fleet` (the HoBo isolated fleet),
// `machine` (a connected machine or an adopted self-hosted runner), `github`
// (GitHub-hosted) or a hosted provider id. A limit of zero means the step has
// none.
message RunnerOrderStep {
  string key = 1;
  // `github` only: use it while the account is under this share of the
  // Actions minutes its plan includes.
  uint32 minutes_limit_percent = 2;
  // Hosted providers only: use it while the account has spent less than this
  // many whole US dollars on it this calendar month.
  uint32 spend_limit_usd = 3;
}

// When a routed job that failed for a reason outside its own steps is run
// again, and where.
message RunnerRetryPolicy {
  bool enabled = 1;
  // `any` walks the order as written, `same` tries the failed step first,
  // `other` tries it last.
  string runner = 2;
  // Retries per run: 1 or 2.
  uint32 max = 3;
}

// The ordered runner preference of an account or a repository. A job takes the
// first step it named that can run it now.
message RunnerOrder {
  repeated RunnerOrderStep steps = 1;
  // Skip a hosted runner type that stopped starting jobs. Absent means on.
  optional bool skip_unhealthy = 2;
  RunnerRetryPolicy retry = 3;
  // vCPUs an `auto` relay input asks for. Zero means the default size.
  uint32 auto_size_vcpus = 4;
}

// What a relay job allows for one step: the labels it would ask that step for.
message RunnerRelayInput {
  string key = 1;
  repeated string labels = 2;
}

// One relay job's question: which runner should the job behind it ask for.
message RunnerRouteRequest {
  string repository = 1;
  bool private = 2;
  // The run's head is a fork of the repository.
  bool fork = 3;
  string event = 4;
  double run_id = 5;
  uint32 run_attempt = 6;
  // The relay job's id in its workflow file.
  string job = 7;
  repeated RunnerRelayInput inputs = 8;
  string actor_id = 9;
  string triggering_actor_id = 10;
  string workflow_ref = 11;
}

// A step the walk passed over, and why.
message RunnerRouteSkip {
  string key = 1;
  string reason = 2;
  // The measured value behind the reason, when there is one.
  string detail = 3;
}

// The answer, kept so "where did this job run, and why" can be read later.
message RunnerRouteDecision {
  // `routed`: `runner` can take the job now. `waiting`: every runner that fits
  // is busy, so the job queues on `runner`. `none`: nothing can take it and
  // `reason` says why.
  string outcome = 1;
  string runner = 2;
  string step = 3;
  string machine_id = 4;
  repeated RunnerRouteSkip skipped = 5;
  // Steps the relay named that the order leaves out; they are never tried.
  repeated string not_in_order = 6;
  string reason = 7;
  // Every later step refused, so a runner type skipped as unhealthy took the job.
  bool unhealthy_fallback = 8;
}
