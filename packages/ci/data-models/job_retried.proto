syntax = "proto3";
package hobo.ci.v1;

message JobRetried {
  string type = 1;
  string account_id = 2;
  string repository = 3;
  double run_id = 4;
  uint32 attempt = 5;
  double relay_job_id = 6;
  string relay_job = 7;
  double job_id = 8;
  string job_name = 9;
  string kind = 10;
  string target = 11;
  string failed_step = 12;
  string failed_machine_id = 13;
  double at_ms = 14;
  string rerun = 15;
  uint32 rerun_status = 16;
}
