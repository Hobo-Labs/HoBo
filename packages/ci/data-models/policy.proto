syntax = "proto3";
package hobo.ci.v1;
import "google/protobuf/struct.proto";

// Kubernetes only: an ARC AutoscalingRunnerSet that HoBo thinly reconciles.
// `name` is the AutoscalingRunnerSet `runnerScaleSetName`. HoBo never installs ARC.
message CiPolicyKubernetesScaleSet {
  string name = 1;
  uint32 min_runners = 2;
  uint32 max_runners = 3;
  string namespace = 4;
}
// Kubernetes only: a Dagger Engine HoBo checks for readiness. HoBo never installs it.
message CiPolicyDaggerEngine {
  string name = 1;
}
message CiPolicyAgent37Size {
  uint32 cpu = 1;
  uint32 memory = 2;
  uint32 disk = 3;
}
message CiPolicyAgent37Network {
  repeated string allow = 1;
}
message CiPolicyAgent37Budget {
  double limit_micros = 1;
  string period = 2;
  uint32 max_creates_per_hour = 3;
}
message CiPolicyAgent37Pool {
  uint32 min_boxes = 1;
  uint32 max_boxes = 2;
  string type = 3;
  CiPolicyAgent37Size size = 4;
  string region = 5;
  string template = 6;
  uint32 idle_ttl_seconds = 7;
  uint32 job_timeout_seconds = 8;
  repeated string labels = 9;
  CiPolicyAgent37Network network = 10;
  CiPolicyAgent37Budget budget = 11;
  bool allow_above_free_tier = 12;
}
// Authored intent only. Financial observations and leases live in separate records.
message CiPolicyProvider {
  string id = 1;
  string kind = 2;
  string connection_ref = 3;
  string runs_on = 4;
  bool enabled = 5;
  oneof capacity {
    CiPolicyKubernetesScaleSet scale_set = 6;
    CiPolicyDaggerEngine engine = 7;
    CiPolicyAgent37Pool pool = 9;
  }
  // Vercel only: "vercel", "local" or "remote".
  string location = 8;
}
message CiPolicyPool {
  string label = 1;
  string os = 2;
  string architecture = 3;
}
message CiPolicyBudget {
  string scope = 1;
  string currency = 2;
  double limit_micros = 3;
  string period = 4;
  string time_zone = 5;
}
message CiPolicyThreshold {
  double fraction = 1;
  repeated string allow = 2;
}
message CiPolicyRouting {
  string strategy = 1;
  string no_eligible_provider = 2;
  string unknown_allocation = 3;
}
message DesiredCiPolicy {
  string account_id = 1;
  string tenant_id = 2;
  CiPolicyPool pool = 3;
  repeated CiPolicyProvider providers = 4;
  CiPolicyBudget budget = 5;
  CiPolicyRouting routing = 6;
  repeated CiPolicyThreshold thresholds = 7;
  // Shared hobo.budget-policy/v1 authoring JSON, parsed by @hobo/core.
  google.protobuf.Struct budget_policy = 8;
}
