syntax = "proto3";

package hobo.cloud_providers.v1;

// The provider→composition hand-off (ADR-0157).
//
// A provider package is a layer-2 adapter and may not import `@hobo/yards`
// (layer 3), so it cannot return a parsed `Yard`. It publishes its allocatable
// catalog as data instead, and this is the wire form of that data. Modelling it
// here is what stops the hand-off from being an undocumented structural
// convention that five provider packages each re-invent.
//
// Two invariants are load-bearing and enforced by the matching CUE:
//  1. A row must constrain product_id or connectivity_id (or both). A row that
//     constrains neither would read as a portability claim it does not make —
//     the same rule `YardBindingRecord` carries, restated because this record
//     crosses the boundary before `parseYardBindings` ever sees it.
//  2. Rows are a set keyed by (profile, product_id, connectivity_id) and sorted
//     on that tuple. Repetition order carries no preference: ADR-0151 forbids
//     authoring order from influencing selection, which is hard gates then
//     lexicographic ranking, never a weighted score.
//
// A catalog says what a provider *is able to* allocate. It is not a selection,
// a mapping, a pool, or a record of anything running, so several rows per
// capability profile is the normal case rather than an ambiguity.
//
// properties are provider-native refs only. A credential-shaped key is refused
// at the parse boundary; non-string JSON values are carried as canonical JSON
// text in this wire form.
message ProviderCatalogRowRecord {
  string profile = 1;
  string product_id = 2;
  string connectivity_id = 3;
  map<string, string> properties = 4;
}

// One provider's published catalog: the provider id, the regions it publishes,
// and every row it can allocate. Derived purely from the provider's own slot
// factories — it carries no timestamp, because nothing about it depends on when
// it was computed.
message ProviderYardSpecRecord {
  string provider = 1;
  repeated string regions = 2;
  repeated ProviderCatalogRowRecord bindings = 3;
}

// One provider's constants-only parity projection: a level plus the
// denominator that backs it. Produced by `toProviderParityRecord()` over
// `providerParity()` in src/parity.ts.
//
// This is a read model, never a deployment decision. Both counts are
// recomputed from code — catalog_count from the provider's full allocatable
// Yard catalog, resolved_count from the provider package's
// `*_RESOLVED_PRODUCT_IDS` constant — so nothing here is a hand-written claim.
// level is exactly "P0" or "L1": P0 iff resolved_count == 0, L1 iff
// resolved_count > 0. That L1 is a candidate signal (resolvers declared), not
// the council's full L1 (fake transport + six lifecycle cases + PACT), which
// this record cannot evidence; L2/L3/P2/P3 need executed evidence and are
// rejected here. The matching CUE enforces all of that, plus
// resolved_count <= catalog_count and denominator ==
// "<resolved_count>/<catalog_count>".
message ProviderParityRowRecord {
  string provider = 1;
  string level = 2;
  uint32 catalog_count = 3;
  uint32 resolved_count = 4;
  string denominator = 5;
}
