syntax = "proto3";

package hobo.mcp.secret_capture.v1;

// Wire records for the secret-capture MCP App (ADR-0179 amendment "Deploy
// secrets captured by an MCP App into the secret store"). A secret a HoBo
// deployment needs is typed by its owner into a form the MCP host renders
// (MCP Apps, extension io.modelcontextprotocol/ui, spec 2026-01-26) or into a
// page the MCP server serves on loopback (the fallback). The value is sealed
// in the form to a key only the MCP server process holds, opened there, and
// written to the secret store through the SecretsPort. None of these records
// can carry a value: every definition in secret_capture.cue is closed, so a
// record with a `value` field is not representable. CUE constraints:
// secret_capture.cue.

// What one capturable secret is, as the composition declares it.
message SecretCaptureSpec {
  // The store's entry name, e.g. HOBO_CI_WEBHOOK_SECRET.
  string name = 1;
  // "runtime" (the relay's folder), "deploy" (the deploy credential's
  // project) or "writer" (the one-use credential that authorizes writes;
  // consumed by the MCP server, never stored).
  string target = 2;
  string label = 3;
  string purpose = 4;
  uint32 min_bytes = 5;
  uint32 max_bytes = 6;
  // "printable-line" (ASCII 0x20-0x7E) or "printable-multiline" (the same,
  // plus CR and LF, e.g. a PEM key).
  string charset = 7;
  // An optional anchored ECMAScript pattern the value must match too.
  string pattern = 8;
}

// The public half of a P-256 key, as a JWK (kty, crv, x, y only).
message SecretCaptureKey {
  string kty = 1;
  string crv = 2;
  string x = 3;
  string y = 4;
}

// A capture as the agent sees it: a ticket, never a value.
message SecretCaptureTicket {
  string ticket_id = 1;
  string name = 2;
  string target = 3;
  // "mcp-app", "url-elicitation" or "loopback-page".
  string channel = 4;
  // "awaiting-owner", "stored", "authorized", "expired" or "closed".
  string state = 5;
  string opened_at = 6;
  string expires_at = 7;
  // The store's reference to the entry once stored (infisical://...), or the
  // writer session's reference once authorized.
  string ref = 8;
  // The loopback page (fallback channels only). It carries the ticket id; the
  // page's one-time token is in the URL fragment, which no request sends.
  string url = 9;
  // The key the form seals the value to (every channel).
  SecretCaptureKey key = 10;
  string label = 11;
  string purpose = 12;
  // How the form presents the field: one line (masked) or several (a PEM).
  string charset = 13;
  uint32 max_bytes = 14;
}

// What the form sends: the value sealed (ECDH-ES P-256, HKDF-SHA256,
// AES-256-GCM) to the ticket's key, with the ticket id and name as
// associated data.
message SecretCaptureSealed {
  string ticket_id = 1;
  SecretCaptureKey epk = 2;
  string iv = 3;
  string ciphertext = 4;
}

// The only answer a submission gets: a name, whether it was stored, and a
// reference.
message SecretCaptureReceipt {
  string ticket_id = 1;
  string name = 2;
  bool stored = 3;
  string ref = 4;
  // "stored" or "authorized".
  string status = 5;
}

// A refusal: a code, a fixed message and the next step. Never a value.
message SecretCaptureRefusal {
  string code = 1;
  string message = 2;
  string next_step = 3;
  string name = 4;
}

// The audited fact of each step, references only.
message SecretCaptureEvent {
  string schema_version = 1;
  string type = 2;
  uint64 seq = 3;
  string time = 4;
  string ticket_id = 5;
  string name = 6;
  string target = 7;
  string channel = 8;
  string ref = 9;
  string code = 10;
}
