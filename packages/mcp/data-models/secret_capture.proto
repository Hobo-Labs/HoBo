syntax = "proto3";

package hobo.mcp.secret_capture.v1;


message SecretCaptureSpec {
  string name = 1;
  string target = 2;
  string label = 3;
  string purpose = 4;
  uint32 min_bytes = 5;
  uint32 max_bytes = 6;
  string charset = 7;
  string pattern = 8;
}

message SecretCaptureKey {
  string kty = 1;
  string crv = 2;
  string x = 3;
  string y = 4;
}

message SecretCaptureTicket {
  string ticket_id = 1;
  string name = 2;
  string target = 3;
  string channel = 4;
  string state = 5;
  string opened_at = 6;
  string expires_at = 7;
  string ref = 8;
  string url = 9;
  SecretCaptureKey key = 10;
  string label = 11;
  string purpose = 12;
  string charset = 13;
  uint32 max_bytes = 14;
}

message SecretCaptureSealed {
  string ticket_id = 1;
  SecretCaptureKey epk = 2;
  string iv = 3;
  string ciphertext = 4;
}

message SecretCaptureReceipt {
  string ticket_id = 1;
  string name = 2;
  bool stored = 3;
  string ref = 4;
  string status = 5;
}

message SecretCaptureRefusal {
  string code = 1;
  string message = 2;
  string next_step = 3;
  string name = 4;
}

message SecretCaptureEvent {
  string schema_version = 1;
  string type = 2;
  uint64 seq = 3;
  string time = 4;
  string ticket_id = 5;
  string name = 6;
  string target = 7;
  string channel = 8;
  string ref = 9;
  string code = 10;
  string id = 11;
}
