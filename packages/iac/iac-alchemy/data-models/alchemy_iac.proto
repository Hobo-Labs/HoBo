syntax = "proto3";

package hobo.iac.alchemy.v1;

message ResourceScope {
  string resource_id = 1;
  string resource_type = 2;
  string provider_id = 3;
  string provider_account_ref = 4;
  string product_id = 5;
}

message Target {
  string target_id = 1;
  string tenant_id = 2;
  string stack_name = 3;
  string stage = 4;
  string program_resource_id = 5;
  string source_digest = 6;
  string inventory_evidence_ref = 7;
  repeated ResourceScope resources = 8;
}
