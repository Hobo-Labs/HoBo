syntax = "proto3";

package hobo.conformance.sdk.v1;

import "google/protobuf/struct.proto";

message SdkWitError {
  string tag = 1;
  optional string message = 2;
  optional double deadline_ms = 3;
  optional string retry = 4;
}

message SdkWitResult {
  google.protobuf.Value ok = 1;
  SdkWitError err = 2;
}

message SdkCancellationSignal {
  string reason = 1;
  optional double deadline_ms = 2;
}

message SdkCollectionFact {
  double sequence = 1;
  string kind = 2;
  optional string name = 3;
  optional string resource = 4;
  optional string event = 5;
}

message SdkExpectedThrow {
  string name = 1;
  string tag = 2;
}

message SemanticsAnnexVector {
  string name = 1;
  string category = 2;
  string spec_version = 3;
  SdkWitResult result = 4;
  SdkExpectedThrow expected_throw = 5;
  SdkCancellationSignal signal = 6;
  SdkWitResult expected = 7;
  repeated SdkCollectionFact facts = 8;
  optional string expected_error = 9;
}

message SdkWitCall {
  string interface = 1;
  string function = 2;
  google.protobuf.Struct args = 3;
}

message SdkResource {
  string kind = 1;
  string name = 2;
  google.protobuf.Value allow = 3;
}

message SdkHandler {
  string resource = 1;
  string event = 2;
  string export_name = 3;
}

message SdkManifestIr {
  string schema = 1;
  string bindle = 2;
  repeated SdkResource resources = 3;
  repeated SdkHandler handlers = 4;
}

message SdkLowerProgram {
  string bindle = 1;
  repeated SdkResource resources = 2;
  repeated SdkHandler handlers = 3;
}

message LoweringFixture {
  string name = 1;
  SdkLowerProgram program = 2;
  repeated SdkWitCall expected_wit_calls = 3;
  SdkManifestIr expected_manifest = 4;
}

message VectorCaseResult {
  string name = 1;
  optional string category = 2;
  string status = 3;
  optional string reason = 4;
  optional string expected_json = 5;
  optional string actual_json = 6;
  repeated string diff_paths = 7;
}

message LaneReport {
  string lane = 1;
  string status = 2;
  optional bool bounded_by_corpus = 3;
  repeated VectorCaseResult cases = 4;
}

message SdkConformanceReport {
  string suite = 1;
  string contract = 2;
  string layer_name = 3;
  string authorship = 4;
  string status = 5;
  string corpus_claim = 6;
  repeated LaneReport lanes = 7;
}

message SdkResilienceVector {
  string name = 1;
  google.protobuf.Value input = 2;
  google.protobuf.Value expected = 3;
}
