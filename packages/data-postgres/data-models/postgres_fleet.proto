// Wire records for a fleet of interchangeable PostgreSQL backends.
//
// A fleet keeps one writer and any number of standbys. These are the records
// it persists on the backends themselves and exchanges between its steps. The
// parsed TypeScript values under `src/fleet/` are narrowings of these records.
//
// A backend id is an opaque token. Nothing here names a product, a host, or a
// credential, so every record is safe to log and to replay.

syntax = "proto3";

package hobo.data.postgres.fleet.v1;

// One entry of the assignment log: who the writer is for one epoch.
//
// An epoch is decided when a majority of the configured backends hold the same
// entry for it. The current assignment is the highest decided epoch.
message PostgresFleetAssignment {
  // Starts at 1 and increases by exactly one per entry on every backend.
  uint64 epoch = 1;
  // The writer. Unset means the fleet deliberately has no writer.
  optional string active = 2;
  // True while a planned move is in flight. Nobody may write.
  bool sealed = 3;
  // Where a sealed fleet is moving to. Set exactly when `sealed` is true.
  optional string target = 4;
  // A short fixed token, e.g. "bootstrap" or "failover:unreachable".
  string reason = 5;
  // Upper bound on the writes an unplanned move lost. Unset for a planned one.
  optional uint64 loss_window_ms = 6;
  // The proposer's clock. Zero for the bootstrap entry, which must be the same
  // bytes whoever writes it.
  uint64 decided_at_ms = 7;
  // Which process proposed the entry. Never a person's name or a credential.
  string decided_by = 8;
}

// One copied table of a standby: how many rows, and what they hash to.
message PostgresFleetReplicatedTable {
  string name = 1;
  uint64 rows = 2;
  // Order-independent SHA-256 over every row in text form, lower-case hex.
  string digest = 3;
}

// What a standby holds: which writer it was copied from, under which
// assignment, and as of when. A standby's lag is the time since `snapshot_at_ms`.
message PostgresFleetWatermark {
  // The backend the standby was copied from.
  string source = 1;
  // The assignment epoch the copy was made under.
  uint64 source_epoch = 2;
  // When the snapshot was taken, on the source's clock.
  uint64 snapshot_at_ms = 3;
  repeated PostgresFleetReplicatedTable tables = 4;
  uint64 row_count = 5;
  uint64 byte_count = 6;
  // SHA-256 over every table's name, row count and digest, lower-case hex.
  string digest = 7;
}
