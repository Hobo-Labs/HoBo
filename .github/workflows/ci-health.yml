name: CI health

# GitHub-hosted on purpose: it reads the fleet's record, so it must not wait
# on the fleet. It checks out only the monitor, which loads no package.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Print and upload the report; write nothing to issues
        type: boolean
        default: false

permissions:
  actions: read
  checks: read
  contents: read
  issues: write

concurrency:
  group: ${{ github.event_name == 'push' && 'ci-health-probe' || 'ci-health' }}
  cancel-in-progress: false

env:
  # Who new issues are assigned to (P5); an organization is not assignable,
  # and the issue is then opened unassigned.
  CI_HEALTH_ASSIGNEE: ${{ github.repository_owner }}
  CI_HEALTH_PAID_MINUTES_PER_WINDOW: "150"
  CI_HEALTH_STALL_MINUTES: "30"

jobs:
  ci-health:
    name: CI health
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ci/ci-health.mts
            .hobo/ci.json
            scripts/ci/relay-inputs.mts
            scripts/lib/pnpm-lockfile.mts
            pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: List the relay's source directories
        run: node scripts/ci/relay-inputs.mts pnpm-lock.yaml relay-inputs.json
      - name: Read the window and raise breaches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_HEALTH_DRY_RUN: ${{ inputs.dry-run }}
        run: node scripts/ci/ci-health.mts
      # Breach or not, so the next run starts where this window ended. A dry
      # run uploads under its own name and leaves the scheduled window alone.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.dry-run && 'ci-health-dry-run' || 'ci-health-report' }}
          path: ci-health-report.json
          if-no-files-found: error
          retention-days: 30

  routing-slip-probe:
    name: Routing slip transport
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: routing-slip-probe
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ci/routing-slip-probe.mts
            scripts/ci/runner-routing.mts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Write, read back and delete refs/hobo/routing-slip-probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/routing-slip-probe.mts --write
