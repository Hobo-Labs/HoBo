name: HoBo Pricing release (npm dry-run)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - "packages/pricing/**"
      - "release/npm-scope-map.json"
      - "scripts/ci/npm-publish-scope.mts"
      - "scripts/ci/pricing-release.mts"
      - "scripts/test/pricing-release.test.ts"
      - "scripts/test/npm-publish-scope.test.ts"
      - ".github/workflows/release-pricing.yml"
  push:
    tags:
      - "pricing-v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hobo-pricing-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HOBO_TURBO_CONCURRENCY: "1"

jobs:
  route:
    name: Route runners
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false || (github.event.action == 'labeled' && github.event.label.name == 'ci:run-draft-checks') }}
    # GitHub-hosted on purpose: the choice of runner must not wait on the fleet
    # it is choosing against. The fleet while it takes jobs, an enrolled local
    # box when it does not, GitHub-hosted when neither does (scripts/ci/route-runner.mts).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      runner: ${{ steps.route.outputs.runner }}
      tier: ${{ steps.route.outputs.tier }}
    steps:
      - id: routing-base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            merge_group) base="$MERGE_BASE_SHA" ;;
            *) base="$GITHUB_SHA" ;;
          esac
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The trusted routing base is unavailable"
            exit 1
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.routing-base.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/route-runner
            scripts/ci/route-runner.mts
            packages/ci/src/fleet-overflow.ts
            scripts/ci/runner-routing.mts
            .hobo/ci.json
      - id: route
        uses: ./.github/actions/route-runner
        with:
          token: ${{ github.token }}

  pricing-release-contract:
    name: Pricing release contract (static)
    needs: route
    runs-on: ${{ needs.route.result == 'success' && (needs.route.outputs.runner || 'ubuntu-24.04') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          clean: false
      - uses: ./.github/actions/ci-runner-preflight
      - name: Fetch pinned ts-autocode
        run: pnpm run pins:fetch ts-autocode
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: npm scope map contract
        run: pnpm exec vitest run scripts/test/npm-publish-scope.test.ts

  pricing-release-build:
    name: Build and test @hobo/pricing (release cone)
    needs: [route, pricing-release-contract]
    runs-on: ${{ needs.route.result == 'success' && (needs.route.outputs.runner || 'ubuntu-24.04') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          clean: false
      - uses: ./.github/actions/ci-runner-preflight
      - name: Fetch pinned ts-autocode
        run: pnpm run pins:fetch ts-autocode
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Turbo cache
        uses: ./.github/actions/turbo-cache
        with:
          turbo-token: ${{ github.event.pull_request.head.repo.fork && '' || secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          remote-mode: ${{ github.event.pull_request.head.repo.fork && 'remote:ro' || 'remote:rw' }}
      - run: pnpm exec turbo run build test --filter=@hobo/pricing --concurrency=1
      - name: Save Turbo cache
        if: always()
        uses: ./.github/actions/turbo-cache
        with:
          mode: save

  pricing-release-pack:
    name: Pack and verify @hobo-labs/pricing
    needs: [route, pricing-release-build]
    runs-on: ${{ needs.route.result == 'success' && (needs.route.outputs.runner || 'ubuntu-24.04') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      tarball_sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: false
      - uses: ./.github/actions/ci-runner-preflight
      - name: Fetch pinned ts-autocode
        run: pnpm run pins:fetch ts-autocode
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - run: pnpm exec turbo run build --filter=@hobo/pricing --concurrency=1
      - name: Test Pricing release boundary
        run: pnpm exec vitest run scripts/test/pricing-release.test.ts
      - name: Pack scoped Pricing package
        id: pack
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/hobo-pricing-release-staging"
          artifact="$RUNNER_TEMP/hobo-pricing-release"
          rm -rf "$staging" "$artifact"
          mkdir -p "$staging" "$artifact"
          cp -a packages/pricing/. "$staging/"
          node --no-warnings scripts/ci/pricing-release.mts stage "$RELEASE_REF" packages/pricing/package.json "$staging/package.json"
          npm pack "$staging" --ignore-scripts --pack-destination "$artifact"
          mv "$artifact"/*.tgz "$artifact/pricing.tgz"
          if [[ "$RELEASE_REF" == refs/tags/pricing-v* ]]; then
            node --no-warnings scripts/ci/pricing-release.mts verify "$RELEASE_REF" "$artifact/pricing.tgz"
          fi
          rm -rf "$RUNNER_TEMP/pricing-consumer"
          mkdir "$RUNNER_TEMP/pricing-consumer"
          cd "$RUNNER_TEMP/pricing-consumer"
          printf '{"private":true}\n' > package.json
          pnpm add --ignore-scripts "$artifact/pricing.tgz"
          node --input-type=module -e 'await import("@hobo-labs/pricing")'
          printf 'sha256=%s\n' "$(sha256sum "$artifact/pricing.tgz" | cut -d " " -f 1)" >> "$GITHUB_OUTPUT"
      - name: Save verified Pricing tarball
        id: upload
        if: startsWith(github.ref, 'refs/tags/pricing-v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hobo-pricing-package-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hobo-pricing-release/pricing.tgz
          if-no-files-found: error
          retention-days: 1

  pricing-release-publish:
    name: npm publish @hobo-labs/pricing (tag only)
    if: ${{ !cancelled() && needs.pricing-release-pack.result == 'success' && startsWith(github.ref, 'refs/tags/pricing-v') }}
    needs: pricing-release-pack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8008c3f4db491fde6fd6d72dc97fbdb752dac949
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.pricing-release-pack.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/hobo-pricing-release
      - name: Verify tag and publish the tested tarball with trusted publishing
        env:
          RELEASE_REF: ${{ github.ref }}
          PACKAGE_SHA256: ${{ needs.pricing-release-pack.outputs.tarball_sha256 }}
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/hobo-pricing-release/pricing.tgz"
          [[ "$PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$PACKAGE_SHA256" "$tarball" | sha256sum --check --status
          node --no-warnings scripts/ci/pricing-release.mts verify "$RELEASE_REF" "$tarball"
          dist_tag="$(node --no-warnings scripts/ci/pricing-release.mts dist-tag "$RELEASE_REF")"
          case "$dist_tag" in
            latest) tag_args=() ;;
            next) tag_args=(--tag next) ;;
            *) exit 1 ;;
          esac
          npx -y npm@11.21.1 publish "$tarball" --access public --provenance --ignore-scripts "${tag_args[@]}"
