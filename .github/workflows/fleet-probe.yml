name: Fleet probe

# One job per self-hosted label, each doing nothing (the local box's only when
# .hobo/ci.json enrolls one). What it leaves behind is
# how long a runner took to pick it up, which the route job of every workflow
# reads before it sends work to that label (scripts/ci/route-runner.mts): a
# label no runner has been seen on is not sent work.
#
# Started by each CI run, so the record is fresh whenever it is needed and
# nothing runs while the repository is quiet.
#
# Each label has its own concurrency group and nothing is cancelled once it
# is waiting for a runner. A label that is down therefore holds one job that
# goes on waiting, which is what the route job needs to see, plus at most one
# behind it; and a label that is down does not hold up the probe of another.
on:
  workflow_run:
    workflows: ["HoBo CI Fabric"]
    types: [requested]
  workflow_dispatch:

permissions: {}

jobs:
  pr-fleet:
    name: hobo picks a job up
    runs-on: hobo
    concurrency:
      group: fleet-probe-hobo
      cancel-in-progress: false
    timeout-minutes: 2
    steps:
      - run: "true"

  trunk-fleet:
    name: hobo-trunk picks a job up
    runs-on: hobo-trunk
    concurrency:
      group: fleet-probe-hobo-trunk
      cancel-in-progress: false
    timeout-minutes: 2
    steps:
      - run: "true"

  # Whether a local box is enrolled is committed configuration
  # (runnerRouting.localRunner in .hobo/ci.json), read with the route job's own
  # dependency-free reader. GitHub-hosted, so it never waits on a label it probes.
  local-box-enrolled:
    name: local box enrolled
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      enrolled: ${{ steps.policy.outputs.enrolled }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ci/runner-routing.mts
            .hobo/ci.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - id: policy
        run: echo "enrolled=$(node --no-warnings scripts/ci/runner-routing.mts .hobo/ci.json --get localRunner)" >> "$GITHUB_OUTPUT"

  local-box:
    name: hobo-local-host picks a job up
    needs: local-box-enrolled
    if: needs.local-box-enrolled.outputs.enrolled == 'true'
    runs-on: hobo-local-host
    concurrency:
      group: fleet-probe-hobo-local-host
      cancel-in-progress: false
    timeout-minutes: 2
    steps:
      - run: "true"
