name: HoBo Pricing CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - "packages/pricing/**"
      - "packages/broker/**"
      - "packages/cloud/**"
      - "packages/core/**"
      - "packages/runtime/**"
      - "packages/runtimes/runtime-rivet/**"
      - "packages/conformance/**"
      - "packages/wit/**"
      - "packages/iac/iac-alchemy/**"
      - "test/iac-alchemy-integration.test.ts"
      - "test/iac-alchemy-cloudflare-catalog.test.ts"
      - "packages/extension-alchemy-rivet/**"
      - "packages/provider-manifest/**"
      - "packages/broker/test/pricing-authorization.test.ts"
      - "packages/events/src/pricing-event-contracts.ts"
      - "packages/events/test/pricing-upcaster-gate.test.ts"
      - "packages/events/corpus/golden-replay-baseline.json"
      - "packages/dispatcher/**"
      - "scripts/check-iac-models.ts"
      - "scripts/check-durable-topic-model.ts"
      - "scripts/lib/bounded-tlc.ts"
      - "scripts/test/bounded-tlc.test.ts"
      - "scripts/test/pricing-workflow-model-trigger.test.ts"
      - "docs/design/provider-pricing-commercial-terms.md"
      - "docs/design/provider-pricing-scorecard.md"
      - ".github/workflows/pricing-ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/pricing/**"
      - "packages/broker/**"
      - "packages/cloud/**"
      - "packages/core/**"
      - "packages/runtime/**"
      - "packages/runtimes/runtime-rivet/**"
      - "packages/conformance/**"
      - "packages/wit/**"
      - "packages/iac/iac-alchemy/**"
      - "test/iac-alchemy-integration.test.ts"
      - "test/iac-alchemy-cloudflare-catalog.test.ts"
      - "packages/extension-alchemy-rivet/**"
      - "packages/provider-manifest/**"
      - "packages/broker/test/pricing-authorization.test.ts"
      - "packages/events/src/pricing-event-contracts.ts"
      - "packages/events/test/pricing-upcaster-gate.test.ts"
      - "packages/events/corpus/golden-replay-baseline.json"
      - "packages/dispatcher/**"
      - "scripts/check-iac-models.ts"
      - "scripts/check-durable-topic-model.ts"
      - "scripts/lib/bounded-tlc.ts"
      - "scripts/test/bounded-tlc.test.ts"
      - "scripts/test/pricing-workflow-model-trigger.test.ts"
      - "docs/design/provider-pricing-commercial-terms.md"
      - "docs/design/provider-pricing-scorecard.md"
      - ".github/workflows/pricing-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hobo-pricing-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # ci-runner-preflight replaces these from the job memory limit.
  HOBO_TURBO_CONCURRENCY: "1"
  HOBO_TEST_MAX_WORKERS: "1"

jobs:
  route:
    name: Route runners
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false || (github.event.action == 'labeled' && github.event.label.name == 'ci:run-draft-checks') }}
    # GitHub-hosted on purpose: the choice of runner must not wait on the fleet
    # it is choosing against. The fleet while it takes jobs, an enrolled local
    # box when it does not, GitHub-hosted when neither does (scripts/ci/route-runner.mts).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      runner: ${{ steps.route.outputs.runner }}
      tier: ${{ steps.route.outputs.tier }}
    steps:
      - id: routing-base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            merge_group) base="$MERGE_BASE_SHA" ;;
            *) base="$GITHUB_SHA" ;;
          esac
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The trusted routing base is unavailable"
            exit 1
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.routing-base.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/route-runner
            scripts/ci/route-runner.mts
            packages/ci/src/fleet-overflow.ts
            scripts/ci/runner-routing.mts
            .hobo/ci.json
      - id: route
        uses: ./.github/actions/route-runner
        with:
          token: ${{ github.token }}

  pricing-gate:
    name: "@hobo/pricing affected gate"
    needs: route
    runs-on: ${{ needs.route.result == 'success' && (needs.route.outputs.runner || 'ubuntu-24.04') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          clean: false
          fetch-depth: 0
      - uses: $/.github/actions/ci-runner-preflight
      - name: Fetch pinned ts-autocode
        run: pnpm run pins:fetch ts-autocode
      - uses: $/.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Check pricing workflow coverage
        run: node --experimental-strip-types --test scripts/test/pricing-workflow-model-trigger.test.ts
      - name: Turbo cache
        uses: $/.github/actions/turbo-cache
        with:
          turbo-token: ${{ github.event.pull_request.head.repo.fork && '' || secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          remote-mode: ${{ github.event.pull_request.head.repo.fork && 'remote:ro' || 'remote:rw' }}
      - name: Build and test pricing integration cone
        run: |
          set -euo pipefail
          pnpm exec turbo run build test \
            --filter=@hobo/pricing \
            --filter=@hobo/broker \
            --filter=@hobo/cloud \
            --filter=@hobo/core \
            --filter=@hobo/runtime \
            --filter=@hobo/runtime-rivet \
            --filter=@hobo/conformance \
            --filter=@hobo/wit \
            --filter=@hobo/iac-alchemy \
            --filter=@hobo/alchemy-rivet \
            --filter=@hobo/dispatcher \
            --filter=@hobo/events \
            --filter=@hobo/provider-manifest \
            --continue \
            --concurrency=1
      - name: Build Alchemy integration prerequisites
        run: pnpm exec turbo run build --filter=@hobo/bindles --filter=@hobo/runtime-local --concurrency=1
      - name: Exercise Alchemy pricing and routing
        run: pnpm exec vitest run test/iac-alchemy-integration.test.ts test/iac-alchemy-cloudflare-catalog.test.ts
      - name: Check generated messaging component bindings
        run: pnpm --filter @hobo/wit run wit:check
      - name: Consumer contracts (pricing + dispatcher v2)
        run: |
          pnpm --filter @hobo/pricing run test:contract:consumer
          pnpm --filter @hobo/dispatcher run test:contract:consumer
      - name: Save Turbo cache
        if: always()
        uses: $/.github/actions/turbo-cache
        with:
          mode: save

  pricing-models:
    name: Check bounded IaC budget, routing, grant and pricing models
    needs: route
    runs-on: ${{ needs.route.result == 'success' && (needs.route.outputs.runner || 'ubuntu-24.04') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: "21"
      - name: Download TLA+ tools
        run: |
          curl --fail --location --silent --show-error --retry 3 --max-time 60 \
            --output "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
      - name: Test model checker process bounds
        run: node --experimental-strip-types --test scripts/test/bounded-tlc.test.ts
      - name: Verify tool digest and check models
        env:
          HOBO_TLA_TOOLS: ${{ runner.temp }}/tla2tools.jar
          JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
        run: |
          node --experimental-strip-types scripts/check-iac-models.ts
          node --experimental-strip-types scripts/check-durable-topic-model.ts
          node --experimental-strip-types packages/runtime/model/check-topic-policy.mts
          node --experimental-strip-types packages/core/model/check-messaging-settlement.mts
          node --experimental-strip-types packages/core/model/check-messaging-exhaustion.mts
          node --experimental-strip-types packages/iac/iac-alchemy/model/check-rivet-queue.mts
          node --experimental-strip-types packages/iac/iac-alchemy/model/check-rivet-kv.mts
          node --experimental-strip-types packages/iac/iac-alchemy/model/check-rivet-http-kv.mts
          node --experimental-strip-types packages/iac/iac-alchemy/model/check-rivet-http-queue.mts
          node --experimental-strip-types packages/iac/iac-alchemy/model/check-rivet-namespace.mts
          node --experimental-strip-types packages/iac/iac-alchemy/model/check-cloudflare-grants.mts
          node --experimental-strip-types packages/iac/iac-alchemy/model/check-cloudflare-secret.mts
          node --experimental-strip-types packages/extension-alchemy-rivet/model/check-http-topic-bus.mts
