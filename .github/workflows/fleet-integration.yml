name: Fleet integration

# The HoBo Fleet integration lane (ADR-0182). It provisions the binaries the
# fleet's `*.integration.test.ts` need and runs them: `fleet:verify` (every
# outcome, each of which names its integration tests) and every fleet
# integration test besides. Those tests fail when a binary is absent and `CI`
# is set, so a missing tool here is a red job, never a skip.
#
# Provisioning: `nats-server` 2.15.3 through mise.toml; the iroh relay of the
# release the pinned `@number0/iroh` binding is built against (iroh-relay 1.4.1),
# a pinned, checksum-verified download; the sandbox runtime through the
# agent's own provisioning code (D58): `sandbox-provision.ts` downloads the
# pinned gVisor `runsc` release, checks its SHA-512 and unpacks it into
# $RUNNER_TEMP/hobo-sandbox, exactly as a device does. The S1 sandbox driver
# writes its own OCI bundles and pulls the probe image by digest itself (no
# Podman). Kata and macOS are not provisioned (A11, A12 in
# fleet-fallbacks.json).
#
# Runners: scripts/lint-actions.ts requires every enabled workflow to run on the
# self-hosted hobo labels. Nothing sandbox-related has to be on the runner
# image: the job needs only a Linux kernel that lets the job user run as root
# or create unprivileged user namespaces. The provision step probes that; when
# it is refused and passwordless sudo is available it lifts the
# user-namespace restriction once and probes again, and otherwise fails naming
# the kernel capability.
#
# Runs on the integration branch (`fleet/**`) and on demand.

on:
  push:
    branches:
      - "fleet/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  HOBO_FLEET_PROBE_IMAGE: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
  IROH_RELAY_VERSION: "1.4.1"

jobs:
  fleet-verify:
    name: Fleet outcomes (fleet:verify)
    runs-on: ${{ vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          clean: false
          fetch-depth: 0
      - uses: jdx/mise-action@8008c3f4db491fde6fd6d72dc97fbdb752dac949
        with:
          install: true
          cache: true
      - name: Provision the iroh relay
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) target=x86_64-unknown-linux-musl; sum=75254641e3fad7fcbac6dee4d485556fbe06ef708340a9d8810469270ba626b8 ;;
            aarch64) target=aarch64-unknown-linux-musl; sum=3fc0c2d67c1cd66250bf82f3e2f17a985b7081a3d272186bad9d63e3f2347b38 ;;
            *) echo "no pinned iroh relay for $(uname -m)" >&2; exit 1 ;;
          esac
          archive="${RUNNER_TEMP}/iroh-relay.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/n0-computer/iroh/releases/download/v${IROH_RELAY_VERSION}/iroh-relay-v${IROH_RELAY_VERSION}-${target}.tar.gz"
          echo "${sum}  ${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/iroh-relay/bin"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/iroh-relay/bin" ./iroh-relay
          echo "${RUNNER_TEMP}/iroh-relay/bin" >> "$GITHUB_PATH"
      - name: Check the binaries
        run: |
          set -euo pipefail
          nats-server --version
          iroh-relay --help > /dev/null
      - run: pnpm run install:check
      - run: pnpm run build
      - name: Provision the sandbox runtime
        run: |
          set -euo pipefail
          cache="${RUNNER_TEMP}/hobo-sandbox"
          probe() {
            set +e
            report=$(node --import tsx packages/fleet-agent/src/cli/sandbox-provision.ts --cache "$cache" --probe)
            code=$?
            set -e
            echo "$report"
          }
          probe
          if [ "$code" -eq 3 ] && sudo -n true 2> /dev/null; then
            lifted=""
            if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
              lifted=yes
            fi
            if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
              sudo -n sysctl -w kernel.unprivileged_userns_clone=1
              lifted=yes
            fi
            if [ -n "$lifted" ]; then probe; fi
          fi
          if [ "$code" -ne 0 ]; then
            reason=$(printf '%s' "$report" | node -e 'let s="";process.stdin.on("data",(d)=>{s+=d}).on("end",()=>{try{console.log(JSON.parse(s).reason??"")}catch{console.log(s)}})')
            case "$reason" in
              no-root-or-userns*)
                echo "::error::this runner's kernel lets the job user neither run as root nor create unprivileged user namespaces, so no sandbox can start (${reason}). Allow user namespaces (user.max_user_namespaces > 0, kernel.unprivileged_userns_clone=1, kernel.apparmor_restrict_unprivileged_userns=0) or run the job as root." >&2 ;;
              *)
                echo "::error::the sandbox runtime is unavailable on this runner: ${reason}" >&2 ;;
            esac
            exit 1
          fi
          echo "HOBO_FLEET_SANDBOX_CACHE=${cache}" >> "$GITHUB_ENV"
          echo "HOBO_FLEET_SANDBOX_DOWNLOAD=0" >> "$GITHUB_ENV"
      - name: Every fleet outcome
        run: pnpm run fleet:verify
      - name: Keep the verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fleet-verification
          path: fleet-verification.json
          if-no-files-found: warn

  fleet-integration-tests:
    name: Fleet integration tests
    runs-on: ${{ vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          clean: false
      - uses: jdx/mise-action@8008c3f4db491fde6fd6d72dc97fbdb752dac949
        with:
          install: true
          cache: true
      - name: Provision the iroh relay
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) target=x86_64-unknown-linux-musl; sum=75254641e3fad7fcbac6dee4d485556fbe06ef708340a9d8810469270ba626b8 ;;
            aarch64) target=aarch64-unknown-linux-musl; sum=3fc0c2d67c1cd66250bf82f3e2f17a985b7081a3d272186bad9d63e3f2347b38 ;;
            *) echo "no pinned iroh relay for $(uname -m)" >&2; exit 1 ;;
          esac
          archive="${RUNNER_TEMP}/iroh-relay.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/n0-computer/iroh/releases/download/v${IROH_RELAY_VERSION}/iroh-relay-v${IROH_RELAY_VERSION}-${target}.tar.gz"
          echo "${sum}  ${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/iroh-relay/bin"
          tar -xzf "$archive" -C "${RUNNER_TEMP}/iroh-relay/bin" ./iroh-relay
          echo "${RUNNER_TEMP}/iroh-relay/bin" >> "$GITHUB_PATH"
      - name: Check the binaries
        run: |
          set -euo pipefail
          nats-server --version
          iroh-relay --help > /dev/null
      - run: pnpm run install:check
      - run: pnpm run build
      - name: Provision the sandbox runtime
        run: |
          set -euo pipefail
          cache="${RUNNER_TEMP}/hobo-sandbox"
          probe() {
            set +e
            report=$(node --import tsx packages/fleet-agent/src/cli/sandbox-provision.ts --cache "$cache" --probe)
            code=$?
            set -e
            echo "$report"
          }
          probe
          if [ "$code" -eq 3 ] && sudo -n true 2> /dev/null; then
            lifted=""
            if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
              lifted=yes
            fi
            if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
              sudo -n sysctl -w kernel.unprivileged_userns_clone=1
              lifted=yes
            fi
            if [ -n "$lifted" ]; then probe; fi
          fi
          if [ "$code" -ne 0 ]; then
            reason=$(printf '%s' "$report" | node -e 'let s="";process.stdin.on("data",(d)=>{s+=d}).on("end",()=>{try{console.log(JSON.parse(s).reason??"")}catch{console.log(s)}})')
            case "$reason" in
              no-root-or-userns*)
                echo "::error::this runner's kernel lets the job user neither run as root nor create unprivileged user namespaces, so no sandbox can start (${reason}). Allow user namespaces (user.max_user_namespaces > 0, kernel.unprivileged_userns_clone=1, kernel.apparmor_restrict_unprivileged_userns=0) or run the job as root." >&2 ;;
              *)
                echo "::error::the sandbox runtime is unavailable on this runner: ${reason}" >&2 ;;
            esac
            exit 1
          fi
          echo "HOBO_FLEET_SANDBOX_CACHE=${cache}" >> "$GITHUB_ENV"
          echo "HOBO_FLEET_SANDBOX_DOWNLOAD=0" >> "$GITHUB_ENV"
      - name: Every fleet integration test
        run: |
          set -euo pipefail
          mapfile -t tests < <(git ls-files 'packages/fleet*/**/*.integration.test.ts' 'packages/ci-gh-actions/test/fleet-*.integration.test.ts' 'packages/connectivity/**/*.integration.test.ts')
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "no fleet integration tests yet"
            exit 0
          fi
          pnpm exec vitest run "${tests[@]}"
