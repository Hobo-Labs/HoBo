name: HoBo release integration PR

on:
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  HOBO_TURBO_CONCURRENCY: "2"
  HOBO_TEST_MAX_WORKERS: "1"
  TURBO_RUN_SUMMARY: "true"
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "30"
  RELEASE_SPARSE_PATHS: |
    .github
    scripts
    test/setup
    packages
    release
    deploy
    site
    external
    media
    examples
    src
    tools/pins
    .mise/locks
    mise.toml
    mise.lock
    package.json
    pnpm-lock.yaml
    pnpm-workspace.yaml
    turbo.json
    tsconfig.base.json

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-integration:
    name: HoBo release integration shard
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Bootstrap repo-local composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: true
      - uses: $/.github/actions/hobo-checkout
        with:
          fetch-depth: 2
          sparse-paths: ${{ env.RELEASE_SPARSE_PATHS }}
          submodules: "false"
      - uses: $/.github/actions/ci-runner-preflight
      - name: Decide whether the diff reaches the slow integration suites
        id: scope
        env:
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            if [ -z "${MERGE_GROUP_BASE_SHA:-}" ]; then
              echo "Merge-group base is missing; running the lane"
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git cat-file -e "${MERGE_GROUP_BASE_SHA}^{commit}" 2>/dev/null \
              || git fetch --no-tags --depth=1 origin "$MERGE_GROUP_BASE_SHA"
            BASE="$MERGE_GROUP_BASE_SHA"
          elif git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            BASE="$(git rev-parse HEAD^1)"
          else
            echo "No base to compare with; running the lane"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE" HEAD \
            | node --experimental-strip-types --no-warnings scripts/ci/job-scope.mts \
              .github/workflows/release-hobo-pr.yml \
              packages/hobo/vitest.release-integration.config.ts \
              packages/hobo/test/support/release-integration-test-files.ts \
              >> "$GITHUB_OUTPUT"
      - name: Fetch pinned ts-autocode
        if: steps.scope.outputs.run == 'true'
        run: pnpm run pins:fetch ts-autocode
      - uses: $/.github/actions/pnpm-store
        if: steps.scope.outputs.run == 'true'
      - name: Link deps layer or install
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [ -n "${HOBO_CI_DEPS_LAYER:-}" ] \
            && node --experimental-strip-types scripts/ci/deps-layer.mts link \
            && node --experimental-strip-types scripts/ci/deps-layer.mts check --require; then
            echo "reusing HOBO_CI_DEPS_LAYER=${HOBO_CI_DEPS_LAYER}; skip pnpm install"
          else
            pnpm install --frozen-lockfile --config.confirmModulesPurge=false
          fi
      - name: Turbo cache
        if: steps.scope.outputs.run == 'true'
        uses: $/.github/actions/turbo-cache
        with:
          turbo-token: ${{ github.event.pull_request.head.repo.fork && '' || secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          remote-mode: ${{ github.event.pull_request.head.repo.fork && 'remote:ro' || 'remote:rw' }}
      - name: HoBo slow integration suites
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 6
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: >-
          pnpm exec turbo run test:release-integration --filter=@hobo/hobo
          --output-logs=new-only --concurrency=${HOBO_TURBO_CONCURRENCY:-100%}
          -- --shard="$((SHARD_INDEX + 1))/4"
      - name: Prune Turbo cache
        id: turbo-prune
        if: always() && matrix.shard == 0 && steps.scope.outputs.run == 'true' && env.TURBO_TOKEN == ''
        continue-on-error: true
        run: node --experimental-strip-types --no-warnings scripts/ci/turbo-cache-prune.mts
      - name: Save Turbo cache
        if: always() && matrix.shard == 0 && steps.scope.outputs.run == 'true' && steps.turbo-prune.outputs.save != 'false'
        uses: $/.github/actions/turbo-cache
        with:
          mode: save

  release-integration-gate:
    name: HoBo release integration PR gate
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs: [release-integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful release integration shards
        env:
          INTEGRATION_RESULT: ${{ needs.release-integration.result }}
        run: |
          set -euo pipefail
          if [ "${INTEGRATION_RESULT:-}" != "success" ]; then
            echo "::error::HoBo release integration shards must pass (result=${INTEGRATION_RESULT:-})"
            exit 1
          fi
