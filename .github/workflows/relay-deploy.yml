name: HoBo relay deploy

# The hosted CI relay deploys from HoBo configuration on every merge to main
# that changes it, and never by hand (ADR-0179 phase 6;
# docs/design/hosted-relay-stateless.md). HoBo delivers itself here: each
# `hobo ci deploy` records the commit as Freight and promotes it through the
# relay's pipeline (packages/ci-vercel/deploy/delivery.ts) with @hobo/cd. The
# relay's Yard (packages/ci-vercel/deploy/yard.ts) places it on Vercel and
# names its bindings. Preview runs first; production takes only the Freight
# preview verified and qualified, in the same job-scoped CD journal. Preview is
# verified by /healthz only (its Camp has no config-service binding, so its
# /readyz answers 503); production by /healthz and /readyz, failing closed.
# Production is NOT deployed when preview does not qualify the commit, and a
# production deployment that fails verification stays live: the job fails,
# nothing is rolled back.
#
# No Vercel secret lives in this repository: the job signs in to Infisical with
# its own GitHub Actions OIDC token as the `hobo-ci-deploy` machine identity
# and reads the deploy token from the `hobo-ci-deploy` project. The
# coordinates are repository variables (ids, not secrets). Until the owner has
# set them (packages/ci-vercel/CONFIG-SERVICE.md) the job ends with a notice
# and succeeds; when only the probe origins (HOBO_CI_RELAY_URL,
# HOBO_CI_RELAY_PREVIEW_URL) are missing, it ends with a warning, because
# production deploys have stopped until the owner sets them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time: a newer push waits for the deploy in flight instead of
# cancelling it halfway.
concurrency:
  group: relay-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the hosted CI relay (production)
    if: github.repository == 'Hobo-Labs/HoBo' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo' }}
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    env:
      # Where the deploy credential is read: the `hobo-ci-deploy` identity and project.
      HOBO_CI_DEPLOY_INFISICAL_IDENTITY_ID: ${{ vars.HOBO_CI_DEPLOY_INFISICAL_IDENTITY_ID }}
      HOBO_CI_DEPLOY_INFISICAL_PROJECT_ID: ${{ vars.HOBO_CI_DEPLOY_INFISICAL_PROJECT_ID }}
      HOBO_CI_DEPLOY_INFISICAL_ENVIRONMENT: ${{ vars.HOBO_CI_DEPLOY_INFISICAL_ENVIRONMENT }}
      HOBO_CI_DEPLOY_INFISICAL_SECRET_PATH: ${{ vars.HOBO_CI_DEPLOY_INFISICAL_SECRET_PATH }}
      HOBO_CI_INFISICAL_SITE_URL: ${{ vars.HOBO_CI_INFISICAL_SITE_URL }}
      # What the relay's config-service binding asks the deploy for: the
      # `hobo-ci-relay` identity and the `hobo-ci` project.
      HOBO_CI_RELAY_INFISICAL_IDENTITY_ID: ${{ vars.HOBO_CI_RELAY_INFISICAL_IDENTITY_ID }}
      HOBO_CI_RELAY_INFISICAL_PROJECT_ID: ${{ vars.HOBO_CI_RELAY_INFISICAL_PROJECT_ID }}
      HOBO_CI_RELAY_VERCEL_TEAM_ID: ${{ vars.HOBO_CI_RELAY_VERCEL_TEAM_ID }}
      # Where CD's verification probes reach the relay, per Camp: production
      # and a preview origin that answers without Deployment Protection.
      HOBO_CI_RELAY_URL: ${{ vars.HOBO_CI_RELAY_URL }}
      HOBO_CI_RELAY_PREVIEW_URL: ${{ vars.HOBO_CI_RELAY_PREVIEW_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: false
          fetch-depth: 2
      - name: Decide whether to deploy
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "${BEFORE:-}" ] \
            && ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BEFORE" || true
          fi
          node --experimental-strip-types --no-warnings scripts/ci/relay-deploy-gate.mts \
            --event "$GITHUB_EVENT_NAME" --from "${BEFORE:-}" --to "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/ci-runner-preflight
      - if: steps.gate.outputs.run == 'true'
        uses: ./.github/actions/pnpm-store
      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Build the deploy tool and the relay's declarations
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          pnpm exec turbo run build \
            --filter=@hobo/hobo... --filter=@hobo/ci-vercel^... \
            --output-logs=new-only --concurrency="${HOBO_TURBO_CONCURRENCY:-1}"
      - name: Read the Vercel deploy token (Infisical, GitHub OIDC)
        if: steps.gate.outputs.run == 'true'
        run: node --import tsx scripts/ci/relay-deploy-credential.mts
      - name: Install the pinned Vercel CLI for Marketplace provisioning
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          pnpm --dir "$RUNNER_TEMP/vercel-cli" add vercel@65.2.0 >/dev/null
          echo "HOBO_VERCEL_CLI=$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" >> "$GITHUB_ENV"
      - name: Deliver the relay to preview through HoBo CD
        id: preview
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 22
        run: |
          set -euo pipefail
          # One CD journal for this job: production reads preview's qualification.
          echo "HOBO_HOME=$RUNNER_TEMP/hobo-home" >> "$GITHUB_ENV"
          HOBO_HOME="$RUNNER_TEMP/hobo-home" node packages/hobo/dist/bin/hobo.js ci deploy \
            --cwd packages/ci-vercel \
            --target preview \
            --ref "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" \
            --team "$HOBO_CI_RELAY_VERCEL_TEAM_ID" \
            --provision --wait --json > "$RUNNER_TEMP/relay-preview.json"
      - name: Promote the relay to production through HoBo CD
        id: deploy
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 22
        run: |
          set -euo pipefail
          node packages/hobo/dist/bin/hobo.js ci deploy \
            --cwd packages/ci-vercel \
            --target production \
            --ref "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" \
            --team "$HOBO_CI_RELAY_VERCEL_TEAM_ID" \
            --set "INFISICAL_IDENTITY_ID=$HOBO_CI_RELAY_INFISICAL_IDENTITY_ID" \
            --set "INFISICAL_PROJECT_ID=$HOBO_CI_RELAY_INFISICAL_PROJECT_ID" \
            --provision --wait --json > "$RUNNER_TEMP/relay-production.json"
      - name: Summarize the relay delivery
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          node --input-type=module -e '
            import { appendFileSync, existsSync, readFileSync } from "node:fs";
            const lines = ["### Hosted CI relay delivery (HoBo CD)", ""];
            for (const file of process.argv.slice(1)) {
              if (!existsSync(file)) continue;
              let result = {};
              try { result = JSON.parse(readFileSync(file, "utf8")); } catch {}
              const outputs = result.data?.outputs ?? {};
              const delivery = result.data?.delivery ?? {};
              lines.push(`- ${delivery.node ?? "?"}: ${result.code ?? ""}; Freight ${delivery.alias ?? ""} ${delivery.state ?? ""} at ${delivery.campId ?? ""}; deployment ${outputs.url ?? ""} (${outputs.readyState ?? ""}); Marketplace: ${outputs.provisioned ?? "nothing to attach"}`);
            }
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          ' "$RUNNER_TEMP/relay-preview.json" "$RUNNER_TEMP/relay-production.json"
