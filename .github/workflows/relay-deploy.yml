name: HoBo relay deploy

# HoBo CD creates the relay's preview and production deployments on Vercel.
# The job authenticates to Infisical with GitHub OIDC and reads its scoped
# Vercel credential from the separate deploy project. Preview is checked at
# its own protected URL using GitHub OIDC; only its qualified commit can be
# promoted to production, where health and readiness must both pass.
#
# Building and deploying are separate jobs: `deploy-build` holds no OIDC
# identity (contents: read only) and builds the hobo CLI the privileged jobs
# run, handing it over as an artifact whose sha256 each consumer verifies
# before it runs anything (scripts/ci/release-freight-cli.mts restore, fail
# closed on digest or revision mismatch). The `deploy` and `app-credentials`
# jobs alone hold id-token: write, and build nothing: checkout, a frozen
# dependency install for the CLI's runtime, and the digest-pinned artifact are
# all they run before the OIDC-minting steps.
#
# No secret and no repository variable configures this workflow. The store's
# coordinates (ids and an origin, no credential) are committed to
# packages/ci-vercel/deploy/secret-store.binding.json, which the relay itself
# reads in production. A required deploy fails until that binding exists and is
# readable.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # `hobo ci app create --via-workflow` hands these over (on stdin to
      # `gh workflow run`): GitHub's one-time manifest code, spent by the
      # app-credentials job within seconds, and two non-secret ids.
      manifest_code:
        description: GitHub's one-time App-manifest code (hobo ci app create --via-workflow)
        required: false
        default: ""
      relay:
        description: The relay's public origin the App was created for
        required: false
        default: ""
      owner_id:
        description: The numeric GitHub id of the App's owner
        required: false
        default: ""

permissions:
  contents: read

# One deploy at a time: a newer push waits for the deploy in flight instead of
# cancelling it halfway.
concurrency:
  group: relay-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy-build:
    name: Build the deploy CLI (unprivileged)
    if: github.repository == 'Hobo-Labs/HoBo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.pack.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 2
          submodules: recursive
          persist-credentials: false
      - name: Decide whether to deploy
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "${BEFORE:-}" ] \
            && ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BEFORE" || true
          fi
          node --experimental-strip-types --no-warnings scripts/ci/relay-deploy-gate.mts \
            --event "$GITHUB_EVENT_NAME" --from "${BEFORE:-}" --to "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == 'true'
        uses: $/.github/actions/ci-runner-preflight
      - if: steps.gate.outputs.run == 'true'
        uses: $/.github/actions/pnpm-store
      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Build the hobo CLI the deploy job runs
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 12
        run: |
          set -euo pipefail
          pnpm exec turbo run build \
            --filter=@hobo/hobo... \
            --output-logs=new-only --concurrency="${HOBO_TURBO_CONCURRENCY:-1}"
      - name: Pack the built hobo CLI (digest + revision)
        id: pack
        if: steps.gate.outputs.run == 'true'
        run: node --no-warnings scripts/ci/release-freight-cli.mts pack "${RUNNER_TEMP}/relay-deploy-cli.tgz" --github-output "$GITHUB_OUTPUT"
      - name: Upload the built hobo CLI
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: relay-deploy-cli
          path: ${{ runner.temp }}/relay-deploy-cli.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    name: Deploy the hosted CI relay (production)
    if: github.repository == 'Hobo-Labs/HoBo' && github.ref == 'refs/heads/main' && github.event.inputs.manifest_code == ''
    needs: deploy-build
    runs-on: ubuntu-24.04
    # RELAY_DEPLOY_JOB_TIMEOUT_MINUTES in scripts/ci/relay-deploy-gate.mts.
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 2
          submodules: recursive
          persist-credentials: false
      - name: Decide whether to deploy
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "${BEFORE:-}" ] \
            && ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BEFORE" || true
          fi
          node --experimental-strip-types --no-warnings scripts/ci/relay-deploy-gate.mts \
            --event "$GITHUB_EVENT_NAME" --from "${BEFORE:-}" --to "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.run == 'true'
        uses: $/.github/actions/ci-runner-preflight
      - if: steps.gate.outputs.run == 'true'
        uses: $/.github/actions/pnpm-store
      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Download the built hobo CLI
        if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: relay-deploy-cli
          path: ${{ runner.temp }}/relay-deploy-cli
      # Refused unless it is the build job's archive (digest) of this commit.
      - name: Restore the built hobo CLI (deploy runs only this artifact)
        if: steps.gate.outputs.run == 'true'
        env:
          HOBO_RELAY_CLI_DIGEST: ${{ needs.deploy-build.outputs.digest }}
        run: node --no-warnings scripts/ci/release-freight-cli.mts restore "${RUNNER_TEMP}/relay-deploy-cli/relay-deploy-cli.tgz" --digest "$HOBO_RELAY_CLI_DIGEST"
      # Pass/fail by identity name: hobo-ci-deploy reads its scoped deployment
      # credential from the deploy project with this job's GitHub OIDC token,
      # then revokes its store session. hobo-ci-relay is not-run here; Vercel
      # OIDC is proved by production's /readyz below.
      - name: Verify the secret store connection
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          verify_json="$RUNNER_TEMP/secret-store-verify.json"
          verify_err="$RUNNER_TEMP/secret-store-verify.err"
          node packages/hobo/dist/bin/hobo.js ci secret-store verify \
            --cwd packages/ci-vercel --json >"$verify_json" 2>"$verify_err" || status=$?
          status=${status:-0}
          node --import tsx \
            scripts/ci/relay-deploy-secret-store-verify-report.mts \
            "$verify_json" "$verify_err" "$status"
      # Both commands share the CD journal for this attempt. The preview's
      # placeholder origin is routed to the deployment just created, with a
      # GitHub OIDC header; the Vercel project must trust this workflow for
      # preview access.
      # Bounded by the gate's deadline (the job's timeout less the 3 minute
      # margin, counted from the gate), which hobo enforces before production
      # is created, promoted, and verified live, so recovery is reported before
      # the job is killed. The step timeout is a backstop only.
      - name: Deliver the relay through HoBo CD
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 17
        env:
          DEPLOY_DEADLINE: ${{ steps.gate.outputs.deadline }}
          HOBO_HOME: ${{ runner.temp }}/hobo-relay-deploy
          HOBO_CI_RELAY_PREVIEW_URL: https://relay-preview.invalid
          HOBO_CI_RELAY_PREVIEW_PROBE_OIDC: "true"
          HOBO_CI_RELAY_URL: https://relay-production.invalid
          HOBO_CI_RELAY_PUBLIC_URL: https://hobo-ci.vercel.app
          HOBO_CI_RELAY_STAGED_PRODUCTION: "true"
        run: |
          set -euo pipefail
          for target in preview production; do
            status=0
            node packages/hobo/dist/bin/hobo.js ci deploy \
              --cwd packages/ci-vercel --sha "$GITHUB_SHA" --ref "$GITHUB_REF_NAME" \
              --target "$target" --wait --deadline "$DEPLOY_DEADLINE" \
              --json > "$RUNNER_TEMP/relay-${target}.json" \
              2> "$RUNNER_TEMP/relay-${target}.stderr" || status=$?
            node --import tsx scripts/ci/relay-deploy-result-report.mts \
              "$RUNNER_TEMP/relay-${target}.json" "$target" \
              "$RUNNER_TEMP/relay-${target}.stderr" "$status" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$status" -ne 0 ]; then exit "$status"; fi
          done
      # The hosted relay's fleet verdict (ADR-0180) at its public origin. Route
      # jobs no longer ask it: they read the box relay's routing slip (ADR-0181),
      # which retires this route with the verdict store. Vercel has
      # already received the deployment, so this reports rather than gates: a red
      # check is the signal to roll back in the order of "Roll back" under
      # "Fleet verdict operations" in packages/ci-vercel/README.md. A relay
      # that does not answer never stops a run; route jobs never ask it.
      - name: Probe the fleet verdict at the public origin
        if: steps.gate.outputs.run == 'true'
        run: |
          set -uo pipefail
          origin="$(node -e '
            try {
              const project = JSON.parse(require("node:fs").readFileSync(".hobo/ci.json", "utf8"));
              const url = new URL(project.environments[project.defaultEnvironment].relayOrigin);
              if (url.protocol === "https:" && !url.username && !url.password) console.log(url.origin);
            } catch {}
          ')"
          if [ -z "$origin" ]; then
            echo "::error title=Relay fleet verdict::.hobo/ci.json names no https relayOrigin for its defaultEnvironment"
            exit 1
          fi
          repository="${GITHUB_REPOSITORY,,}"
          code="$(curl -sS -o "$RUNNER_TEMP/verdict.json" -w '%{http_code}' --max-time 20 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            "$origin/v1/fleet/verdicts/$repository" || echo 000)"
          echo "GET $origin/v1/fleet/verdicts/$repository answered $code"
          echo "- Fleet verdict at $origin: $code" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "200" ]; then
            echo "::error title=Relay fleet verdict::GET /v1/fleet/verdicts/$repository at $origin answered $code; route jobs no longer ask it (ADR-0181). Follow the rollback order in the fleet verdict runbook (packages/ci-vercel/README.md)"
            exit 1
          fi
          node -e '
            const want = String(process.env.GITHUB_REPOSITORY).toLowerCase();
            const isObject = (value) => typeof value === "object" && value !== null && !Array.isArray(value);
            let verdict;
            try { verdict = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); } catch {}
            if (!isObject(verdict) || verdict.repository !== want || !isObject(verdict.blocked)) {
              console.log(`::error title=Relay fleet verdict::the answer is not a fleet verdict for ${want} with a blocked object`);
              process.exit(1);
            }
            console.log(`fleet verdict for ${want}: blocked ${Object.keys(verdict.blocked).join(", ") || "nothing"}`);
          ' "$RUNNER_TEMP/verdict.json"

  # The GitHub App's credentials, from GitHub straight into the relay's
  # secrets manager (ADR-0179 amendment "Secretless first"): no person and no
  # machine but this job ever holds them, and this job holds no credential:
  # it signs in as hobo-ci-writer with its GitHub OIDC token (write-capable role).
  app-credentials:
    name: Deposit the GitHub App's credentials
    if: github.repository == 'Hobo-Labs/HoBo' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.event.inputs.manifest_code != ''
    needs: deploy-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mask the one-time manifest code
        env:
          HOBO_APP_MANIFEST_CODE: ${{ github.event.inputs.manifest_code }}
        run: echo "::add-mask::$HOBO_APP_MANIFEST_CODE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          clean: true
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - uses: $/.github/actions/ci-runner-preflight
      - uses: $/.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Download the built hobo CLI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: relay-deploy-cli
          path: ${{ runner.temp }}/relay-deploy-cli
      # Refused unless it is the build job's archive (digest) of this commit.
      - name: Restore the built hobo CLI (the deposit runs only this artifact)
        env:
          HOBO_RELAY_CLI_DIGEST: ${{ needs.deploy-build.outputs.digest }}
        run: node --no-warnings scripts/ci/release-freight-cli.mts restore "${RUNNER_TEMP}/relay-deploy-cli/relay-deploy-cli.tgz" --digest "$HOBO_RELAY_CLI_DIGEST"
      - name: Convert the manifest code and store the credentials (GitHub OIDC)
        env:
          HOBO_APP_MANIFEST_CODE: ${{ github.event.inputs.manifest_code }}
          RELAY_ORIGIN: ${{ github.event.inputs.relay }}
          APP_OWNER_ID: ${{ github.event.inputs.owner_id }}
        run: |
          set -euo pipefail
          status=0
          node packages/hobo/dist/bin/hobo.js ci app deposit \
            --cwd packages/ci-vercel \
            --relay "$RELAY_ORIGIN" --owner-id "$APP_OWNER_ID" \
            --json > "$RUNNER_TEMP/app-deposit.json" \
            2> "$RUNNER_TEMP/app-deposit.stderr" || status=$?
          node --import tsx scripts/ci/relay-deploy-result-report.mts \
            "$RUNNER_TEMP/app-deposit.json" "app-deposit" \
            "$RUNNER_TEMP/app-deposit.stderr" "$status" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
