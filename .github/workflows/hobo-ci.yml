name: HoBo CI Fabric

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    branches: [main]
    types: [checks_requested]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Per-job heap ≈ (HOBO_CI_WORKER_MEMORY_MB default 8192 / HOBO_TURBO_CONCURRENCY) × 0.75
  NODE_OPTIONS: --max-old-space-size=3072
  # Serial turbo test tasks on 8 GiB workers (@hobo/cli vitest also caps maxWorkers: 1).
  HOBO_TURBO_CONCURRENCY: "1"
  # Every turbo run writes .turbo/runs/<id>.json; ci-trace turns them into OTel spans.
  TURBO_RUN_SUMMARY: "true"
  # A git transfer under 1 KB/s for 30 s aborts instead of hanging (the pins use the same bound).
  # actions/checkout retries a failed fetch, so a stalled connection costs ~30 s, not the job's
  # whole timeout while it holds one of the box's two slots.
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "30"

# A newer push to main supersedes the in-progress one: its secret scan covers the full history and
# its gates test the newer tree, while the older run would hold box slots the merge queue is waiting
# for. The event name keeps schedule and workflow_dispatch on main out of the pushes' group, so a
# push never cancels them; merge_group runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  ci-runner-image:
    name: CI runner image (mise oci)
    # Skipped (which satisfies the required check) on merge_group: the PR run already evaluated
    # these inputs, and building here would retag the box's hobo-ci-worker:local from an unmerged
    # group commit. The push to main covers the merged tree.
    if: github.event_name != 'merge_group'
    # Trunk runs ask for their own label by default; HOBO_CI_TRUNK_RUNNER=false is the
    # kill switch for a box daemon too old to serve it. GitHub hands a runner to the oldest queued job its labels match,
    # so under the shared `hobo` label the runner the box launched for a main job went to an older
    # PR job instead. scripts/lint-actions.ts allows this expression and `hobo`, nothing else.
    runs-on: ${{ vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group"]'), github.event_name) && 'hobo-trunk' || 'hobo' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      # No submodules: the diff only needs the gitlink, not ts-autocode's tree. Trunk runs fetch
      # full history for the secret scan; depth 2 still gives HEAD~1 for the image-input diff.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      - name: Start secret scan (full history, background)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          : > "$RUNNER_TEMP/gitleaks/log"
          nohup bash -c '
            gitleaks git --config .gitleaks.toml --redact --exit-code 1 > "$1/log" 2>&1
            status=$?
            printf "%s\n" "$status" > "$1/exit.tmp"
            mv "$1/exit.tmp" "$1/exit"
          ' _ "$RUNNER_TEMP/gitleaks" </dev/null >/dev/null 2>&1 &
      - name: Detect runner image inputs changed
        id: rebuild
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # grep, not rg (the worker image ships no rg), and on a variable rather than a pipe,
          # where an early `grep -q` exit would fail the pipeline under pipefail.
          changed="$(git diff --name-only HEAD~1 HEAD)"
          if grep -qE \
            '^(mise\.(toml|lock)|packages/ci-gh-actions/deploy/ci-runner/|scripts/(lib/ci-runner-contract\.mts|ci-runner-preflight\.mts|test/ci-runner-image-contract\.test\.ts))' \
            <<<"${changed}"; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/ci-runner-preflight
        if: steps.rebuild.outputs.needed == 'true'
      - uses: ./.github/actions/pnpm-store
        if: steps.rebuild.outputs.needed == 'true'
      - name: Install root deps for shell lint
        if: steps.rebuild.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts --config.confirmModulesPurge=false
      - name: Build base + mise oci layers (native arch)
        if: steps.rebuild.outputs.needed == 'true'
        timeout-minutes: 15
        env:
          MISE_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          bash -n packages/ci-gh-actions/deploy/ci-runner/build.sh
          pnpm run lint:shell:changed -- --base=HEAD~1
          bash packages/ci-gh-actions/deploy/ci-runner/build.sh
      # Published from main only; a pull request's image is tried on the box, not shipped.
      - name: Push runner image to GHCR (optional)
        if: steps.rebuild.outputs.needed == 'true' && github.repository == 'Hobo-Labs/HoBo' && github.event_name != 'pull_request'
        env:
          MISE_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          version="$(node --no-warnings scripts/ci-runner-image-version.mts)"
          repo="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repo}/hobo-ci-worker:${version}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "hobo-ci-worker:${version}" "$image"
          docker push "$image"
          docker tag "hobo-ci-worker:local" "ghcr.io/${repo}/hobo-ci-worker:latest"
          docker push "ghcr.io/${repo}/hobo-ci-worker:latest"
      - name: Secret scan (full history)
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$RUNNER_TEMP/gitleaks"
          if [ ! -f "$scan_dir/exit" ] && [ ! -f "$scan_dir/log" ]; then
            echo "::error::Secret scan did not start: exit file and log are both absent."
            exit 1
          fi
          for ((attempt = 0; attempt < 300; attempt += 1)); do
            if [ -f "$scan_dir/exit" ]; then
              break
            fi
            sleep 1
          done
          if [ -f "$scan_dir/log" ]; then
            cat "$scan_dir/log"
          fi
          if [ ! -f "$scan_dir/exit" ]; then
            echo "::error::Timed out after 300 seconds waiting for the secret scan."
            exit 1
          fi
          status="$(cat "$scan_dir/exit")"
          exit "$status"

  pr-gate:
    name: PR impact gate
    # Waits for the image job: a pull request that changes the image inputs must test on the
    # image it built (that job retags hobo-ci-worker:local, which this job's container starts
    # from). When the inputs are unchanged that job is a short no-op. !cancelled() keeps this
    # required check running, never skipped, when the image build fails.
    needs: ci-runner-image
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ${{ vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group"]'), github.event_name) && 'hobo-trunk' || 'hobo' }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GITHUB_EVENT_MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/ci-runner-preflight
      - name: Turbo cache
        uses: ./.github/actions/turbo-cache
        with:
          turbo-token: ${{ github.event.pull_request.head.repo.fork && '' || secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          remote-mode: ${{ github.event.pull_request.head.repo.fork && 'remote:ro' || 'remote:rw' }}
      - name: Check the sibling pins (gitlink against checkout, offline)
        run: node --experimental-strip-types scripts/bootstrap-siblings.mts --status --offline
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: CI runner image contract (manifest)
        if: github.event_name == 'merge_group'
        run: pnpm exec vitest run scripts/test/ci-runner-image-contract.test.ts
      - name: Assert CI fabric contract
        if: github.event_name == 'merge_group'
        run: node --import tsx packages/ci-guard/bin/assert-ci-contract.ts
      - name: Resolve Turbo SCM base
        if: github.event_name == 'pull_request'
        id: scm-base
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          BASE="$(node --import tsx scripts/ci/turbo-scm-base.mts)"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          git fetch origin "${{ github.base_ref }}"
      - name: DCO sign-off check
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          DCO_BASE: origin/${{ github.base_ref }}
        run: |
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::warning::missing or mismatched DCO sign-off on $(git show -s --format='%h %s' "$sha") (expected 'Signed-off-by: $author')"
              missing=$((missing + 1))
            fi
          done < <(git rev-list "${DCO_BASE}..HEAD")
          if [ "$missing" -gt 0 ]; then
            echo "$missing commit(s) without a matching DCO sign-off. Fix with: git rebase --signoff ${DCO_BASE}"
            exit 1
          fi
          echo "All commits carry a matching DCO sign-off."
      - name: Code format gate
        if: github.event_name == 'pull_request'
        run: pnpm run lint:code
      - name: Relevant checks only
        if: github.event_name == 'pull_request'
        run: pnpm agent:check -- --base=origin/${{ github.base_ref }}
      - name: Dagger checks plan (native CI parity)
        if: github.event_name == 'pull_request'
        run: |
          pnpm exec turbo run build --filter=@hobo/ci-dagger --output-logs=new-only --concurrency=1
          pnpm --filter @hobo/ci-dagger checks --plan --config .hobo/dagger.json
      - name: Affected package lanes
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: ${{ steps.scm-base.outputs.base }}
        run: |
          set -euo pipefail
          # scripts/ci/affected-lanes.mts: skips only when every changed path is inert,
          # runs the whole workspace for root inputs, filters packages with dependents.
          mapfile -t FILTERS < <(
            git diff --name-only "${TURBO_SCM_BASE}"...HEAD \
              | node --experimental-strip-types --no-warnings scripts/ci/affected-lanes.mts
          )
          if [ "${#FILTERS[@]}" -eq 0 ]; then
            echo "Only inert paths changed; skipping turbo impact lanes"
            exit 0
          fi
          pnpm exec turbo run build typecheck lint test:unit test:schema test:contract:consumer \
            "${FILTERS[@]}" \
            --continue=never --concurrency=${HOBO_TURBO_CONCURRENCY:-100%} \
            --anon-profile=turbo-profile.json
      # main-gate's main-base, S0 gate set and Workspace tests steps mirror these steps.
      - name: Resolve the merge group base and gate scope
        if: github.event_name == 'merge_group'
        id: merge-group-base
        run: |
          set -euo pipefail
          # An unreachable merge-group base runs repo-wide; otherwise
          # scripts/ci/affected-lanes.mts --main-gate decides (repo-wide only for
          # root config, lockfile, toolchain pins).
          base="$GITHUB_EVENT_MERGE_GROUP_BASE_SHA"
          if [ -n "$base" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then base=""; fi
          # Package tests go repo-wide only for inputs turbo hashes into every task; a
          # workflow edit cannot change a package's test result.
          scope="repo-wide"
          tests="all"
          if [ -n "$base" ]; then
            changed="$(git diff --name-only "$base" HEAD)"
            scope="$(node --experimental-strip-types --no-warnings scripts/ci/affected-lanes.mts --main-gate <<<"$changed")"
            lanes="$(node --experimental-strip-types --no-warnings scripts/ci/affected-lanes.mts <<<"$changed")"
            if [ "$lanes" != "--filter=*" ]; then tests="affected"; fi
          fi
          echo "merge group gate: ${scope}, workspace tests: ${tests} (base ${base:-none})"
          {
            echo "base=${base}"
            echo "scope=${scope}"
            echo "tests=${tests}"
          } >> "$GITHUB_OUTPUT"
      - name: S0 gate set
        if: github.event_name == 'merge_group'
        timeout-minutes: 12
        env:
          # One vitest fork at a time: four forks (default) with 3 GiB heaps plus
          # componentize-js wizer exceed the 6 GiB job container and get OOM-killed.
          HOBO_RELEVANT_CHECK_CONCURRENCY: "1"
          SCOPE: ${{ steps.merge-group-base.outputs.scope }}
          BASE: ${{ steps.merge-group-base.outputs.base }}
        run: |
          set -euo pipefail
          if [ "$SCOPE" = "affected" ]; then
            pnpm agent:check -- --base="$BASE"
          else
            pnpm run check:all
          fi
      - name: Workspace tests
        if: github.event_name == 'merge_group'
        # The whole-workspace sweep (a lockfile/root-config change) is not held
        # to the merge-group budget.
        timeout-minutes: ${{ steps.merge-group-base.outputs.tests == 'affected' && 10 || 40 }}
        env:
          TESTS: ${{ steps.merge-group-base.outputs.tests }}
          BASE: ${{ steps.merge-group-base.outputs.base }}
        run: |
          set -euo pipefail
          if [ "$TESTS" = "affected" ]; then
            # Changed packages run whole; their dependents run only the test files whose
            # import closure reaches a changed file (scripts/ci/dependent-tests.mts).
            git diff --name-only "$BASE" HEAD |
              node --experimental-strip-types --no-warnings scripts/ci/dependent-tests.mts \
                --run --anon-profile=turbo-profile.json
          else
            pnpm exec turbo run test \
              --concurrency=${HOBO_TURBO_CONCURRENCY:-100%} --anon-profile=turbo-profile.json
          fi
      # The prune decides whether the save runs at all. Skipped here, the save's
      # composite never starts, so the runner never resolves actions/cache/save:
      # that resolve once spent 2 minutes timing out against the GitHub API.
      - name: Prune Turbo cache
        id: turbo-prune
        if: always() && env.TURBO_TOKEN == ''
        continue-on-error: true
        run: node --experimental-strip-types --no-warnings scripts/ci/turbo-cache-prune.mts
      - name: Save Turbo cache
        if: always() && steps.turbo-prune.outputs.save != 'false'
        uses: ./.github/actions/turbo-cache
        with:
          mode: save
      - name: CI trace
        if: always()
        uses: ./.github/actions/ci-trace

  pr-offpath:
    # Off the critical path: these used to run inside the PR impact gate.
    name: PR off-path checks (ts-autocode surface, production packages)
    if: github.event_name == 'pull_request'
    runs-on: hobo
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          # Depth 2 holds the PR merge commit and its first parent (the base tip).
          fetch-depth: 2
      - uses: ./.github/actions/ci-runner-preflight
      - name: Decide whether the diff reaches packages, pins or submodules
        id: scope
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            echo "HEAD is not a PR merge commit; running every check"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only HEAD^1 HEAD)"
          LANES="$(printf '%s\n' "$CHANGED" | node --experimental-strip-types --no-warnings scripts/ci/affected-lanes.mts)"
          # ts-autocode surface and package-boundary inputs that live outside packages/.
          PINS="$(printf '%s\n' "$CHANGED" | grep -E '^(external/|tools/pins/|\.gitmodules$|scripts/test/ts-autocode-|scripts/bootstrap-siblings\.mts$|scripts/check-package-boundaries)' || true)"
          if [ -z "$LANES" ] && [ -z "$PINS" ]; then
            echo "Only inert paths changed; skipping install, ts-autocode surface and production packages gate"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Turbo cache
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/turbo-cache
        with:
          turbo-token: ${{ github.event.pull_request.head.repo.fork && '' || secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          remote-mode: ${{ github.event.pull_request.head.repo.fork && 'remote:ro' || 'remote:rw' }}
      - uses: ./.github/actions/pnpm-store
        if: steps.scope.outputs.run == 'true'
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Every name HoBo imports from ts-autocode exists at the pin, and its grounding fields are still checked
        if: steps.scope.outputs.run == 'true'
        run: node --import tsx --test scripts/test/ts-autocode-consumer-surface.test.ts scripts/test/ts-autocode-grounding-drift.test.ts
      - name: Production packages gate
        if: steps.scope.outputs.run == 'true'
        run: pnpm run build:packages
      - name: Prune Turbo cache
        id: turbo-prune
        if: always() && steps.scope.outputs.run == 'true' && env.TURBO_TOKEN == ''
        continue-on-error: true
        run: node --experimental-strip-types --no-warnings scripts/ci/turbo-cache-prune.mts
      - name: Save Turbo cache
        if: always() && steps.scope.outputs.run == 'true' && steps.turbo-prune.outputs.save != 'false'
        uses: ./.github/actions/turbo-cache
        with:
          mode: save
      - name: CI trace
        if: always()
        uses: ./.github/actions/ci-trace

  main-gate:
    name: Main full gate
    # Not a required check and not run on merge_group: merge_group now runs the same
    # affected gate inside the required PR impact gate instead.
    # pr-gate's merge-group affected steps mirror this job's main-base, S0 gate set and Workspace tests steps.
    # Same reason as pr-gate: a push that changes the image inputs tests on the image it built.
    needs: ci-runner-image
    if: >-
      !cancelled() && (
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ${{ vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group"]'), github.event_name) && 'hobo-trunk' || 'hobo' }}
    # A main run past 20 minutes is a failure; the step timeouts below fail a hang sooner.
    # The weekly schedule is the one whole-workspace sweep and gets an hour.
    timeout-minutes: ${{ github.event_name == 'schedule' && 60 || 20 }}
    permissions:
      contents: read
    # At most one Main full gate holds a box slot, whatever event started it, so the other slot
    # stays free for the short required jobs. A newer waiting gate replaces an older waiting one.
    concurrency:
      group: ${{ github.workflow }}-main-gate
      cancel-in-progress: false
    env:
      GITHUB_EVENT_MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/ci-runner-preflight
      - name: Turbo cache
        uses: ./.github/actions/turbo-cache
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          remote-mode: remote:rw
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: CI runner image contract (manifest)
        run: pnpm exec vitest run scripts/test/ci-runner-image-contract.test.ts
      - name: Assert CI fabric contract
        run: node --import tsx packages/ci-guard/bin/assert-ci-contract.ts
      - name: Seed the pnpm store cache for PRs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/pnpm-store
        with:
          mode: save
      - name: Resolve the previous main commit and the gate scope
        id: main-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # The push's `before`, or HEAD~1 for a dispatch. The weekly schedule and an
          # unreachable base run repo-wide; otherwise scripts/ci/affected-lanes.mts
          # --main-gate decides (repo-wide only for root config, lockfile, toolchain pins).
          base=""
          if [ "$EVENT_NAME" = "push" ]; then base="$PUSH_BEFORE"; fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then base="$(git rev-parse HEAD~1)"; fi
          if [ -n "$base" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then base=""; fi
          # Package tests go repo-wide only for inputs turbo hashes into every task; a
          # workflow edit cannot change a package's test result.
          scope="repo-wide"
          tests="all"
          if [ -n "$base" ]; then
            changed="$(git diff --name-only "$base" HEAD)"
            scope="$(node --experimental-strip-types --no-warnings scripts/ci/affected-lanes.mts --main-gate <<<"$changed")"
            lanes="$(node --experimental-strip-types --no-warnings scripts/ci/affected-lanes.mts <<<"$changed")"
            if [ "$lanes" != "--filter=*" ]; then tests="affected"; fi
          fi
          echo "main gate: ${scope}, workspace tests: ${tests} (base ${base:-none})"
          {
            echo "base=${base}"
            echo "scope=${scope}"
            echo "tests=${tests}"
          } >> "$GITHUB_OUTPUT"
      - name: S0 gate set
        timeout-minutes: 12
        env:
          # One vitest fork at a time: four forks (default) with 3 GiB heaps plus
          # componentize-js wizer exceed the 6 GiB job container and get OOM-killed.
          HOBO_RELEVANT_CHECK_CONCURRENCY: "1"
          SCOPE: ${{ steps.main-base.outputs.scope }}
          BASE: ${{ steps.main-base.outputs.base }}
        run: |
          set -euo pipefail
          if [ "$SCOPE" = "affected" ]; then
            pnpm agent:check -- --base="$BASE"
          else
            pnpm run check:all
          fi
      - name: Workspace tests
        # The whole-workspace sweep (weekly, or a lockfile/root-config change) is not held
        # to the main-push budget.
        timeout-minutes: ${{ steps.main-base.outputs.tests == 'affected' && 10 || 40 }}
        env:
          TESTS: ${{ steps.main-base.outputs.tests }}
          BASE: ${{ steps.main-base.outputs.base }}
        run: |
          set -euo pipefail
          if [ "$TESTS" = "affected" ]; then
            # Changed packages run whole; their dependents run only the test files whose
            # import closure reaches a changed file (scripts/ci/dependent-tests.mts).
            git diff --name-only "$BASE" HEAD |
              node --experimental-strip-types --no-warnings scripts/ci/dependent-tests.mts \
                --run --anon-profile=turbo-profile.json
          else
            pnpm exec turbo run test \
              --concurrency=${HOBO_TURBO_CONCURRENCY:-100%} --anon-profile=turbo-profile.json
          fi
      - name: Prune Turbo cache
        id: turbo-prune
        if: always() && env.TURBO_TOKEN == ''
        continue-on-error: true
        run: node --experimental-strip-types --no-warnings scripts/ci/turbo-cache-prune.mts
      - name: Save Turbo cache
        if: always() && steps.turbo-prune.outputs.save != 'false'
        uses: ./.github/actions/turbo-cache
        with:
          mode: save
      - name: CI trace
        if: always()
        uses: ./.github/actions/ci-trace

  artifact-trust:
    name: artifact signing and install verification
    if: github.event_name == 'pull_request'
    runs-on: hobo
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          # Depth 2 holds the PR merge commit and its first parent (the base tip).
          fetch-depth: 2
      - uses: ./.github/actions/ci-runner-preflight
      - name: Decide whether the diff reaches the artifact trust proof
        id: scope
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            echo "HEAD is not a PR merge commit; running the check"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD \
            | node --experimental-strip-types --no-warnings scripts/ci/job-scope.mts \
              vitest.config.ts \
              src/draft/technical-proofs/componentize-artifact-trust-contract/test/publish-verify.test.ts \
              >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Verify signed hello-bindle and refuse stripped signatures
        if: steps.scope.outputs.run == 'true'
        run: pnpm test:file src/draft/technical-proofs/componentize-artifact-trust-contract/test/publish-verify.test.ts

  dev-cold-loop-gate:
    name: hobo dev cold loop (offline <=60s)
    if: github.event_name == 'pull_request'
    runs-on: hobo
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 2
      - uses: ./.github/actions/ci-runner-preflight
      - name: Decide whether the diff reaches the cold dev loop
        id: scope
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            echo "HEAD is not a PR merge commit; running the check"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD \
            | node --experimental-strip-types --no-warnings scripts/ci/job-scope.mts \
              scripts/ci/dev-cold-loop-timing.mts \
              >> "$GITHUB_OUTPUT"
      # Only what scripts/ci/dev-cold-loop-timing.mts imports: every byte installed here
      # is copied out of the store and then streamed into the offline container, and
      # the full workspace (4.3 GB) made this job disk-bound on a loaded box. The root
      # `prepare` only checks packages/runtime's ts-autocode links, which are not installed.
      - if: steps.scope.outputs.run == 'true'
        run: >-
          pnpm install --frozen-lockfile --ignore-scripts --config.confirmModulesPurge=false
          --filter .
          --filter "./packages/cli..."
          --filter "./src/draft/technical-proofs/hobo-612-dev-local-loop-poc..."
          --filter "./src/draft/technical-proofs/hobo-new-scaffold-contract..."
          --filter "ts-autocode-*..."
      - name: Cold hobo dev gate (network disabled)
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          image="hobo-ci-worker:local"
          tar -c --exclude=./.git . | docker run -i --rm --network=none \
            "$image" \
            bash -c 'set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          tar -x
          pnpm --filter "ts-autocode-*" run build
          node --import tsx scripts/ci/dev-cold-loop-timing.mts'

  ci-guard:
    name: CI fabric contract guard
    # On other events, these steps run inside Main full gate or PR impact gate.
    if: github.event_name == 'pull_request'
    runs-on: hobo
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - uses: ./.github/actions/ci-runner-preflight
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: CI runner image contract (manifest)
        run: pnpm exec vitest run scripts/test/ci-runner-image-contract.test.ts
      - name: Assert CI fabric contract
        run: node --import tsx packages/ci-guard/bin/assert-ci-contract.ts

  secret-scan:
    name: Secret scan
    # Skipped (which satisfies the required check) on merge_group and trunk events; trunk runs
    # scan the full history inside ci-runner-image in parallel with the image build.
    if: github.event_name == 'pull_request'
    runs-on: hobo
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # No submodules: gitleaks scans this repository's history, not ts-autocode's.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-runner-preflight
      - name: Scan git history for secrets
        run: |
          set -euo pipefail
          gitleaks git --config .gitleaks.toml --redact --exit-code 1 \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
