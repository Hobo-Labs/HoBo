name: HoBo CI Fabric

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    branches: [main]
    types: [checks_requested]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # ci-runner-preflight replaces these from the job's cgroup limit. The worker
  # injects NODE_OPTIONS at container creation so every Node process gets its heap cap.
  HOBO_TURBO_CONCURRENCY: "1"
  HOBO_TEST_MAX_WORKERS: "1"
  # Every turbo run writes .turbo/runs/<id>.json; ci-trace turns them into OTel spans.
  TURBO_RUN_SUMMARY: "true"
  # A git transfer under 1 KB/s for 30 s aborts instead of hanging (the pins use the same bound).
  # actions/checkout retries a failed fetch, so a stalled connection costs ~30 s, not the job's
  # whole timeout while it holds one of the box's two slots.
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "30"

# A newer push to main supersedes the in-progress one: its secret scan covers the landed
# range (schedule still does full history after a blob backfill) and its gates test the
# newer tree, while the older run would hold box slots the merge queue is waiting for.
# The event name keeps schedule and workflow_dispatch on main out of the pushes' group, so a
# push never cancels them; merge_group runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  route:
    name: Route runners
    # GitHub-hosted on purpose: the choice of runner must not wait on the fleet
    # it is choosing against. The fleet while it takes jobs, an enrolled local
    # box when it does not, GitHub-hosted when neither does (scripts/ci/route-runner.mts).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      runner: ${{ steps.route.outputs.runner }}
      tier: ${{ steps.route.outputs.tier }}
      # A signed local run verified for this tree (scripts/ci/verify-attestation.mts):
      # the jobs it covers are skipped. `false` and `[]` when there is none.
      attested: ${{ steps.route.outputs.attested }}
      attested-jobs: ${{ steps.route.outputs.attested-jobs }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/route-runner
            scripts/ci/route-runner.mts
            scripts/ci/attestation.mts
            scripts/ci/verify-attestation.mts
            packages/ci/src/fleet-overflow.ts
      - id: route
        uses: ./.github/actions/route-runner
        with:
          token: ${{ github.token }}
          mode: ${{ vars.HOBO_CI_ROUTE }}
          local-runner: ${{ vars.HOBO_CI_LOCAL_RUNNER }}
          max-wait-seconds: ${{ vars.HOBO_CI_ROUTE_MAX_WAIT_SECONDS }}
          max-queued: ${{ vars.HOBO_CI_ROUTE_MAX_QUEUED }}
          trunk-runner: ${{ vars.HOBO_CI_TRUNK_RUNNER }}

  ci-runner-image:
    name: CI runner image (mise oci)
    needs: route
    # Skipped (which satisfies the required check) on merge_group: the PR run already evaluated
    # these inputs, and building here would retag the box's hobo-ci-worker:local from an unmerged
    # group commit. The push to main covers the merged tree.
    # A push whose per-commit file lists contain no image input also skips, satisfying needs at
    # once so Main full gate does not wait for a no-op. Missing file lists and forced pushes build.
    if: >-
      github.event_name != 'merge_group' && (
      github.event_name != 'push' ||
      github.event.commits[0] == null ||
      github.event.forced == true ||
      contains(format('{0}{1}{2}', toJSON(github.event.commits.*.added), toJSON(github.event.commits.*.modified), toJSON(github.event.commits.*.removed)), '"mise.toml') ||
      contains(format('{0}{1}{2}', toJSON(github.event.commits.*.added), toJSON(github.event.commits.*.modified), toJSON(github.event.commits.*.removed)), '"mise.lock') ||
      contains(format('{0}{1}{2}', toJSON(github.event.commits.*.added), toJSON(github.event.commits.*.modified), toJSON(github.event.commits.*.removed)), '"packages/ci-gh-actions/deploy/ci-runner/') ||
      contains(format('{0}{1}{2}', toJSON(github.event.commits.*.added), toJSON(github.event.commits.*.modified), toJSON(github.event.commits.*.removed)), '"scripts/lib/ci-runner-contract.mts') ||
      contains(format('{0}{1}{2}', toJSON(github.event.commits.*.added), toJSON(github.event.commits.*.modified), toJSON(github.event.commits.*.removed)), '"scripts/ci-runner-preflight.mts') ||
      contains(format('{0}{1}{2}', toJSON(github.event.commits.*.added), toJSON(github.event.commits.*.modified), toJSON(github.event.commits.*.removed)), '"scripts/test/ci-runner-image-contract.test.ts'))
    # The route job picks the label: the fleet while it takes jobs, else an enrolled local box,
    # else GitHub-hosted. On the fleet, trunk runs ask for their own label by default;
    # HOBO_CI_TRUNK_RUNNER=false is the kill switch for a box daemon too old to serve it. GitHub
    # hands a runner to the oldest queued job its labels match, so under the shared `hobo` label
    # the runner the box launched for a main job went to an older PR job instead.
    # scripts/lint-actions.ts allows this expression, the trunk expression and `hobo`.
    runs-on: ${{ needs.route.outputs.runner || (vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo') }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      # No submodules: the diff only needs the gitlink, not ts-autocode's tree. Depth 2 gives
      # HEAD~1 for the image-input diff; the full-history secret scan lives in main-gate.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: false
          fetch-depth: 2
      - name: Detect runner image inputs changed
        id: rebuild
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # grep, not rg (the worker image ships no rg), and on a variable rather than a pipe,
          # where an early `grep -q` exit would fail the pipeline under pipefail.
          changed="$(git diff --name-only HEAD~1 HEAD)"
          if grep -qE \
            '^(mise\.(toml|lock)|packages/ci-gh-actions/deploy/ci-runner/|scripts/(lib/ci-runner-contract\.mts|ci-runner-preflight\.mts|test/ci-runner-image-contract\.test\.ts))' \
            <<<"${changed}"; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/ci-runner-preflight
        if: steps.rebuild.outputs.needed == 'true'
      - uses: ./.github/actions/pnpm-store
        if: steps.rebuild.outputs.needed == 'true'
      - name: Install root deps for shell lint
        if: steps.rebuild.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts --config.confirmModulesPurge=false
      - name: Build base + mise oci layers (native arch)
        id: ci_runner_image_build
        if: steps.rebuild.outputs.needed == 'true'
        timeout-minutes: 15
        env:
          MISE_EXPERIMENTAL: "1"
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node --no-warnings scripts/ci/run-job-command-report.mts
          --label ci-runner-oci-build --
          bash -lc
          "set -euo pipefail
          bash -n packages/ci-gh-actions/deploy/ci-runner/build.sh
          pnpm run lint:shell:changed -- --base=HEAD~1
          bash packages/ci-gh-actions/deploy/ci-runner/build.sh"
      - name: Upload CI runner image build log
        if: failure() && steps.ci_runner_image_build.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-runner-oci-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/hobo-ci-job-logs/ci-runner-oci-build.log
          if-no-files-found: ignore
      # Published from main only; a pull request's image is tried on the box, not shipped.
      - name: Push runner image to GHCR (optional)
        if: steps.rebuild.outputs.needed == 'true' && github.repository == 'Hobo-Labs/HoBo' && github.event_name != 'pull_request'
        env:
          MISE_EXPERIMENTAL: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node --no-warnings scripts/ci/push-ci-runner-image-ghcr.mts

  ci-deps-image:
    name: CI deps layer (pnpm)
    needs: [ci-runner-image]
    if: >-
      !cancelled() && needs.ci-runner-image.result != 'failure' && (
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request')
    # Always the fleet, never routed: this job checks and builds the deps image in the box's
    # own Docker context. On a GitHub-hosted machine there is no such context and no worker
    # image, so a routed run failed here before it reached the build. The required PR
    # gate and Main full gate's S0 job do not need this job, so a slow fleet does not
    # delay them. Main's workspace plan and shards do, to start from the deps layer;
    # on main this job never builds: it reuses or pulls an image, or defers a miss.
    runs-on: ${{ vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo' }}
    timeout-minutes: 20
    # Any event can reuse an existing content-keyed image. Only PR misses build
    # and run the contract; non-PR misses defer to the publisher and daemon.
    # Local and GHCR candidates verify before non-PR promotion.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          clean: false
          fetch-depth: 1
      - name: Limit PR builds to deps image inputs
        id: scope
        run: |
          set -euo pipefail
          run=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --depth=1 origin "$base"
            changed="$(git diff --name-only "$base" HEAD -- \
              packages/ci-gh-actions/deploy/ci-runner/deps \
              scripts/ci/deps-key.mts \
              scripts/ci/deps-layer-buckets.mts \
              scripts/ci/deps-layer.mts \
              scripts/lib/deps-key.mts \
              scripts/lib/ts-source-resolve.mts \
              packages/ci-gh-actions/src/isolated-worker/worker-storage-fs.ts \
              scripts/test/ci-deps-image-mount.test.ts)"
            if [ -z "$changed" ]; then run=false; fi
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
      - name: Compute deps key
        if: steps.scope.outputs.run == 'true'
        id: key
        run: echo "key=$(node --no-warnings scripts/ci/deps-key.mts)" >> "$GITHUB_OUTPUT"
      - name: Check current local deps image
        if: steps.scope.outputs.run == 'true'
        id: current
        run: |
          set -euo pipefail
          actual="$(docker image inspect hobo-ci-deps:local --format '{{ index .Config.Labels "hobo.ci.deps-key" }}' 2>/dev/null || true)"
          current=false
          if [ "$actual" = "${{ steps.key.outputs.key }}" ]; then current=true; fi
          echo "current=${current}" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR for read-only cache
        if: steps.scope.outputs.run == 'true' && steps.current.outputs.current != 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Resolve local or GHCR deps image
        if: steps.scope.outputs.run == 'true' && steps.current.outputs.current != 'true'
        id: source
        run: |
          set -euo pipefail
          candidate="hobo-ci-deps:${{ steps.key.outputs.key }}"
          remote="ghcr.io/${GITHUB_REPOSITORY,,}/hobo-ci-deps:${{ steps.key.outputs.key }}"
          source=build
          if docker image inspect "$candidate" >/dev/null 2>&1; then
            source=local
          elif docker manifest inspect "$remote" >/dev/null 2>&1; then
            docker pull "$remote"
            docker tag "$remote" "$candidate"
            source=ghcr
          fi
          echo "source=${source}" >> "$GITHUB_OUTPUT"
      - name: Build deps image and verify offline install
        if: steps.scope.outputs.run == 'true' && steps.current.outputs.current != 'true' && steps.source.outputs.source == 'build' && github.event_name == 'pull_request'
        id: build
        run: bash packages/ci-gh-actions/deploy/ci-runner/deps/build-deps.sh --no-promote
      - name: Defer non-PR deps image miss
        if: steps.scope.outputs.run == 'true' && steps.current.outputs.current != 'true' && steps.source.outputs.source == 'build' && github.event_name != 'pull_request'
        run: echo "Key miss deferred to CI deps image publisher and the daemon ensure loop; skipping Fabric rebuild"
      - name: Verify deps image under job mount
        if: steps.scope.outputs.run == 'true' && steps.current.outputs.current != 'true' && (steps.source.outputs.source != 'build' || github.event_name == 'pull_request')
        env:
          HOBO_CI_DEPS_MOUNT_CONTRACT: '1'
          HOBO_CI_DEPS_IMAGE: hobo-ci-deps:${{ steps.key.outputs.key }}
          HOBO_CI_DEPS_LAYER: ${{ steps.key.outputs.key }}
        run: node --experimental-strip-types --no-warnings --import ./scripts/lib/ts-source-resolve.mts --test scripts/test/ci-deps-image-mount.test.ts
      - name: Promote verified deps image
        if: steps.scope.outputs.run == 'true' && steps.current.outputs.current != 'true' && steps.source.outputs.source != 'build' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          candidate="hobo-ci-deps:${{ steps.key.outputs.key }}"
          docker tag "$candidate" hobo-ci-deps:local
          node --experimental-strip-types --no-warnings scripts/ci-runner-image-gc.mts "$candidate"
      - name: Remove PR candidate tag (never a later local-hit promotion)
        if: always() && github.event_name == 'pull_request' && steps.source.outputs.source == 'build'
        run: docker image rm "hobo-ci-deps:${{ steps.key.outputs.key }}" >/dev/null 2>&1 || true

  pr_gate_validation:
    name: PR impact validation
    # Waits for the image job: a pull request that changes the image inputs must test on the
    # image it built (that job retags hobo-ci-worker:local, which this job's container starts
    # from). When the inputs are unchanged that job is a short no-op. !cancelled() keeps this
    # validation running, never skipped, when the image build fails. The
    # required PR impact gate below combines this result with merge-group tests.
    needs: [route, ci-runner-image]
    # Skipped when the route job verified a signed local run of this job for this tree.
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !(needs.route.outputs.attested == 'true' && contains(needs.route.outputs.attested-jobs, '"pr_gate_validation"')) }}
    runs-on: ${{ needs.route.outputs.runner || (vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo') }}
    # Large affected sets can need a cold-cache run; retain the workflow-wide cap.
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      merge_base: ${{ steps.merge-group-base.outputs.base }}
      merge_tests: ${{ steps.merge-group-base.outputs.tests }}
      pr_base: ${{ steps.scm-base.outputs.base }}
      shards: ${{ steps.shard-plan.outputs.shards }}
    env:
      GITHUB_EVENT_MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          clean: false
          fetch-depth: 0
      - uses: ./.github/actions/ci-runner-preflight
        with:
          browser: "true"
      - name: Turbo cache
        uses: ./.github/actions/turbo-cache
        with:
          turbo-token: ${{ github.event.pull_request.head.repo.fork && '' || secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          remote-mode: ${{ github.event.pull_request.head.repo.fork && 'remote:ro' || 'remote:rw' }}
      - name: Check the sibling pins (gitlink against checkout, offline)
        run: node --experimental-strip-types scripts/bootstrap-siblings.mts --status --offline
      - uses: ./.github/actions/pnpm-store
      - name: Link deps layer
        run: node --experimental-strip-types scripts/ci/deps-layer.mts link
      - name: Check deps layer match
        id: deps-layer
        run: node --experimental-strip-types scripts/ci/deps-layer.mts check
      - name: Verify deps layer sibling links
        if: steps.deps-layer.outputs.match == 'true'
        run: node --import tsx scripts/ensure-ts-autocode-links.mts
      - name: Install dependencies
        if: steps.deps-layer.outputs.match != 'true'
        run: node --experimental-strip-types --no-warnings scripts/ci/pnpm-install.mts --frozen-lockfile --config.confirmModulesPurge=false
      - name: CI runner image contract (manifest)
        if: github.event_name == 'merge_group'
        run: node --import tsx --test scripts/test/ci-runner-image-contract.test.ts
      - name: Assert CI fabric contract
        if: github.event_name == 'merge_group'
        run: node --import tsx packages/ci-guard/bin/assert-ci-contract.ts
      - name: Resolve Turbo SCM base
        if: github.event_name == 'pull_request'
        id: scm-base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "PR base SHA is missing or invalid" >&2; exit 1
          fi
          git cat-file -e "${PR_BASE_SHA}^{commit}" || git fetch --no-tags origin "$PR_BASE_SHA"
          BASE="$(git merge-base "$PR_BASE_SHA" HEAD)"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
      # Shadow only: classifies non-meaningful (inert) paths and reports
      # the lanes they would drop. Execution below is unchanged in every
      # mode; HOBO_IMPACT_GATE=off disables the report.
      - name: Impact classification (shadow)
        if: github.event_name == 'pull_request' && vars.HOBO_IMPACT_GATE != 'off'
        continue-on-error: true
        timeout-minutes: 2
        env:
          TURBO_SCM_BASE: ${{ steps.scm-base.outputs.base }}
          HOBO_IMPACT_GATE: ${{ vars.HOBO_IMPACT_GATE || 'shadow' }}
        run: |
          set -euo pipefail
          git diff --name-only "${TURBO_SCM_BASE}"...HEAD \
            | node --experimental-strip-types --no-warnings scripts/ci/impact-classifier.mts --base="${TURBO_SCM_BASE}" \
            > "$RUNNER_TEMP/impact-plan.json"
      - name: DCO sign-off check
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          DCO_BASE: origin/${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Merge commits carry no sign-off of their own: the checked-out PR merge
          # ref and an update-branch merge are made by GitHub. Only the commits a
          # contributor wrote are checked. The list is read into a variable first so
          # a failing rev-list fails the step instead of reading as zero commits.
          commits="$(git rev-list --no-merges "${DCO_BASE}..HEAD")"
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            author="$(git show -s --format='%an <%ae>' "$sha")"
            # On a variable rather than a pipe: an early `grep -q` exit would fail the
            # pipeline under pipefail and read as a missing sign-off.
            message="$(git show -s --format='%B' "$sha")"
            if ! grep -qiF "Signed-off-by: $author" <<<"$message"; then
              echo "::warning::missing or mismatched DCO sign-off on $(git show -s --format='%h %s' "$sha") (expected 'Signed-off-by: $author')"
              missing=$((missing + 1))
            fi
          done <<<"$commits"
          if [ "$missing" -gt 0 ]; then
            echo "$missing commit(s) without a matching DCO sign-off. Fix with: git rebase --signoff ${DCO_BASE}"
            exit 1
          fi
          echo "All commits carry a matching DCO sign-off."
      - name: Code format gate
        if: github.event_name == 'pull_request'
        run: pnpm run lint:code
      - name: Relevant checks only
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ steps.scm-base.outputs.base }}
        run: pnpm agent:check -- --base="$BASE" --external-workspace-tests
      # main-gate's main-base and S0 gate set steps mirror these steps.
      - name: Resolve the merge group base and gate scope
        if: github.event_name == 'merge_group'
        id: merge-group-base
        run: |
          set -euo pipefail
          # An unreachable merge-group base runs repo-wide; otherwise
          # scripts/ci/affected-lanes.mts --main-gate decides. Root scripts and
          # //# tasks stay scoped; globalDependencies and other shared inputs widen.
          base="$GITHUB_EVENT_MERGE_GROUP_BASE_SHA"
          if [ -n "$base" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then base=""; fi
          # A workflow edit cannot change a package's test result.
          scope="repo-wide"
          tests="all"
          if [ -n "$base" ]; then
            changed="$(git diff --name-only "$base" HEAD)"
            scope="$(node --experimental-strip-types --no-warnings scripts/ci/affected-lanes.mts --main-gate --base="$base" <<<"$changed")"
            lanes="$(node --experimental-strip-types --no-warnings scripts/ci/affected-lanes.mts --base="$base" <<<"$changed")"
            if [ "$lanes" != "--filter=*" ]; then tests="affected"; fi
          fi
          echo "merge group gate: ${scope}, workspace tests: ${tests} (base ${base:-none})"
          {
            echo "base=${base}"
            echo "scope=${scope}"
            echo "tests=${tests}"
          } >> "$GITHUB_OUTPUT"
      # One shard per four planned suites, eight at most (finding 82). The fixed
      # matrix started eight runners for every change; 13 of the last 20 merges
      # planned four suites or fewer. Any doubt keeps all eight: a repo-wide
      # scope, a missing base, a planner failure, an odd answer.
      - name: Plan workspace test shards
        id: shard-plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ steps.scm-base.outputs.base }}
          MERGE_TESTS: ${{ steps.merge-group-base.outputs.tests }}
          MERGE_BASE: ${{ steps.merge-group-base.outputs.base }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) TESTS=affected; BASE="$PR_BASE" ;;
            *) TESTS="$MERGE_TESTS"; BASE="$MERGE_BASE" ;;
          esac
          shards='[0, 1, 2, 3, 4, 5, 6, 7]'
          if [ "$TESTS" = "affected" ] && [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            planned="$(git diff --name-only "$BASE" HEAD |
              node --experimental-strip-types --no-warnings scripts/ci/dependent-tests.mts \
                --base="$BASE" --plan-shards=8)" || planned=""
            if [[ "$planned" =~ ^\[[0-7](,\ [0-7])*\]$ ]]; then shards="$planned"; fi
          fi
          echo "workspace test shards: ${shards}"
          echo "shards=${shards}" >> "$GITHUB_OUTPUT"
      - name: Impact classification (shadow)
        if: github.event_name == 'merge_group' && steps.merge-group-base.outputs.base != '' && vars.HOBO_IMPACT_GATE != 'off'
        continue-on-error: true
        timeout-minutes: 2
        env:
          BASE: ${{ steps.merge-group-base.outputs.base }}
          HOBO_IMPACT_GATE: ${{ vars.HOBO_IMPACT_GATE || 'shadow' }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE" HEAD \
            | node --experimental-strip-types --no-warnings scripts/ci/impact-classifier.mts --base="$BASE" --meaningful-out="$RUNNER_TEMP/impact-meaningful.txt" \
            > "$RUNNER_TEMP/impact-plan.json"
      - name: S0 gate set
        if: github.event_name == 'merge_group'
        timeout-minutes: 20
        env:
          # One vitest fork at a time: four forks (default) with 3 GiB heaps plus
          # componentize-js wizer exceed the 6 GiB job container and get OOM-killed.
          HOBO_RELEVANT_CHECK_CONCURRENCY: "1"
          SCOPE: ${{ steps.merge-group-base.outputs.scope }}
          BASE: ${{ steps.merge-group-base.outputs.base }}
        run: |
          set -euo pipefail
          node --experimental-strip-types --no-warnings scripts/ci/prune-stray-workspace-packages.mts
          if [ "$SCOPE" = "affected" ]; then
            pnpm agent:check -- --base="$BASE" --external-workspace-tests
          else
            pnpm run check:all
          fi
      # The prune decides whether the save runs at all. Skipped here, the save's
      # composite never starts, so the runner never resolves actions/cache/save:
      # that resolve once spent 2 minutes timing out against the GitHub API.
      - name: Prune Turbo cache
        id: turbo-prune
        if: always() && env.TURBO_TOKEN == ''
        continue-on-error: true
        run: node --experimental-strip-types --no-warnings scripts/ci/turbo-cache-prune.mts
      - name: Save Turbo cache
        if: always() && steps.turbo-prune.outputs.save != 'false'
        uses: ./.github/actions/turbo-cache
        with:
          mode: save
      - name: CI trace
        if: always()
        uses: ./.github/actions/ci-trace

  workspace_tests:
    name: Workspace test shard ${{ matrix.shard }}
    # The required gate accepts validation only when every shard succeeds.
    needs: [route, pr_gate_validation]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.pr_gate_validation.result == 'success' && !(needs.route.outputs.attested == 'true' && contains(needs.route.outputs.attested-jobs, '"workspace_tests"')) }}
    # The shard list is the planner's; each job splits by its own position in
    # that list (strategy.job-index of strategy.job-total), so whatever list
    # arrives, every planned suite lands in exactly one job.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.pr_gate_validation.outputs.shards || '[0, 1, 2, 3, 4, 5, 6, 7]') }}
    runs-on: ${{ needs.route.outputs.runner || (vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo') }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          clean: false
          fetch-depth: 0
      - uses: ./.github/actions/ci-runner-preflight
        with:
          browser: "true"
      - name: Turbo cache
        uses: ./.github/actions/turbo-cache
        with:
          turbo-token: ${{ github.event.pull_request.head.repo.fork && '' || secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          remote-mode: ${{ github.event.pull_request.head.repo.fork && 'remote:ro' || 'remote:rw' }}
          preferred-job: pr_gate_validation
      - name: Check the sibling pins (gitlink against checkout, offline)
        run: node --experimental-strip-types scripts/bootstrap-siblings.mts --status --offline
      - uses: ./.github/actions/pnpm-store
      - name: Link deps layer
        run: node --experimental-strip-types scripts/ci/deps-layer.mts link
      - name: Check deps layer match
        id: deps-layer
        run: node --experimental-strip-types scripts/ci/deps-layer.mts check
      - name: Verify deps layer sibling links
        if: steps.deps-layer.outputs.match == 'true'
        run: node --import tsx scripts/ensure-ts-autocode-links.mts
      - name: Install dependencies
        if: steps.deps-layer.outputs.match != 'true'
        run: node --experimental-strip-types --no-warnings scripts/ci/pnpm-install.mts --frozen-lockfile --config.confirmModulesPurge=false
      - name: Workspace tests
        timeout-minutes: 19
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ needs.pr_gate_validation.outputs.pr_base }}
          MERGE_TESTS: ${{ needs.pr_gate_validation.outputs.merge_tests }}
          MERGE_BASE: ${{ needs.pr_gate_validation.outputs.merge_base }}
          SHARD: ${{ strategy.job-index }}
          SHARD_TOTAL: ${{ strategy.job-total }}
          HOBO_TURBO_CONCURRENCY: "1"
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) TESTS=affected; BASE="$PR_BASE" ;;
            merge_group) TESTS="$MERGE_TESTS"; BASE="$MERGE_BASE" ;;
            *) echo "Unexpected event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          case "$TESTS" in
            affected)
              # Changed packages run whole; their dependents run only the tests
              # whose import closure reaches a change. A missing base is an error.
              if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}"; then
                echo "Merge-group base is missing or unreachable" >&2
                exit 1
              fi
              git diff --name-only "$BASE" HEAD |
                node --experimental-strip-types --no-warnings scripts/ci/dependent-tests.mts \
                  --base="$BASE" --shard="$SHARD/$SHARD_TOTAL" --run --anon-profile=turbo-profile.json
              ;;
            all)
              printf '' | node --experimental-strip-types --no-warnings scripts/ci/dependent-tests.mts \
                --shard="$SHARD/$SHARD_TOTAL" --run --anon-profile=turbo-profile.json
              ;;
            *) echo "Invalid or missing merge-group test scope: $TESTS" >&2; exit 1 ;;
          esac
      - name: Prune Turbo cache
        id: turbo-prune
        if: always() && env.TURBO_TOKEN == ''
        continue-on-error: true
        run: node --experimental-strip-types --no-warnings scripts/ci/turbo-cache-prune.mts
      - name: Save Turbo cache
        if: always() && steps.turbo-prune.outputs.save != 'false'
        uses: ./.github/actions/turbo-cache
        with:
          mode: save
      - name: CI trace
        if: always()
        uses: ./.github/actions/ci-trace
        with:
          disambiguator: ${{ matrix.shard }}

  pr_affected:
    name: PR affected package lanes
    needs: [route, pr_gate_validation]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.pr_gate_validation.result == 'success' && !(needs.route.outputs.attested == 'true' && contains(needs.route.outputs.attested-jobs, '"pr_affected"')) }}
    runs-on: ${{ needs.route.outputs.runner || (vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo') }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          clean: false
          fetch-depth: 0
      - uses: ./.github/actions/ci-runner-preflight
        with:
          browser: "true"
      - name: Turbo cache
        uses: ./.github/actions/turbo-cache
        with:
          turbo-token: ${{ github.event.pull_request.head.repo.fork && '' || secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          remote-mode: ${{ github.event.pull_request.head.repo.fork && 'remote:ro' || 'remote:rw' }}
          preferred-job: pr_gate_validation
      - name: Check the sibling pins (gitlink against checkout, offline)
        run: node --experimental-strip-types scripts/bootstrap-siblings.mts --status --offline
      - uses: ./.github/actions/pnpm-store
      - name: Link deps layer
        run: node --experimental-strip-types scripts/ci/deps-layer.mts link
      - name: Check deps layer match
        id: deps-layer
        run: node --experimental-strip-types scripts/ci/deps-layer.mts check
      - name: Verify deps layer sibling links
        if: steps.deps-layer.outputs.match == 'true'
        run: node --import tsx scripts/ensure-ts-autocode-links.mts
      - name: Install dependencies
        if: steps.deps-layer.outputs.match != 'true'
        run: node --experimental-strip-types --no-warnings scripts/ci/pnpm-install.mts --frozen-lockfile --config.confirmModulesPurge=false
      - name: Dagger checks plan (native CI parity)
        run: |
          pnpm exec turbo run build --filter=@hobo/ci-dagger --output-logs=new-only --concurrency=1
          pnpm --filter @hobo/ci-dagger checks --plan --config .hobo/dagger.json
      - name: Affected package lanes
        env:
          TURBO_SCM_BASE: ${{ needs.pr_gate_validation.outputs.pr_base }}
        run: |
          set -euo pipefail
          if [ -z "$TURBO_SCM_BASE" ] || ! git cat-file -e "${TURBO_SCM_BASE}^{commit}"; then
            echo "PR base is missing or unreachable" >&2; exit 1
          fi
          git diff --name-only "${TURBO_SCM_BASE}"...HEAD \
            | node --experimental-strip-types --no-warnings scripts/ci/affected-lanes.mts --base="${TURBO_SCM_BASE}" \
              > "$RUNNER_TEMP/hobo-affected-lanes"
          mapfile -t FILTERS < "$RUNNER_TEMP/hobo-affected-lanes"
          if [ "${#FILTERS[@]}" -eq 0 ]; then
            echo "Only inert paths changed; skipping turbo impact lanes"
            exit 0
          fi
          pnpm exec turbo run build typecheck lint test:unit test:schema test:contract:consumer \
            "${FILTERS[@]}" \
            --continue=never --concurrency=${HOBO_TURBO_CONCURRENCY:-100%} \
            --anon-profile=turbo-profile.json
      - name: Prune Turbo cache
        id: turbo-prune
        if: always() && env.TURBO_TOKEN == ''
        continue-on-error: true
        run: node --experimental-strip-types --no-warnings scripts/ci/turbo-cache-prune.mts
      - name: Save Turbo cache
        if: always() && steps.turbo-prune.outputs.save != 'false'
        uses: ./.github/actions/turbo-cache
        with:
          mode: save
      - name: CI trace
        if: always()
        uses: ./.github/actions/ci-trace

  pr-gate:
    name: PR impact gate
    # This is the required check. It runs even if a prerequisite was skipped,
    # failed, or cancelled, and accepts only the event's complete validation:
    # each job succeeded, or the route job succeeded, reported a verified signed
    # local run covering that job, and the job was skipped for it.
    needs: [route, pr_gate_validation, workspace_tests, pr_affected]
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    # GitHub-hosted: it runs no repository code, and on the fleet a superseded
    # run's gate held the next run until a runner was free.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require successful validation and workspace tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          VALIDATION_RESULT: ${{ needs.pr_gate_validation.result }}
          WORKSPACE_RESULT: ${{ needs.workspace_tests.result }}
          AFFECTED_RESULT: ${{ needs.pr_affected.result }}
          ROUTE_RESULT: ${{ needs.route.result }}
          ATTESTED: ${{ needs.route.outputs.attested }}
          ATTESTED_JOBS: ${{ needs.route.outputs.attested-jobs }}
        run: |
          set -euo pipefail
          # A skipped job counts only when the route job itself succeeded and
          # reported a verified signed local run that covers that job by id.
          attested() {
            [ "${ROUTE_RESULT:-}" = "success" ] || return 1
            [ "${ATTESTED:-}" = "true" ] || return 1
            case "${ATTESTED_JOBS:-}" in
              *"\"$1\""*) return 0 ;;
            esac
            return 1
          }
          passed() {
            [ "$1" = "success" ] && return 0
            [ "$1" = "skipped" ] && attested "$2"
          }
          if ! passed "$VALIDATION_RESULT" pr_gate_validation; then
            echo "PR impact validation did not succeed: $VALIDATION_RESULT" >&2
            exit 1
          fi
          if ! passed "$WORKSPACE_RESULT" workspace_tests; then
            echo "Workspace test shards did not all succeed: $WORKSPACE_RESULT" >&2
            exit 1
          fi
          case "$EVENT_NAME:$AFFECTED_RESULT" in
            pull_request:success|merge_group:skipped) ;;
            pull_request:skipped)
              if ! attested pr_affected; then
                echo "Affected lanes were skipped without a verified local run" >&2
                exit 1
              fi
              ;;
            *) echo "Unexpected affected-lanes result for $EVENT_NAME: $AFFECTED_RESULT" >&2; exit 1 ;;
          esac

  pr-offpath:
    # Off the critical path: these used to run inside the PR impact gate.
    name: PR off-path checks (ts-autocode surface, production packages)
    needs: route
    if: ${{ github.event_name == 'pull_request' && !(needs.route.outputs.attested == 'true' && contains(needs.route.outputs.attested-jobs, '"pr-offpath"')) }}
    runs-on: ${{ needs.route.outputs.runner || (vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo') }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          clean: false
          # Depth 2 holds the PR merge commit and its first parent (the base tip).
          fetch-depth: 2
      - uses: ./.github/actions/ci-runner-preflight
      - name: Decide whether the diff reaches packages, pins or submodules
        id: scope
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            echo "HEAD is not a PR merge commit; running every check"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Read root config at HEAD^1 too, so root-only edits stay off-path.
          CHANGED="$(git diff --name-only HEAD^1 HEAD)"
          LANES="$(printf '%s\n' "$CHANGED" | node --experimental-strip-types --no-warnings scripts/ci/affected-lanes.mts --base=HEAD^1)"
          # ts-autocode surface and package-boundary inputs that live outside packages/.
          PINS="$(printf '%s\n' "$CHANGED" | grep -E '^(external/|tools/pins/|\.gitmodules$|scripts/test/ts-autocode-|scripts/bootstrap-siblings\.mts$|scripts/check-package-boundaries)' || true)"
          if [ -z "$LANES" ] && [ -z "$PINS" ]; then
            echo "Only inert paths changed; skipping install, ts-autocode surface and production packages gate"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Turbo cache
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/turbo-cache
        with:
          turbo-token: ${{ github.event.pull_request.head.repo.fork && '' || secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          remote-mode: ${{ github.event.pull_request.head.repo.fork && 'remote:ro' || 'remote:rw' }}
      - uses: ./.github/actions/pnpm-store
        if: steps.scope.outputs.run == 'true'
      - if: steps.scope.outputs.run == 'true'
        run: node --experimental-strip-types --no-warnings scripts/ci/pnpm-install.mts --frozen-lockfile --config.confirmModulesPurge=false
      - name: Every name HoBo imports from ts-autocode exists at the pin, and its grounding fields are still checked
        if: steps.scope.outputs.run == 'true'
        run: node --import tsx --test scripts/test/ts-autocode-consumer-surface.test.ts scripts/test/ts-autocode-grounding-drift.test.ts
      - name: Production packages gate
        if: steps.scope.outputs.run == 'true'
        run: pnpm run build:packages
      - name: Prune Turbo cache
        id: turbo-prune
        if: always() && steps.scope.outputs.run == 'true' && env.TURBO_TOKEN == ''
        continue-on-error: true
        run: node --experimental-strip-types --no-warnings scripts/ci/turbo-cache-prune.mts
      - name: Save Turbo cache
        if: always() && steps.scope.outputs.run == 'true' && steps.turbo-prune.outputs.save != 'false'
        uses: ./.github/actions/turbo-cache
        with:
          mode: save
      - name: CI trace
        if: always()
        uses: ./.github/actions/ci-trace

  main-gate-plan:
    name: Main workspace plan
    needs: [route, ci-runner-image, ci-deps-image]
    if: >-
      !cancelled() && (
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ${{ needs.route.outputs.runner || (vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo') }}
    timeout-minutes: 12
    permissions:
      contents: read
    outputs:
      main_base: ${{ steps.plan.outputs.main_base }}
      main_tests: ${{ steps.plan.outputs.main_tests }}
      main_scope: ${{ steps.plan.outputs.main_scope }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Bootstrap repo-local composite actions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          clean: false
          fetch-depth: 1
          filter: blob:none
          fetch-tags: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          clean: false
          fetch-depth: 0
      - uses: ./.github/actions/ci-runner-preflight
      - name: Plan workspace shards
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_SHARD_TARGET_SECONDS: "180"
        run: node --experimental-strip-types --no-warnings scripts/ci/plan-main-workspace-shards.mts

  main-gate:
    name: Main full gate
    # Not a required check and not run on merge_group: merge_group now runs the same
    # affected gate across the validation and workspace jobs instead.
    # Those jobs mirror this job's main-base, S0 gate set and Workspace tests steps.
    # A push that changes the image inputs tests on the image it built; an unchanged push skips
    # the image job, which satisfies this dependency immediately.
    needs: [route, ci-runner-image]
    if: >-
      !cancelled() && (
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ${{ needs.route.outputs.runner || (vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo') }}
    # A main run past 20 minutes is a failure; the step timeouts below fail a hang sooner.
    # The daily schedule is the one whole-workspace sweep and gets an hour.
    timeout-minutes: ${{ github.event_name == 'schedule' && 60 || 20 }}
    permissions:
      contents: read
    outputs:
      main_base: ${{ steps.main-base.outputs.base }}
      main_tests: ${{ steps.main-base.outputs.tests }}
      main_scope: ${{ steps.main-base.outputs.scope }}
    # At most one Main full gate holds a box slot, whatever event started it, so the other slot
    # stays free for the short required jobs. A newer waiting gate replaces an older waiting one.
    concurrency:
      group: ${{ github.workflow }}-main-gate
      cancel-in-progress: false
    env:
      GITHUB_EVENT_MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
      S0_SPARSE_PATHS: |
        .agents
        .changeset
        .claude
        .codex
        .cursor
        .devcontainer
        .githooks
        .github
        .hobo
        .impeccable
        .mise
        .optimizexp
        .repo
        ast-grep
        contrib
        deploy
        docs
        examples
        external
        features
        packages
        plans
        release
        scripts
        site
        src
        test
        tools
        workflows
        mise.toml
        mise.lock
        package.json
        pnpm-lock.yaml
        pnpm-workspace.yaml
        turbo.json
        tsconfig.base.json
        .env.example
        .gitattributes
        .gitignore
        .gitleaks.toml
        .gitmodules
        .mcp.json
        AGENTS.md
        AUTH.md
        CLAUDE.md
        CODE_OF_CONDUCT.md
        CONTRIBUTING.md
        DX.md
        GAPS.md
        LICENSE
        NOTES.md
        PRODUCT.md
        README.md
        SECURITY.md
        SUPPORT.md
        biome.json
        buf.gen.yaml
        cucumber.yaml
        konsistent.json
        oxlint.config.ts
        sgconfig.yml
        skills-lock.json
        stryker.scripts.conf.json
        tsconfig.json
        vitest.config.ts
        vitest.coverage.config.ts
        vitest.mutation.config.ts
        media/package.json
    steps:
      - name: Bootstrap repo-local composite actions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: false
          fetch-depth: 1
          filter: blob:none
          fetch-tags: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: true
      - name: Checkout (sparse S0, full history)
        uses: ./.github/actions/hobo-checkout
        with:
          fetch-depth: 0
          sparse-paths: ${{ env.S0_SPARSE_PATHS }}
          submodules: "false"
      - uses: ./.github/actions/ci-runner-preflight
        with:
          browser: "true"
      - name: Fetch pinned ts-autocode
        run: |
          set -euo pipefail
          # Sparse S0 keeps the gitlink only. pins:fetch materializes the pin's
          # grounding/training/rewrite cone so deps-key and pnpm prepare can see
          # the workspace importers. Skip when the cone is already present.
          if [ -f external/ts-autocode/packages/grounding/package.json ] \
            && [ -f external/ts-autocode/packages/training/package.json ] \
            && [ -f external/ts-autocode/packages/rewrite/package.json ]; then
            echo "ts-autocode pin cone already present"
            exit 0
          fi
          pnpm run pins:fetch ts-autocode
      - name: Turbo cache
        uses: ./.github/actions/turbo-cache
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          remote-mode: remote:rw
      - name: Link deps layer
        run: node --experimental-strip-types scripts/ci/deps-layer.mts link
      - name: Check deps layer match
        id: deps-layer
        run: node --experimental-strip-types scripts/ci/deps-layer.mts check
      - name: Verify deps layer sibling links
        if: steps.deps-layer.outputs.match == 'true'
        run: node --import tsx scripts/ensure-ts-autocode-links.mts
      - name: Install dependencies
        if: steps.deps-layer.outputs.match != 'true' || github.event_name == 'schedule'
        run: node --experimental-strip-types --no-warnings scripts/ci/pnpm-install.mts --frozen-lockfile --config.confirmModulesPurge=false
      - name: CI runner image contract (manifest)
        run: node --import tsx --test scripts/test/ci-runner-image-contract.test.ts
      - name: Assert CI fabric contract
        run: node --import tsx packages/ci-guard/bin/assert-ci-contract.ts
      - name: Seed the pnpm store cache for PRs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/pnpm-store
        with:
          mode: save
      - name: Resolve the previous main commit and the gate scope
        id: main-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Last green main (Fabric push), else the push parent, else HEAD~1. Schedule and
          # workflow_dispatch with no base run repo-wide. Scripts/ci/affected-lanes.mts compares
          # root config at that base. A workflow edit cannot change a package's test result.
          base=""
          if [ "$EVENT_NAME" = "push" ]; then
            base="$(node --experimental-strip-types --no-warnings scripts/ci/resolve-main-test-base.mts | tr -d '\n')"
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then base="$(git rev-parse HEAD~1)"; fi
          if [ -n "$base" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then base=""; fi
          scope="repo-wide"
          tests="all"
          if [ -n "$base" ]; then
            changed="$(git diff --name-only "$base" HEAD)"
            scope="$(node --experimental-strip-types --no-warnings scripts/ci/affected-lanes.mts --main-gate --base="$base" <<<"$changed")"
            lanes="$(node --experimental-strip-types --no-warnings scripts/ci/affected-lanes.mts --base="$base" <<<"$changed")"
            if [ "$lanes" != "--filter=*" ]; then tests="affected"; fi
          fi
          echo "main gate: ${scope}, workspace tests: ${tests} (base ${base:-none})"
          {
            echo "base=${base}"
            echo "scope=${scope}"
            echo "tests=${tests}"
          } >> "$GITHUB_OUTPUT"
      - name: S0 gate set
        timeout-minutes: 20
        env:
          # One vitest fork at a time: four forks (default) with 3 GiB heaps plus
          # componentize-js wizer exceed the 6 GiB job container and get OOM-killed.
          HOBO_RELEVANT_CHECK_CONCURRENCY: "1"
          SCOPE: ${{ steps.main-base.outputs.scope }}
          BASE: ${{ steps.main-base.outputs.base }}
        run: |
          set -euo pipefail
          node --experimental-strip-types --no-warnings scripts/ci/prune-stray-workspace-packages.mts
          if [ "$SCOPE" = "affected" ]; then
            pnpm agent:check -- --base="$BASE" --external-workspace-tests
          else
            pnpm run check:all
          fi
      - name: Generated-output drift
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 8
        run: >-
          pnpm run codegen:check:affected &&
          pnpm exec turbo run test --filter=@hobo-draft/s0-04-protobuf-cue-codegen --concurrency=100%
      - name: Prune Turbo cache
        id: turbo-prune
        if: always() && env.TURBO_TOKEN == ''
        continue-on-error: true
        run: node --experimental-strip-types --no-warnings scripts/ci/turbo-cache-prune.mts
      - name: Save Turbo cache
        if: always() && steps.turbo-prune.outputs.save != 'false'
        uses: ./.github/actions/turbo-cache
        with:
          mode: save
      - name: CI trace
        if: always()
        uses: ./.github/actions/ci-trace

  main_workspace_tests:
    name: Main workspace test shard ${{ matrix.shard }}
    needs: [route, ci-runner-image, ci-deps-image, main-gate-plan]
    if: >-
      !cancelled() && needs.main-gate-plan.result == 'success' && (
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.main-gate-plan.outputs.shards || '[0]') }}
    runs-on: ${{ needs.route.outputs.runner || (vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo') }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Bootstrap repo-local composite actions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          clean: false
          fetch-depth: 1
          filter: blob:none
          fetch-tags: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          clean: false
          fetch-depth: 0
      - name: Link deps layer
        run: node --experimental-strip-types scripts/ci/deps-layer.mts link
      - name: Check deps layer match
        id: deps-layer
        run: node --experimental-strip-types scripts/ci/deps-layer.mts check
      - uses: ./.github/actions/ci-runner-preflight
      - name: Turbo cache
        uses: ./.github/actions/turbo-cache
        with:
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          remote-mode: remote:rw
          preferred-job: main-gate-plan
      - name: Check the sibling pins (gitlink against checkout, offline)
        if: steps.deps-layer.outputs.match != 'true'
        run: node --experimental-strip-types scripts/bootstrap-siblings.mts --status --offline
      - name: Restore pnpm store
        if: steps.deps-layer.outputs.match != 'true'
        uses: ./.github/actions/pnpm-store
      - name: Verify deps layer sibling links
        if: steps.deps-layer.outputs.match == 'true'
        run: node --import tsx scripts/ensure-ts-autocode-links.mts
      - name: Install dependencies
        if: steps.deps-layer.outputs.match != 'true' || github.event_name == 'schedule'
        run: node --experimental-strip-types --no-warnings scripts/ci/pnpm-install.mts --frozen-lockfile --config.confirmModulesPurge=false
      - name: Workspace tests
        timeout-minutes: 19
        env:
          TESTS: ${{ needs.main-gate-plan.outputs.main_tests }}
          BASE: ${{ needs.main-gate-plan.outputs.main_base }}
          SHARD: ${{ strategy.job-index }}
          SHARD_TOTAL: ${{ strategy.job-total }}
          TURBO_SCM_BASE: ${{ needs.main-gate-plan.outputs.main_base }}
          HOBO_TURBO_USE_AFFECTED: ${{ needs.main-gate-plan.outputs.main_tests == 'affected' && '1' || '' }}
        run: |
          set -euo pipefail
          case "$TESTS" in
            affected)
              if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}"; then
                echo "Main test base is missing or unreachable" >&2
                exit 1
              fi
              git diff --name-only "$BASE" HEAD |
                node --experimental-strip-types --no-warnings scripts/ci/dependent-tests.mts \
                  --base="$BASE" --shard="$SHARD/$SHARD_TOTAL" --run --anon-profile=turbo-profile.json
              ;;
            all)
              printf '' | node --experimental-strip-types --no-warnings scripts/ci/dependent-tests.mts \
                --shard="$SHARD/$SHARD_TOTAL" --run --anon-profile=turbo-profile.json
              ;;
            *) echo "Invalid main workspace test scope: $TESTS" >&2; exit 1 ;;
          esac
      - name: Prune Turbo cache
        id: turbo-prune
        if: always() && env.TURBO_TOKEN == ''
        continue-on-error: true
        run: node --experimental-strip-types --no-warnings scripts/ci/turbo-cache-prune.mts
      - name: Save Turbo cache
        if: always() && steps.turbo-prune.outputs.save != 'false'
        uses: ./.github/actions/turbo-cache
        with:
          mode: save
      - name: CI trace
        if: always()
        uses: ./.github/actions/ci-trace
        with:
          disambiguator: ${{ matrix.shard }}

  main_gate_finish:
    name: Main full gate (finish)
    needs: [route, main-gate, main_workspace_tests]
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ needs.route.outputs.runner || (vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo') }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Bootstrap repo-local composite actions
        if: always()
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          clean: false
          fetch-depth: 1
          filter: blob:none
          fetch-tags: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: true
      - name: Require main gate and workspace shards
        env:
          MAIN_RESULT: ${{ needs.main-gate.result }}
          WORKSPACE_RESULT: ${{ needs.main_workspace_tests.result }}
        run: |
          set -euo pipefail
          if [ "$MAIN_RESULT" != "success" ]; then
            echo "Main full gate did not succeed: $MAIN_RESULT" >&2
            exit 1
          fi
          if [ "$WORKSPACE_RESULT" != "success" ]; then
            echo "Main workspace test shards did not all succeed: $WORKSPACE_RESULT" >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: false
          fetch-depth: 0
          filter: blob:none
          fetch-tags: false
      - uses: ./.github/actions/ci-runner-preflight
      - name: Secret scan (full history)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          SCAN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          node --experimental-strip-types --no-warnings \
            scripts/ci/gitleaks-main-scan.mts --background --dir "$dir"
          node --experimental-strip-types --no-warnings \
            scripts/ci/gitleaks-main-scan.mts --wait --dir "$dir"
      - name: CI trace
        if: always()
        uses: ./.github/actions/ci-trace
        with:
          disambiguator: finish

  artifact-trust:
    name: artifact signing and install verification
    needs: route
    if: ${{ github.event_name == 'pull_request' && !(needs.route.outputs.attested == 'true' && contains(needs.route.outputs.attested-jobs, '"artifact-trust"')) }}
    runs-on: ${{ needs.route.outputs.runner || (vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          clean: false
          # Depth 2 holds the PR merge commit and its first parent (the base tip).
          fetch-depth: 2
      - uses: ./.github/actions/ci-runner-preflight
      - name: Decide whether the diff reaches the artifact trust proof
        id: scope
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            echo "HEAD is not a PR merge commit; running the check"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD \
            | node --experimental-strip-types --no-warnings scripts/ci/job-scope.mts \
              vitest.config.ts \
              src/draft/technical-proofs/componentize-artifact-trust-contract/test/publish-verify.test.ts \
              >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        run: node --experimental-strip-types --no-warnings scripts/ci/pnpm-install.mts --frozen-lockfile --config.confirmModulesPurge=false
      - name: Verify signed hello-bindle and refuse stripped signatures
        if: steps.scope.outputs.run == 'true'
        run: pnpm test:file src/draft/technical-proofs/componentize-artifact-trust-contract/test/publish-verify.test.ts

  dev-cold-loop-gate:
    name: hobo dev cold loop (offline <=60s)
    needs: route
    if: github.event_name == 'pull_request'
    runs-on: ${{ needs.route.outputs.runner || (vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          clean: false
          fetch-depth: 2
      - uses: ./.github/actions/ci-runner-preflight
      - name: Decide whether the diff reaches the cold dev loop
        id: scope
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            echo "HEAD is not a PR merge commit; running the check"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD \
            | node --experimental-strip-types --no-warnings scripts/ci/job-scope.mts \
              scripts/ci/dev-cold-loop-timing.mts \
              >> "$GITHUB_OUTPUT"
      # Only what scripts/ci/dev-cold-loop-timing.mts imports: every byte installed here
      # is copied out of the store and then streamed into the offline container, and
      # the full workspace (4.3 GB) made this job disk-bound on a loaded box. The root
      # `prepare` only checks packages/runtime's ts-autocode links, which are not installed.
      - if: steps.scope.outputs.run == 'true'
        run: >-
          node --experimental-strip-types --no-warnings scripts/ci/pnpm-install.mts --frozen-lockfile --ignore-scripts --config.confirmModulesPurge=false
          --filter .
          --filter "./packages/cli..."
          --filter "./src/draft/technical-proofs/hobo-612-dev-local-loop-poc..."
          --filter "./src/draft/technical-proofs/hobo-new-scaffold-contract..."
          --filter "ts-autocode-*..."
      - name: Cold hobo dev gate (network disabled)
        if: steps.scope.outputs.run == 'true'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          image="hobo-ci-worker:local"
          # The worker image exists only in a fleet box's Docker context. A GitHub-hosted
          # machine never has it, and neither does an overflow runner that reports itself
          # self-hosted, so the image is probed instead of inferred from the runner kind.
          if [ "${RUNNER_ENVIRONMENT}" = "github-hosted" ] || ! docker image inspect "$image" >/dev/null 2>&1; then
            # No worker image here, and the toolchain is already on PATH: the same
            # commands on a copy of the tree, in a network namespace whose only
            # interface is loopback.
            echo "${image} is not on this runner (${RUNNER_ENVIRONMENT:-unknown}); using an unshare --net namespace"
            work="$(mktemp -d)"
            tar -c --exclude=./.git . | tar -x -C "$work"
            sudo --preserve-env unshare --net -- bash -c \
              'ip link set lo up && cd "$1" && exec sudo --preserve-env -u "#$2" env "PATH=$3" bash -c "$4"' \
              cold "$work" "$(id -u)" "$PATH" \
              'set -euo pipefail; pnpm --filter "ts-autocode-*" run build; node --import tsx scripts/ci/dev-cold-loop-timing.mts'
            exit 0
          fi
          tar -c --exclude=./.git . | docker run -i --rm --network=none \
            "$image" \
            bash -c 'set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          tar -x
          pnpm --filter "ts-autocode-*" run build
          node --import tsx scripts/ci/dev-cold-loop-timing.mts'

  data-live:
    # The data engines against real servers: the conformance kit, change
    # capture, the write fence under load and the native logical-copy path only
    # mean something on a real PostgreSQL and a real MongoDB replica set. On a
    # pull request it runs when the diff can reach those suites; a manual run
    # always does. Never on a schedule: the job depends on a runner that can
    # start containers, which is not always the case. Not on merge_group: the merge queue's required set
    # does not include it, and it would hold a box slot there for nothing.
    # The name is also a key in the worker's memory classes (`heavy`).
    name: Live data engines (PostgreSQL 16, MongoDB 8)
    needs: route
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ needs.route.outputs.runner || (vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo') }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          clean: false
          # Depth 2 holds the PR merge commit and its first parent (the base tip).
          fetch-depth: 2
      - uses: ./.github/actions/ci-runner-preflight
      - name: Decide whether the diff reaches the live data-engine suites
        id: scope
        run: |
          set -euo pipefail
          # Only a pull request is scoped by its diff. A manual run whose tip
          # happens to be a merge commit must not take that path.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            echo "not a pull request's merge commit; running the lane"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD \
            | node --experimental-strip-types --no-warnings scripts/ci/job-scope.mts \
              scripts/ci/data-live-servers.mts \
              scripts/ensure-built.mts \
              vitest.config.ts \
              packages/data-core/test/conformance.test.ts \
              packages/data-sqlite/test/conformance.test.ts \
              packages/data-postgres/test/engine-live.test.ts \
              packages/data-postgres/test/engine-hardening-live.test.ts \
              packages/data-postgres/test/native-live.test.ts \
              packages/data-postgres/test/cross-engine-live.test.ts \
              packages/data-mongodb/test/live.test.ts \
              packages/data-mongodb/test/cross-engine-live.test.ts \
              packages/trails/test/data-patterns-e2e.test.ts \
              >> "$GITHUB_OUTPUT"
      - name: Turbo cache
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/turbo-cache
        with:
          turbo-token: ${{ github.event.pull_request.head.repo.fork && '' || secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          remote-mode: ${{ github.event.pull_request.head.repo.fork && 'remote:ro' || 'remote:rw' }}
      - uses: ./.github/actions/pnpm-store
        if: steps.scope.outputs.run == 'true'
      - if: steps.scope.outputs.run == 'true'
        run: node --experimental-strip-types --no-warnings scripts/ci/pnpm-install.mts --frozen-lockfile --config.confirmModulesPurge=false
      - name: Build the data packages and what they import
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 4
        run: >-
          pnpm exec turbo run build
          --filter=@hobo/data-core...
          --filter=@hobo/data-sqlite...
          --filter=@hobo/data-postgres...
          --filter=@hobo/data-mongodb...
          --filter=@hobo/trails...
          --output-logs=new-only --concurrency=${HOBO_TURBO_CONCURRENCY:-100%}
      # Sibling containers on the host engine, reached at their bridge address
      # (scripts/ci/data-live-servers.mts). The script prints the two URLs the
      # suites read.
      - name: Start PostgreSQL and MongoDB
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 5
        run: node --experimental-strip-types --no-warnings scripts/ci/data-live-servers.mts up >> "$GITHUB_ENV"
      # Not through turbo: it passes HOBO_* through without keying its cache on
      # them, so a cached run without servers would replay as a live pass.
      # The live tests skip themselves when their variable is missing, so a
      # green exit is not enough: `verify` reads the output and fails unless
      # every package ran and no test was skipped.
      - name: Live data-engine suites
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          [ -n "${HOBO_TEST_POSTGRES_URL:-}" ] || { echo "::error::the start step set no PostgreSQL URL"; exit 1; }
          [ -n "${HOBO_TEST_MONGODB_URL:-}" ] || { echo "::error::the start step set no MongoDB URL"; exit 1; }
          # Their vitest configs (the root one, and packages/trails's) apply the
          # job's HOBO_TEST_MAX_WORKERS cap. Nothing exports VITEST_MAX_WORKERS
          # here, since vitest lets it override every config, single-worker pins
          # included.
          pnpm run test:data-live 2>&1 | tee "${RUNNER_TEMP}/data-live.log"
          node --experimental-strip-types --no-warnings scripts/ci/data-live-servers.mts verify "${RUNNER_TEMP}/data-live.log"
      - name: Server logs
        if: failure() && steps.scope.outputs.run == 'true'
        run: node --experimental-strip-types --no-warnings scripts/ci/data-live-servers.mts logs
      - name: Stop PostgreSQL and MongoDB
        if: always() && steps.scope.outputs.run == 'true'
        run: node --experimental-strip-types --no-warnings scripts/ci/data-live-servers.mts down
      - name: Prune Turbo cache
        id: turbo-prune
        if: always() && steps.scope.outputs.run == 'true' && env.TURBO_TOKEN == ''
        continue-on-error: true
        run: node --experimental-strip-types --no-warnings scripts/ci/turbo-cache-prune.mts
      - name: Save Turbo cache
        if: always() && steps.scope.outputs.run == 'true' && steps.turbo-prune.outputs.save != 'false'
        uses: ./.github/actions/turbo-cache
        with:
          mode: save
      - name: CI trace
        if: always()
        uses: ./.github/actions/ci-trace

  ci-guard:
    name: CI fabric contract guard
    needs: route
    # On other events, these steps run inside Main full gate or PR impact gate.
    if: ${{ github.event_name == 'pull_request' && !(needs.route.outputs.attested == 'true' && contains(needs.route.outputs.attested-jobs, '"ci-guard"')) }}
    runs-on: ${{ needs.route.outputs.runner || (vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          clean: false
      - uses: ./.github/actions/ci-runner-preflight
      - run: node --experimental-strip-types --no-warnings scripts/ci/pnpm-install.mts --frozen-lockfile --config.confirmModulesPurge=false
      - name: CI runner image contract (manifest)
        run: node --import tsx --test scripts/test/ci-runner-image-contract.test.ts
      - name: Assert CI fabric contract
        run: node --import tsx packages/ci-guard/bin/assert-ci-contract.ts

  secret-scan:
    name: Secret scan
    needs: route
    # Skipped (which satisfies the required check) on merge_group and trunk events; trunk runs
    # scan the full history inside Main full gate in parallel with its checks.
    if: ${{ github.event_name == 'pull_request' && !(needs.route.outputs.attested == 'true' && contains(needs.route.outputs.attested-jobs, '"secret-scan"')) }}
    runs-on: ${{ needs.route.outputs.runner || (vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # No submodules: gitleaks scans this repository's history, not ts-autocode's.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: false
          fetch-depth: 0
      - uses: ./.github/actions/ci-runner-preflight
      - name: Scan git history for secrets
        run: |
          set -euo pipefail
          gitleaks git --config .gitleaks.toml --redact --exit-code 1 \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
