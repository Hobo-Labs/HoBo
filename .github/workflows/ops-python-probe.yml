name: Ops python toolcache probe
# Temporary ops probe (not for merge): setup-python 3.12 on hobo-trunk runners
# (ARC + Agent37) must resolve from the pre-populated toolcache.
on:
  push:
    branches: [ops/a37-python-probe]
permissions:
  contents: read
jobs:
  py:
    name: setup-python 3.12 on hobo-trunk (${{ matrix.n }})
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: hobo-trunk
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: |
          python3 -c 'import ssl, sqlite3, sys; print(sys.version, ssl.OPENSSL_VERSION)'
          echo "runner=$RUNNER_NAME toolcache=$RUNNER_TOOL_CACHE pythonLocation=$pythonLocation"
          . /etc/os-release; echo "$PRETTY_NAME"
