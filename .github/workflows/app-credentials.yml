name: HoBo App credentials

on:
  workflow_dispatch:
    inputs:
      relay:
        description: The relay's public origin the App was created for
        required: true
        type: string
      owner_id:
        description: The numeric GitHub id of the App's owner
        required: true
        type: string

permissions:
  contents: read

jobs:
  app-credentials:
    name: Deposit the GitHub App's credentials
    if: github.repository == 'Hobo-Labs/HoBo' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      id-token: write
    timeout-minutes: 20
    uses: ./.github/workflows/relay-deploy.yml
    with:
      relay: ${{ inputs.relay }}
      owner_id: ${{ inputs.owner_id }}
    secrets:
      manifest_code: ${{ secrets.HOBO_APP_MANIFEST_CODE }}
