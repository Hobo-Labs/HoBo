name: HoBo App credentials

on:
  workflow_dispatch:
    inputs:
      manifest_code:
        description: GitHub's one-time App-manifest code (hobo ci app create --via-workflow)
        required: true
        type: string
      relay:
        description: The relay's public origin the App was created for
        required: true
        type: string
      owner_id:
        description: The numeric GitHub id of the App's owner
        required: true
        type: string

permissions:
  contents: read

jobs:
  app-credentials:
    name: Deposit the GitHub App's credentials
    if: github.repository == 'Hobo-Labs/HoBo' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.manifest_code != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/relay-deploy.yml
    with:
      manifest_code: ${{ inputs.manifest_code }}
      relay: ${{ inputs.relay }}
      owner_id: ${{ inputs.owner_id }}
