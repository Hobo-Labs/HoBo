name: Merge queue reaper

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Print the orphaned runs; cancel nothing
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

concurrency:
  group: merge-queue-reaper
  cancel-in-progress: false

jobs:
  reaper:
    name: Cancel orphaned merge-queue runs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ci/merge-queue-reaper.mts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Cancel merge-group runs whose queue branch is gone
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_QUEUE_REAPER_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false' }}
        run: node scripts/ci/merge-queue-reaper.mts
