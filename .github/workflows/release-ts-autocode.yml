name: ts-autocode release (HoBo pins cone)

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/pins/siblings.json"
      - "scripts/bootstrap-siblings.mts"
      - "scripts/test/ts-autocode-consumer-surface.test.ts"
      - "scripts/lib/ci-runner-contract.mts"
      - "scripts/ci-runner-preflight.mts"
      - ".github/actions/ci-runner-preflight/**"
      - ".github/workflows/release-ts-autocode.yml"
  push:
    tags:
      - "ts-autocode-v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ts-autocode-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route:
    name: Route runners
    # GitHub-hosted on purpose: the choice of runner must not wait on the fleet
    # it is choosing against. The fleet while it takes jobs, an enrolled local
    # box when it does not, GitHub-hosted when neither does (scripts/ci/route-runner.mts).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      runner: ${{ steps.route.outputs.runner }}
      tier: ${{ steps.route.outputs.tier }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/route-runner
            scripts/ci/route-runner.mts
            packages/ci/src/fleet-overflow.ts
      - id: route
        uses: ./.github/actions/route-runner
        with:
          token: ${{ github.token }}
          mode: ${{ vars.HOBO_CI_ROUTE }}
          local-runner: ${{ vars.HOBO_CI_LOCAL_RUNNER }}
          max-wait-seconds: ${{ vars.HOBO_CI_ROUTE_MAX_WAIT_SECONDS }}
          max-queued: ${{ vars.HOBO_CI_ROUTE_MAX_QUEUED }}
          trunk-runner: ${{ vars.HOBO_CI_TRUNK_RUNNER }}
          fleet-state: ${{ vars.HOBO_CI_FLEET_STATE }}

  ts-autocode-release-contract:
    name: ts-autocode pin cone + npm dry-run
    needs: route
    runs-on: ${{ needs.route.outputs.runner || (vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            scripts
            packages
            tools/pins
            external
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .mise/locks
            mise.toml
            mise.lock
          sparse-checkout-cone-mode: true
          submodules: recursive
          clean: false
      - uses: ./.github/actions/ci-runner-preflight
      - name: Fetch pinned ts-autocode sparse cone
        run: pnpm run pins:fetch ts-autocode
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Consumer surface contract
        run: node --import tsx --test scripts/test/ts-autocode-consumer-surface.test.ts
      - name: npm pack dry-run (grounding package)
        run: |
          set -euo pipefail
          cd external/ts-autocode/packages/grounding
          npm pack --dry-run --ignore-scripts
