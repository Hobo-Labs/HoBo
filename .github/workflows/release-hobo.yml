name: HoBo release (npm + GHCR OCI)

on:
  pull_request:
    branches: [main]
    paths:
      - "deploy/release-images/**"
      - "release/**"
      - "mise.toml"
      - "mise.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "turbo.json"
      - "site/**"
      - "scripts/ci/*release*"
      - "scripts/ci/npm-publish-scope.mts"
      - "scripts/ci/stage-sdk-artifacts.mts"
      - "scripts/ci/publish-npm-sdk.mts"
      - "scripts/ci/resolve-release-version.mts"
      - "scripts/ci/push-release-ghcr-images.mts"
      - "scripts/ci/ensure-ci-worker-image.mts"
      - "scripts/ci/extract-sdk-artifacts.mts"
      - "scripts/lib/release-version.mts"
      - "scripts/lib/release-oci-contract.mts"
      - "scripts/test/release-oci-affected.test.ts"
      - "scripts/test/release-oci-image-contract.test.ts"
      - "scripts/test/release-version.test.ts"
      - "scripts/test/stage-release-oci-app.test.ts"
      - ".github/actions/release-oci-attest/**"
      - ".github/actions/hobo-checkout/**"
      - ".github/workflows/release-hobo.yml"
  push:
    tags:
      - "v*"
      - "sdk-v*"
      - "cli-v*"
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push GHCR/npm release (protected environment)"
        type: boolean
        default: false
      release_version:
        description: "Release tag (e.g. v0.0.0-alpha.0, sdk-v0.0.0-alpha.0) when push_images is true"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: hobo-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RELEASE_SPARSE_PATHS: |
    .github
    scripts
    packages
    release
    deploy
    site
    external
    tools/pins
    mise.toml
    mise.lock
    package.json
    pnpm-lock.yaml
    pnpm-workspace.yaml
    turbo.json
    tsconfig.base.json
  HOBO_RELEASE_TURBO_BASE: origin/main

jobs:
  fork-policy:
    name: Fork PR policy (no Docker/secrets)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
    runs-on: hobo
    timeout-minutes: 5
    steps:
      - run: |
          echo "Fork pull request: release OCI/docker jobs are skipped; see packages/ci/RUNNER-QUEUE.md"

  release-contract:
    name: Release manifests + OCI contract (static)
    runs-on: hobo
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: ${{ env.RELEASE_SPARSE_PATHS }}
          sparse-checkout-cone-mode: true
          submodules: recursive
      - uses: ./.github/actions/ci-runner-preflight
      - name: Fetch pinned ts-autocode
        run: pnpm run pins:fetch ts-autocode
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: npm scope map + OCI manifest contract
        run: pnpm exec vitest run scripts/test/release-oci-affected.test.ts scripts/test/release-oci-image-contract.test.ts scripts/test/release-version.test.ts scripts/test/stage-release-oci-app.test.ts
      - name: npm pack dry-run (allowlist staging)
        run: |
          set -euo pipefail
          mkdir -p /tmp/hobo-release-staging
          node --no-warnings scripts/ci/npm-publish-scope.mts packages/core/package.json /tmp/hobo-release-staging/package.json
          grep -q '@hobo-labs/core' /tmp/hobo-release-staging/package.json

  release-oci-affected:
    name: Select affected OCI app images
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
    needs: release-contract
    runs-on: hobo
    timeout-minutes: 20
    outputs:
      image_ids: ${{ steps.affected.outputs.image_ids }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: ${{ env.RELEASE_SPARSE_PATHS }}
          sparse-checkout-cone-mode: true
      - uses: ./.github/actions/ci-runner-preflight
      - name: Fetch default branch for diff base
        run: git fetch --no-tags origin main
      - name: Detect affected images
        id: affected
        env:
          HOBO_CHECK_BASE: origin/main
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            images="$(node --no-warnings scripts/ci/release-oci-affected.mts --all)"
          else
            images="$(node --no-warnings scripts/ci/release-oci-affected.mts)"
          fi
          echo "image_ids=${images}" >> "$GITHUB_OUTPUT"

  release-oci-build:
    name: Build OCI app images (no push)
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && needs.release-oci-affected.outputs.image_ids != '[]'
    needs: [release-contract, release-oci-affected]
    runs-on: hobo
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image_id: ${{ fromJSON(needs.release-oci-affected.outputs.image_ids) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: ${{ env.RELEASE_SPARSE_PATHS }}
          sparse-checkout-cone-mode: true
          submodules: recursive
      - uses: ./.github/actions/ci-runner-preflight
      - name: Ensure digest-pinned worker toolchain image
        run: node --no-warnings scripts/ci/ensure-ci-worker-image.mts
      - name: Build hobo-sdk before CLI when needed
        if: matrix.image_id == 'hobo-cli' || matrix.image_id == 'hobo-mcp'
        env:
          HOBO_RELEASE_VERSION: ${{ github.ref_name || github.sha }}
          HOBO_RELEASE_REVISION: ${{ github.sha }}
        run: node --no-warnings scripts/ci/build-release-oci-image.mts hobo-sdk --keep-candidate
      - name: Build hobo-cli before MCP layer
        if: matrix.image_id == 'hobo-mcp'
        env:
          HOBO_RELEASE_VERSION: ${{ github.ref_name || github.sha }}
          HOBO_RELEASE_REVISION: ${{ github.sha }}
        run: node --no-warnings scripts/ci/build-release-oci-image.mts hobo-cli --keep-candidate
      - name: Build release image
        env:
          HOBO_RELEASE_VERSION: ${{ github.ref_name || format('pr-{0}', github.event.pull_request.number || 'manual') }}
          HOBO_RELEASE_REVISION: ${{ github.sha }}
        run: node --no-warnings scripts/ci/build-release-oci-image.mts ${{ matrix.image_id }} --keep-candidate
      - name: Live OCI config contract
        env:
          HOBO_RELEASE_OCI_CONTRACT: live
          HOBO_RELEASE_OCI_IMAGE_ID: ${{ matrix.image_id }}
          HOBO_RELEASE_VERSION: ${{ github.ref_name || format('pr-{0}', github.event.pull_request.number || 'manual') }}
          HOBO_RELEASE_REVISION: ${{ github.sha }}
        run: pnpm exec vitest run scripts/test/release-oci-image-contract.test.ts
      - name: Clean up OCI build artifacts
        if: always()
        run: node --no-warnings scripts/ci/build-release-oci-image.mts ${{ matrix.image_id }} --cleanup-only

  release-oci-build-tag:
    name: Build all OCI images on tag (gate publish)
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/sdk-v') || startsWith(github.ref, 'refs/tags/cli-v') || (github.event_name == 'workflow_dispatch' && inputs.push_images)
    needs: release-contract
    runs-on: hobo
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image_id: [hobo-sdk, hobo-codegen, hobo-cli, hobo-mcp, hobo-ci-serve, hobo-site]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: ${{ env.RELEASE_SPARSE_PATHS }}
          sparse-checkout-cone-mode: true
          submodules: recursive
      - uses: ./.github/actions/ci-runner-preflight
      - run: node --no-warnings scripts/ci/ensure-ci-worker-image.mts
      - name: Build hobo-sdk before CLI/MCP
        if: matrix.image_id == 'hobo-cli' || matrix.image_id == 'hobo-mcp'
        env:
          HOBO_RELEASE_VERSION: ${{ github.ref_name }}
          HOBO_RELEASE_REVISION: ${{ github.sha }}
        run: node --no-warnings scripts/ci/build-release-oci-image.mts hobo-sdk --keep-candidate
      - name: Build hobo-cli before MCP
        if: matrix.image_id == 'hobo-mcp'
        env:
          HOBO_RELEASE_VERSION: ${{ github.ref_name }}
          HOBO_RELEASE_REVISION: ${{ github.sha }}
        run: node --no-warnings scripts/ci/build-release-oci-image.mts hobo-cli --keep-candidate
      - name: Build and verify release image
        env:
          HOBO_RELEASE_VERSION: ${{ github.ref_name }}
          HOBO_RELEASE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          node --no-warnings scripts/ci/build-release-oci-image.mts ${{ matrix.image_id }} --keep-candidate
          HOBO_RELEASE_OCI_CONTRACT=live HOBO_RELEASE_OCI_IMAGE_ID=${{ matrix.image_id }} \
            pnpm exec vitest run scripts/test/release-oci-image-contract.test.ts
          node --no-warnings scripts/ci/build-release-oci-image.mts ${{ matrix.image_id }} --cleanup-only

  release-publish:
    name: Publish GHCR images (tagged release)
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.push_images)
    needs: [release-contract, release-oci-build-tag]
    runs-on: hobo
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      HOBO_RELEASE_VERSION: ${{ github.ref_name || inputs.release_version }}
      HOBO_RELEASE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: ${{ env.RELEASE_SPARSE_PATHS }}
          sparse-checkout-cone-mode: true
          submodules: recursive
      - uses: ./.github/actions/ci-runner-preflight
      - name: Resolve and validate release version
        run: node --no-warnings scripts/ci/resolve-release-version.mts "${HOBO_RELEASE_VERSION}" --github-env
      - run: pnpm run pins:fetch ts-autocode
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - run: node --no-warnings scripts/ci/ensure-ci-worker-image.mts
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push release images
        run: node --no-warnings scripts/ci/push-release-ghcr-images.mts /tmp/hobo-release-digests.txt
      - name: Upload digest list
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hobo-release-digests
          path: /tmp/hobo-release-digests.txt

  release-attest:
    name: Attest GHCR images
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.push_images)
    needs: release-publish
    runs-on: hobo
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image_id: [hobo-sdk, hobo-codegen, hobo-cli, hobo-mcp, hobo-ci-serve, hobo-site]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hobo-release-digests
          path: /tmp/hobo-release-digests
      - uses: ./.github/actions/release-oci-attest
        with:
          digest-list-path: /tmp/hobo-release-digests/hobo-release-digests.txt
          image-id: ${{ matrix.image_id }}

  release-npm:
    name: npm publish train (SDK allowlist)
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/sdk-v') || (github.event_name == 'workflow_dispatch' && inputs.push_images)
    needs: [release-contract, release-oci-build-tag]
    runs-on: hobo
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      HOBO_RELEASE_VERSION: ${{ github.ref_name || inputs.release_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: ${{ env.RELEASE_SPARSE_PATHS }}
          sparse-checkout-cone-mode: true
          submodules: recursive
      - uses: ./.github/actions/ci-runner-preflight
      - name: Resolve and validate release version
        run: node --no-warnings scripts/ci/resolve-release-version.mts "${HOBO_RELEASE_VERSION}" --github-env
      - run: pnpm run pins:fetch ts-autocode
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: npm publish (@hobo-labs via hobodev + provenance)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node --no-warnings scripts/ci/publish-npm-sdk.mts /tmp/hobo-npm-release

  release-pages:
    name: Publish GitHub Pages (site/)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-contract
    runs-on: hobo
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            scripts
            site
            packages
            docs
            release
            mise.toml
            mise.lock
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            turbo.json
            tsconfig.base.json
            external
            tools/pins
          sparse-checkout-cone-mode: true
          submodules: recursive
      - uses: ./.github/actions/ci-runner-preflight
      - run: pnpm run pins:fetch ts-autocode
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Build Astro site
        run: pnpm --filter hobo-site run build
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@f7640ff4038d9c4318bd57fed06e8ee6946aedee
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/dist
          force_orphan: true
