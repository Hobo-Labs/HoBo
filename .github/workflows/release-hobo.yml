name: HoBo release (npm + GHCR OCI)

on:
  workflow_run:
    workflows: ["HoBo CI Fabric"]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "version.json"
      - "deploy/release-images/**"
      - "release/**"
      - "release/mise.toml"
      - "release/mise.lock"
      - "scripts/lib/nbgv-toolchain.mts"
      - "scripts/test/nbgv-toolchain.test.ts"
      - "mise.toml"
      - "mise.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "turbo.json"
      - "site/**"
      - "scripts/ci/*release*"
      - "scripts/ci/npm-publish-scope.mts"
      - "scripts/ci/stage-sdk-artifacts.mts"
      - "scripts/ci/build-release-site-prebuild.mts"
      - "scripts/ci/publish-npm-sdk.mts"
      - "scripts/test/publish-npm-sdk.test.ts"
      - "scripts/ci/resolve-release-version.mts"
      - "scripts/ci/compute-release-version.mts"
      - "scripts/ci/check-release-relevant-push.mts"
      - "scripts/ci/push-release-git-tag.mts"
      - "scripts/ci/create-github-release.mts"
      - "scripts/lib/ssh-sig.mts"
      - "scripts/test/release-git-tag.test.ts"
      - "scripts/lib/nbgv-release-version.mts"
      - "scripts/lib/release-hobo-path-filters.mts"
      - "scripts/lib/release-pages-stale.mts"
      - "scripts/test/release-pages-stale.test.ts"
      - "scripts/test/nbgv-release-version.test.ts"
      - "scripts/ci/push-release-ghcr-images.mts"
      - "scripts/lib/docker-registry-push.mts"
      - "scripts/test/push-release-ghcr-images.test.ts"
      - "scripts/ci/ensure-ci-worker-image.mts"
      - "scripts/ci/extract-sdk-artifacts.mts"
      - "scripts/lib/release-sparse-cone.mts"
      - "scripts/lib/ci-runner-contract.mts"
      - "scripts/ci-runner-preflight.mts"
      - ".github/actions/ci-runner-preflight/**"
      - "scripts/lib/release-version.mts"
      - "scripts/lib/release-oci-contract.mts"
      - "scripts/test/release-oci-affected.test.ts"
      - "scripts/test/release-oci-attest-contract.test.ts"
      - "scripts/test/release-oci-image-contract.test.ts"
      - "scripts/test/release-sparse-cone.test.ts"
      - "scripts/test/release-version.test.ts"
      - "scripts/test/stage-release-oci-app.test.ts"
      - "scripts/test/build-release-site-prebuild.test.ts"
      - ".github/actions/release-oci-attest/**"
      - ".github/actions/hobo-checkout/**"
      - ".github/workflows/release-hobo.yml"
  push:
    tags:
      - "sdk-v*"
      - "cli-v*"
  merge_group:
    branches: [main]
    types: [checks_requested]
    paths:
      - "deploy/release-images/**"
      - "release/**"
      - "release/mise.toml"
      - "release/mise.lock"
      - "scripts/lib/nbgv-toolchain.mts"
      - "scripts/test/nbgv-toolchain.test.ts"
      - "mise.toml"
      - "mise.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "turbo.json"
      - "site/**"
      - "scripts/ci/*release*"
      - "scripts/ci/npm-publish-scope.mts"
      - "scripts/ci/stage-sdk-artifacts.mts"
      - "scripts/ci/build-release-site-prebuild.mts"
      - "scripts/ci/publish-npm-sdk.mts"
      - "scripts/test/publish-npm-sdk.test.ts"
      - "scripts/ci/resolve-release-version.mts"
      - "scripts/ci/compute-release-version.mts"
      - "scripts/ci/check-release-relevant-push.mts"
      - "scripts/ci/push-release-git-tag.mts"
      - "scripts/ci/create-github-release.mts"
      - "scripts/lib/ssh-sig.mts"
      - "scripts/test/release-git-tag.test.ts"
      - "scripts/lib/nbgv-release-version.mts"
      - "scripts/lib/release-hobo-path-filters.mts"
      - "scripts/lib/release-pages-stale.mts"
      - "scripts/test/release-pages-stale.test.ts"
      - "scripts/test/nbgv-release-version.test.ts"
      - "scripts/ci/push-release-ghcr-images.mts"
      - "scripts/lib/docker-registry-push.mts"
      - "scripts/test/push-release-ghcr-images.test.ts"
      - "scripts/ci/ensure-ci-worker-image.mts"
      - "scripts/ci/extract-sdk-artifacts.mts"
      - "scripts/lib/release-sparse-cone.mts"
      - "scripts/lib/ci-runner-contract.mts"
      - "scripts/ci-runner-preflight.mts"
      - ".github/actions/ci-runner-preflight/**"
      - "scripts/lib/release-version.mts"
      - "scripts/lib/release-oci-contract.mts"
      - "scripts/test/release-oci-affected.test.ts"
      - "scripts/test/release-oci-attest-contract.test.ts"
      - "scripts/test/release-oci-image-contract.test.ts"
      - "scripts/test/release-sparse-cone.test.ts"
      - "scripts/test/release-version.test.ts"
      - "scripts/test/stage-release-oci-app.test.ts"
      - "scripts/test/build-release-site-prebuild.test.ts"
      - ".github/actions/release-oci-attest/**"
      - ".github/actions/hobo-checkout/**"
      - ".github/workflows/release-hobo.yml"
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push GHCR/npm release (protected environment)"
        type: boolean
        default: false
      release_version:
        description: "Release tag (e.g. v0.0.0-alpha.0, sdk-v0.0.0-alpha.0) when push_images is true"
        type: string
        required: false
      publish_pages:
        description: "Publish site/ to GitHub Pages from main now (run from main only; never puts an older commit back)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hobo-release-${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RELEASE_SPARSE_PATHS: |
    .github
    scripts
    test/setup
    packages
    release
    deploy
    site
    external
    media
    examples
    src
    tools/pins
    .mise/locks
    mise.toml
    mise.lock
    package.json
    pnpm-lock.yaml
    pnpm-workspace.yaml
    turbo.json
    tsconfig.base.json
  HOBO_RELEASE_TURBO_BASE: origin/main
  RELEASE_PAGES_SPARSE_PATHS: |
    .github
    scripts
    site
    packages
    docs
    release
    external
    examples
    media
    tools/pins
    .mise/locks
    mise.toml
    mise.lock
    package.json
    pnpm-lock.yaml
    pnpm-workspace.yaml
    turbo.json
    tsconfig.base.json

jobs:
  route:
    name: Route runners
    # GitHub-hosted on purpose: the choice of runner must not wait on the fleet
    # it is choosing against. The fleet while it takes jobs, an enrolled local
    # box when it does not, GitHub-hosted when neither does (scripts/ci/route-runner.mts).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      runner: ${{ steps.route.outputs.runner }}
      tier: ${{ steps.route.outputs.tier }}
      # A signed local run verified for this tree (scripts/ci/verify-attestation.mts):
      # the jobs it covers are skipped. `false` and `[]` when there is none.
      attested: ${{ steps.route.outputs.attested }}
      attested-jobs: ${{ steps.route.outputs.attested-jobs }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/route-runner
            scripts/ci/route-runner.mts
            scripts/ci/attestation.mts
            scripts/ci/verify-attestation.mts
            packages/ci/src/fleet-overflow.ts
      - id: route
        uses: ./.github/actions/route-runner
        with:
          token: ${{ github.token }}
          mode: ${{ vars.HOBO_CI_ROUTE }}
          local-runner: ${{ vars.HOBO_CI_LOCAL_RUNNER }}
          max-wait-seconds: ${{ vars.HOBO_CI_ROUTE_MAX_WAIT_SECONDS }}
          max-queued: ${{ vars.HOBO_CI_ROUTE_MAX_QUEUED }}
          trunk-runner: ${{ vars.HOBO_CI_TRUNK_RUNNER }}
          fleet-state: ${{ vars.HOBO_CI_FLEET_STATE }}

  release-main-train-gate:
    name: Main train release gate (nbgv)
    needs: route
    if: github.repository == 'Hobo-Labs/HoBo'
    runs-on: ${{ needs.route.outputs.runner || (vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo') }}
    timeout-minutes: 15
    outputs:
      run: ${{ steps.version.outputs.run == 'true' }}
      release_ref: ${{ steps.version.outputs.release_ref }}
      release_sha: ${{ steps.version.outputs.release_sha }}
    steps:
      - name: Main train release after green CI (nbgv)
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/ci-runner-preflight
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
      - name: Prepare nbgv dotnet (release mise)
        timeout-minutes: 5
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        run: node --no-warnings scripts/ci/ensure-nbgv-toolchain.mts
      - name: Skip when push did not touch release paths
        id: scope
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        run: |
          set -euo pipefail
          head_sha='${{ github.event.workflow_run.head_sha }}'
          node --no-warnings scripts/ci/check-release-relevant-push.mts \
            --from "${head_sha}^" \
            --to "${head_sha}" \
            --github-output "$GITHUB_OUTPUT"
      - name: Resolve fixed alpha train version
        id: version
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          head_sha='${{ github.event.workflow_run.head_sha }}'
          pnpm run pins:fetch ts-autocode
          pnpm install --frozen-lockfile --config.confirmModulesPurge=false
          pnpm exec vitest run scripts/test/nbgv-release-version.test.ts scripts/test/nbgv-toolchain.test.ts
          node --no-warnings scripts/ci/compute-release-version.mts "$head_sha" --github-env --github-output "$GITHUB_OUTPUT"

  # One job, not three: on the shared two-slot box every extra job pays its own
  # checkout and install (~2 min) and its own wait for a slot.
  release-contract:
    name: Release contract + affected OCI images
    needs: route
    # Skipped when the route job verified a signed local run of this job for this
    # tree. A local run signs for this job only when no OCI image is affected.
    if: ${{ !(needs.route.outputs.attested == 'true' && contains(needs.route.outputs.attested-jobs, '"release-contract"')) }}
    runs-on: ${{ needs.route.outputs.runner || (vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo') }}
    timeout-minutes: 20
    steps:
      - name: Bootstrap repo-local composite actions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: true
      - uses: ./.github/actions/hobo-checkout
        with:
          fetch-depth: 2
          sparse-paths: ${{ env.RELEASE_SPARSE_PATHS }}
          submodules: "false"
      - uses: ./.github/actions/ci-runner-preflight
      - name: Fetch pinned ts-autocode
        run: pnpm run pins:fetch ts-autocode
      - uses: ./.github/actions/pnpm-store
      - name: Link deps layer or install
        run: |
          set -euo pipefail
          if [ -n "${HOBO_CI_DEPS_LAYER:-}" ] \
            && node --experimental-strip-types scripts/ci/deps-layer.mts link \
            && node --experimental-strip-types scripts/ci/deps-layer.mts check --require; then
            echo "reusing HOBO_CI_DEPS_LAYER=${HOBO_CI_DEPS_LAYER}; skip pnpm install"
          else
            pnpm install --frozen-lockfile --config.confirmModulesPurge=false
          fi
      - name: Shell syntax (changed scripts)
        if: github.event_name != 'push'
        run: pnpm run lint:shell:changed -- --base=HEAD^1
      - name: npm scope map + OCI manifest contract
        id: release_contract_tests
        run: >-
          node --no-warnings scripts/ci/run-job-command-report.mts
          --label release-contract-vitest --
          pnpm exec vitest run
          scripts/test/release-contract-vitest-scope.test.ts
          scripts/test/release-git-tag.test.ts
          scripts/test/release-oci-affected.test.ts
          scripts/test/release-oci-attest-contract.test.ts
          scripts/test/release-oci-image-contract.test.ts
          scripts/test/release-pages-stale.test.ts
          scripts/test/release-sparse-cone.test.ts
          scripts/test/release-version.test.ts
          scripts/test/stage-release-oci-app.test.ts
          scripts/test/stage-sdk-artifacts.test.ts
          scripts/test/build-release-site-prebuild.test.ts
          scripts/test/nbgv-release-version.test.ts
      - name: Upload release contract vitest log
        if: failure() && steps.release_contract_tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vitest-release-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/hobo-ci-job-logs/release-contract-vitest.log
          if-no-files-found: ignore
      - name: npm pack dry-run (allowlist staging)
        run: |
          set -euo pipefail
          mkdir -p /tmp/hobo-release-staging
          node --no-warnings scripts/ci/npm-publish-scope.mts packages/core/package.json /tmp/hobo-release-staging/package.json
          grep -q '@hobo-labs/core' /tmp/hobo-release-staging/package.json
      # A pull_request checkout is the merge commit, so HEAD^1 is the base tip and
      # fetch-depth 2 is the whole history the diff needs.
      - name: Detect affected images
        id: affected
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
        env:
          HOBO_CHECK_BASE: HEAD^1
        run: |
          set -euo pipefail
          # Editing this workflow edits how every image is built, so it builds them all.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || ! git diff --quiet HEAD^1 HEAD -- .github/workflows/release-hobo.yml; then
            images="$(node --no-warnings scripts/ci/release-oci-affected.mts --all)"
          else
            images="$(node --no-warnings scripts/ci/release-oci-affected.mts --explain)"
          fi
          echo "affected: ${images}"
          echo "image_ids=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).join(" "))' "$images")" >> "$GITHUB_OUTPUT"
      - name: Turbo cache
        if: steps.affected.outputs.image_ids != ''
        uses: ./.github/actions/turbo-cache
        with:
          turbo-token: ${{ github.event.pull_request.head.repo.fork && '' || secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          remote-mode: ${{ github.event.pull_request.head.repo.fork && 'remote:ro' || 'remote:rw' }}
      - name: Ensure worker toolchain image
        if: steps.affected.outputs.image_ids != ''
        run: |
          set -euo pipefail
          bash packages/ci-gh-actions/deploy/ci-runner/build.sh
      - name: Build affected images + live OCI config contract
        if: steps.affected.outputs.image_ids != ''
        env:
          IMAGE_IDS: ${{ steps.affected.outputs.image_ids }}
          HOBO_RELEASE_OCI_AFFECTED_IMAGE_IDS: ${{ steps.affected.outputs.image_ids }}
          HOBO_RELEASE_TURBO_BASE: HEAD^1
          HOBO_RELEASE_VERSION: pr-${{ github.event.pull_request.number || 'manual' }}
          HOBO_RELEASE_REVISION: ${{ github.sha }}
          HOBO_CI_WORKER_IMAGE: hobo-ci-worker:local
          HOBO_TURBO_CONCURRENCY: "1"
        run: |
          set -uo pipefail
          build() { node --no-warnings scripts/ci/build-release-oci-image.mts "$@"; }
          build_one() {
            local id="$1"
            echo "::group::${id}"
            local ok=1
            if [ "$id" = "hobo-cli" ] || [ "$id" = "hobo-mcp" ]; then
              # Prerequisite base image: allow staging it even when only the
              # dependent image is affected (stage guard checks this list).
              HOBO_RELEASE_OCI_AFFECTED_IMAGE_IDS="${HOBO_RELEASE_OCI_AFFECTED_IMAGE_IDS} hobo-sdk" \
                build hobo-sdk --keep-candidate || ok=0
            fi
            if [ "$id" = "hobo-mcp" ] && ! docker image inspect hobo-cli:candidate >/dev/null 2>&1; then
              HOBO_RELEASE_OCI_AFFECTED_IMAGE_IDS="${HOBO_RELEASE_OCI_AFFECTED_IMAGE_IDS} hobo-cli" \
                build hobo-cli --keep-candidate || ok=0
            fi
            if [ "$ok" = 1 ]; then build "$id" --keep-candidate || ok=0; fi
            if [ "$ok" = 1 ]; then
              HOBO_RELEASE_OCI_CONTRACT=live HOBO_RELEASE_OCI_IMAGE_ID="$id" \
                pnpm exec vitest run scripts/test/release-oci-image-contract.test.ts || ok=0
            fi
            if [ "$id" != "hobo-cli" ] || [[ " $IMAGE_IDS " != *" hobo-mcp "* ]]; then
              build "$id" --cleanup-only
            fi
            echo "::endgroup::"
            if [ "$ok" = 0 ]; then
              echo "::error::release image ${id} failed"
              return 1
            fi
          }
          failed=()
          for id in $IMAGE_IDS; do
            if [ "$id" = "hobo-mcp" ] || [ "$id" = "hobo-cli" ]; then continue; fi
            if ! build_one "$id"; then failed+=("$id"); fi
          done
          if [[ " $IMAGE_IDS " == *" hobo-cli "* ]]; then
            if ! build_one hobo-cli; then failed+=("hobo-cli"); fi
          fi
          if [[ " $IMAGE_IDS " == *" hobo-mcp "* ]]; then
            if ! build_one hobo-mcp; then failed+=("hobo-mcp"); fi
          fi
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "failed images: ${failed[*]}"
            exit 1
          fi
      - name: Clean up OCI build artifacts
        if: always() && steps.affected.outputs.image_ids != ''
        env:
          IMAGE_IDS: ${{ steps.affected.outputs.image_ids }}
        run: |
          for id in $IMAGE_IDS hobo-cli; do
            node --no-warnings scripts/ci/build-release-oci-image.mts "$id" --cleanup-only || true
          done
      - name: Prune Turbo cache
        id: turbo-prune
        if: always() && steps.affected.outputs.image_ids != '' && env.TURBO_TOKEN == ''
        continue-on-error: true
        run: node --experimental-strip-types --no-warnings scripts/ci/turbo-cache-prune.mts
      - name: Save Turbo cache
        if: always() && steps.affected.outputs.image_ids != '' && steps.turbo-prune.outputs.save != 'false'
        uses: ./.github/actions/turbo-cache
        with:
          mode: save

  release-oci-build-tag:
    name: Build all OCI images on tag (gate publish)
    if: >-
      always() &&
      needs.release-main-train-gate.result == 'success' &&
      (
        needs.release-main-train-gate.outputs.run == 'true' ||
        startsWith(github.ref, 'refs/tags/sdk-v') ||
        startsWith(github.ref, 'refs/tags/cli-v') ||
        (github.event_name == 'workflow_dispatch' && inputs.push_images)
      ) &&
      (
        needs.release-main-train-gate.outputs.run == 'true' ||
        needs.release-contract.result == 'success'
      )
    needs: [release-main-train-gate, release-contract]
    # packages: read lets a runner without the worker image (an ARC pod) pull it.
    permissions:
      contents: read
      packages: read
    env:
      HOBO_RELEASE_TURBO_BASE: ""
      HOBO_RELEASE_VERSION: ${{ needs.release-main-train-gate.outputs.release_ref != '' && needs.release-main-train-gate.outputs.release_ref || github.ref_name || inputs.release_version }}
      HOBO_RELEASE_CHECKOUT_REF: ${{ needs.release-main-train-gate.outputs.release_sha != '' && needs.release-main-train-gate.outputs.release_sha || github.sha }}
    runs-on: ${{ vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image_id: [hobo-sdk, hobo-codegen, hobo-cli, hobo-mcp, hobo-ci-serve, hobo-site]
    steps:
      - name: Bootstrap repo-local composite actions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: true
      - uses: ./.github/actions/hobo-checkout
        with:
          fetch-depth: 1
          ref: ${{ env.HOBO_RELEASE_CHECKOUT_REF }}
          sparse-paths: ${{ env.RELEASE_SPARSE_PATHS }}
          submodules: "false"
      - uses: ./.github/actions/ci-runner-preflight
      - name: Ensure digest-pinned content-keyed toolchain image
        timeout-minutes: 5
        # Without a token the GHCR pull is never tried, and a runner that does not
        # already hold the image refuses the release (run 43059319805).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --no-warnings scripts/ci/ensure-ci-worker-image.mts
      - name: Build hobo-sdk before CLI/MCP
        if: matrix.image_id == 'hobo-cli' || matrix.image_id == 'hobo-mcp'
        env:
          HOBO_RELEASE_VERSION: ${{ env.HOBO_RELEASE_VERSION }}
          HOBO_RELEASE_REVISION: ${{ env.HOBO_RELEASE_CHECKOUT_REF }}
        run: node --no-warnings scripts/ci/build-release-oci-image.mts hobo-sdk --keep-candidate
      - name: Build hobo-cli before MCP
        if: matrix.image_id == 'hobo-mcp'
        env:
          HOBO_RELEASE_VERSION: ${{ env.HOBO_RELEASE_VERSION }}
          HOBO_RELEASE_REVISION: ${{ env.HOBO_RELEASE_CHECKOUT_REF }}
        run: node --no-warnings scripts/ci/build-release-oci-image.mts hobo-cli --keep-candidate
      - name: Build and verify release image
        env:
          HOBO_RELEASE_VERSION: ${{ env.HOBO_RELEASE_VERSION }}
          HOBO_RELEASE_REVISION: ${{ env.HOBO_RELEASE_CHECKOUT_REF }}
        run: |
          set -euo pipefail
          node --no-warnings scripts/ci/build-release-oci-image.mts ${{ matrix.image_id }} --keep-candidate
          HOBO_RELEASE_OCI_CONTRACT=live HOBO_RELEASE_OCI_IMAGE_ID=${{ matrix.image_id }} \
            pnpm exec vitest run scripts/test/release-oci-image-contract.test.ts
          node --no-warnings scripts/ci/build-release-oci-image.mts ${{ matrix.image_id }} --cleanup-only

  release-publish:
    name: Publish GHCR images (tagged release)
    if: >-
      always() &&
      needs.release-main-train-gate.result == 'success' &&
      (
        needs.release-main-train-gate.outputs.run == 'true' ||
        startsWith(github.ref, 'refs/tags/sdk-v') ||
        startsWith(github.ref, 'refs/tags/cli-v') ||
        (github.event_name == 'workflow_dispatch' && inputs.push_images)
      ) &&
      (
        needs.release-main-train-gate.outputs.run == 'true' ||
        needs.release-contract.result == 'success'
      )
    needs: [release-main-train-gate, release-contract, release-oci-build-tag]
    runs-on: ${{ vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo' }}
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      HOBO_RELEASE_TURBO_BASE: ""
      HOBO_RELEASE_VERSION: ${{ needs.release-main-train-gate.outputs.release_ref != '' && needs.release-main-train-gate.outputs.release_ref || github.ref_name || inputs.release_version }}
      HOBO_RELEASE_CHECKOUT_REF: ${{ needs.release-main-train-gate.outputs.release_sha != '' && needs.release-main-train-gate.outputs.release_sha || github.sha }}
      HOBO_RELEASE_REVISION: ${{ needs.release-main-train-gate.outputs.release_sha != '' && needs.release-main-train-gate.outputs.release_sha || github.sha }}
    steps:
      - name: Bootstrap repo-local composite actions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: true
      - uses: ./.github/actions/hobo-checkout
        with:
          fetch-depth: 1
          ref: ${{ env.HOBO_RELEASE_CHECKOUT_REF }}
          sparse-paths: ${{ env.RELEASE_SPARSE_PATHS }}
          submodules: "false"
      - uses: ./.github/actions/ci-runner-preflight
      - run: pnpm run pins:fetch ts-autocode
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Resolve and validate release version
        env:
          HOBO_RELEASE_VERSION_MODE: ${{ needs.release-main-train-gate.outputs.run == 'true' && 'nbgv' || 'tag-ref' }}
        run: node --no-warnings scripts/ci/materialize-release-version.mts
      - name: Ensure digest-pinned content-keyed toolchain image
        timeout-minutes: 5
        # Without a token the GHCR pull is never tried, and a runner that does not
        # already hold the image refuses the release (run 43059319805).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --no-warnings scripts/ci/ensure-ci-worker-image.mts
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push release images
        run: node --no-warnings scripts/ci/push-release-ghcr-images.mts /tmp/hobo-release-digests.txt
      - name: Upload digest list
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hobo-release-digests
          path: /tmp/hobo-release-digests.txt

  release-attest:
    name: Attest GHCR images
    if: >-
      always() &&
      needs.release-publish.result == 'success' &&
      (
        needs.release-main-train-gate.outputs.run == 'true' ||
        startsWith(github.ref, 'refs/tags/sdk-v') ||
        startsWith(github.ref, 'refs/tags/cli-v') ||
        (github.event_name == 'workflow_dispatch' && inputs.push_images)
      )
    needs: [release-main-train-gate, release-publish]
    runs-on: ${{ vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo' }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image_id: [hobo-sdk, hobo-codegen, hobo-cli, hobo-mcp, hobo-ci-serve, hobo-site]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hobo-release-digests
          path: /tmp/hobo-release-digests
      - uses: ./.github/actions/release-oci-attest
        with:
          digest-list-path: /tmp/hobo-release-digests/hobo-release-digests.txt
          image-id: ${{ matrix.image_id }}
          ghcr-username: ${{ github.actor }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  release-npm:
    name: npm publish train (SDK allowlist)
    # The @hobo-labs packages have never been published, and npm trusted
    # publishing cannot attach to a package that does not exist yet: the first
    # publish needs the one-time bootstrap in docs/release/pipelines.md. Until the
    # repository variable HOBO_NPM_PUBLISH is 'true' this job is skipped, not run
    # to fail with ENEEDAUTH and take the tag and GitHub Release down with it.
    if: >-
      always() &&
      vars.HOBO_NPM_PUBLISH == 'true' &&
      needs.release-main-train-gate.result == 'success' &&
      (
        needs.release-main-train-gate.outputs.run == 'true' ||
        startsWith(github.ref, 'refs/tags/sdk-v') ||
        (github.event_name == 'workflow_dispatch' && inputs.push_images)
      ) &&
      (
        needs.release-main-train-gate.outputs.run == 'true' ||
        needs.release-contract.result == 'success'
      )
    needs: [release-main-train-gate, release-contract, release-oci-build-tag]
    # npm trusted publishing (OIDC) requires GitHub-hosted runners — not self-hosted hobo.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      HOBO_RELEASE_TURBO_BASE: ""
      HOBO_RELEASE_VERSION: ${{ needs.release-main-train-gate.outputs.release_ref != '' && needs.release-main-train-gate.outputs.release_ref || github.ref_name || inputs.release_version }}
      HOBO_RELEASE_CHECKOUT_REF: ${{ needs.release-main-train-gate.outputs.release_sha != '' && needs.release-main-train-gate.outputs.release_sha || github.sha }}
    steps:
      - name: Bootstrap repo-local composite actions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: true
      - uses: ./.github/actions/hobo-checkout
        with:
          fetch-depth: 1
          ref: ${{ env.HOBO_RELEASE_CHECKOUT_REF }}
          sparse-paths: ${{ env.RELEASE_SPARSE_PATHS }}
          submodules: "false"
      - uses: jdx/mise-action@8008c3f4db491fde6fd6d72dc97fbdb752dac949
      - run: pnpm run pins:fetch ts-autocode
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Resolve and validate release version
        env:
          HOBO_RELEASE_VERSION_MODE: ${{ needs.release-main-train-gate.outputs.run == 'true' && 'nbgv' || 'tag-ref' }}
        run: node --no-warnings scripts/ci/materialize-release-version.mts
      - name: npm publish (@hobo-labs via OIDC or hobodev token + provenance)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node --no-warnings scripts/ci/publish-npm-sdk.mts /tmp/hobo-npm-release

  # The site is published from what gh-pages holds, not from the push that
  # triggered this run: a deploy that failed, a run that was cancelled, or a
  # commit that reached main in a merge-queue batch behind another is picked up
  # by the next green run. Apart from the train gate on purpose: it is two API
  # calls, and the site must not wait on dotnet and vitest to learn whether it
  # is stale.
  release-pages-gate:
    name: Pages freshness gate
    if: >-
      github.repository == 'Hobo-Labs/HoBo' &&
      (
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_pages &&
          github.ref == 'refs/heads/main')
      )
    needs: [route]
    runs-on: ${{ needs.route.outputs.runner || (vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo') }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.stale.outputs.deploy }}
    env:
      HOBO_RELEASE_CHECKOUT_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.HOBO_RELEASE_CHECKOUT_REF }}
          persist-credentials: false
          clean: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/release-hobo.yml
            .github/actions/ci-runner-preflight/hosted-toolchain.sh
            scripts/ci/check-release-pages-stale.mts
            scripts/lib/release-pages-stale.mts
            scripts/lib/release-hobo-path-filters.mts
            scripts/lib/pins-json.ts
            scripts/lib/pins-error.ts
      - name: Node that runs TypeScript as written
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash .github/actions/ci-runner-preflight/hosted-toolchain.sh
      - name: Is gh-pages behind this commit?
        id: stale
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # PAGES_FORCE is one flag or nothing
          node --no-warnings scripts/ci/check-release-pages-stale.mts \
            --head "$HOBO_RELEASE_CHECKOUT_REF" $PAGES_FORCE \
            --github-output "$GITHUB_OUTPUT"

  release-pages:
    name: Publish GitHub Pages (site/)
    if: >-
      always() &&
      needs.release-pages-gate.result == 'success' &&
      needs.release-pages-gate.outputs.deploy == 'true'
    needs: [release-pages-gate]
    runs-on: ${{ vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo' }}
    timeout-minutes: 20
    # One publish at a time. Two runs for different commits used to be free to
    # push gh-pages in either order.
    concurrency:
      group: hobo-release-pages
      cancel-in-progress: false
    env:
      HOBO_RELEASE_TURBO_BASE: origin/main
      HOBO_RELEASE_CHECKOUT_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Bootstrap repo-local composite actions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: true
      - uses: ./.github/actions/hobo-checkout
        with:
          fetch-depth: 1
          ref: ${{ env.HOBO_RELEASE_CHECKOUT_REF }}
          sparse-paths: ${{ env.RELEASE_PAGES_SPARSE_PATHS }}
          submodules: "false"
      - uses: ./.github/actions/ci-runner-preflight
      # The gate answered before this job waited for a runner and for the
      # publish slot; another run may have published a newer commit since.
      - name: Is gh-pages still behind this commit?
        id: fresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # PAGES_FORCE is one flag or nothing
          node --no-warnings scripts/ci/check-release-pages-stale.mts \
            --head "$HOBO_RELEASE_CHECKOUT_REF" $PAGES_FORCE \
            --github-output "$GITHUB_OUTPUT"
      - if: steps.fresh.outputs.deploy == 'true'
        run: pnpm run pins:fetch ts-autocode
      - if: steps.fresh.outputs.deploy == 'true'
        uses: ./.github/actions/pnpm-store
      - if: steps.fresh.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Build hobo-site workspace deps for prebuild
        if: steps.fresh.outputs.deploy == 'true'
        run: node --no-warnings scripts/ci/build-release-site-prebuild.mts
      - name: Build Astro site
        if: steps.fresh.outputs.deploy == 'true'
        run: pnpm --filter hobo-site run build
      # The same tree scripts/deploy-site.mts publishes: the art catalogue is a
      # second Astro build (base /HoBo/media) nested under the site, so one
      # commit describes everything served. Without it a workflow deploy
      # deleted /media/ from under a manual one.
      - name: Build the art catalogue
        if: steps.fresh.outputs.deploy == 'true'
        run: pnpm --filter hobo-media run build
      - name: Nest the art catalogue under /media/
        if: steps.fresh.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          test -f media/dist/index.html
          test -f site/dist/.nojekyll
          mkdir -p site/dist/media
          cp -a media/dist/. site/dist/media/
      - name: Deploy to gh-pages branch
        if: steps.fresh.outputs.deploy == 'true'
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/dist
          force_orphan: true
          # The default message names github.sha, which on a workflow_run event
          # is the tip of main when the event fired, not the commit built here.
          # The freshness gate reads this back, so it has to be the truth.
          full_commit_message: "deploy: ${{ env.HOBO_RELEASE_CHECKOUT_REF }}"

  release-tag:
    name: Signed git tag + GitHub Release (main train)
    # Pages has its own gate now. The tag must not wait on this run's publish:
    # it is skipped when gh-pages already holds a newer commit, and cancelled
    # when a newer run's publish takes its place in the hobo-release-pages
    # queue. A failed publish, or a gate that failed to decide, still blocks it.
    if: >-
      !cancelled() &&
      needs.release-main-train-gate.outputs.run == 'true' &&
      needs.release-publish.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.release-npm.result) &&
      (vars.HOBO_NPM_PUBLISH != 'true' || needs.release-npm.result == 'success') &&
      needs.release-attest.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.release-pages-gate.result) &&
      contains(fromJSON('["success","skipped","cancelled"]'), needs.release-pages.result)
    needs: [release-main-train-gate, release-publish, release-npm, release-attest, release-pages-gate, release-pages]
    runs-on: ${{ vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo' }}
    environment: production
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: false
          ref: ${{ needs.release-main-train-gate.outputs.release_sha }}
          fetch-depth: 0
      - name: Push signed release tag (idempotent)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOBO_RELEASE_TAG_SSH_PRIVATE_KEY: ${{ secrets.HOBO_RELEASE_TAG_SSH_PRIVATE_KEY }}
          HOBO_RELEASE_TAG_SSH_SIGNING_KEY: ${{ secrets.HOBO_RELEASE_TAG_SSH_SIGNING_KEY }}
        run: |
          set -euo pipefail
          tag='${{ needs.release-main-train-gate.outputs.release_ref }}'
          node --no-warnings scripts/ci/push-release-git-tag.mts --tag "$tag" --commit '${{ needs.release-main-train-gate.outputs.release_sha }}'
      - name: Create GitHub Release (prerelease)
        # Through the REST API: the release runners have no gh CLI.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ needs.release-main-train-gate.outputs.release_ref }}'
          node --no-warnings scripts/ci/create-github-release.mts --tag "$tag" --prerelease

  release-github:
    name: GitHub Release (independent train tag)
    if: >-
      !cancelled() &&
      (startsWith(github.ref, 'refs/tags/sdk-v') || startsWith(github.ref, 'refs/tags/cli-v')) &&
      needs.release-publish.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.release-npm.result) &&
      needs.release-attest.result == 'success'
    needs: [release-publish, release-npm, release-attest]
    runs-on: ${{ vars.HOBO_CI_TRUNK_RUNNER != 'false' && contains(fromJSON('["push","workflow_dispatch","merge_group","workflow_run"]'), github.event_name) && 'hobo-trunk' || 'hobo' }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          clean: false
          fetch-depth: 1
      - name: Create or update GitHub Release
        # Through the REST API: the release runners have no gh CLI.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dist_tag="$(node --no-warnings scripts/ci/resolve-release-version.mts "${{ github.ref_name }}" | sed -n 's/^HOBO_RELEASE_NPM_DIST_TAG=//p')"
          prerelease=()
          if [ "$dist_tag" != "latest" ]; then prerelease=(--prerelease); fi
          node --no-warnings scripts/ci/create-github-release.mts --tag "${{ github.ref_name }}" "${prerelease[@]}"

  release-pr-gate:
    name: HoBo release PR gate (required)
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    needs: [route, release-contract]
    # GitHub-hosted: it runs no repository code, and on the fleet a superseded
    # run's gate held the next run until a runner was free.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed when release contract is red
        env:
          CONTRACT_RESULT: ${{ needs.release-contract.result }}
          ROUTE_RESULT: ${{ needs.route.result }}
          ATTESTED: ${{ needs.route.outputs.attested }}
          ATTESTED_JOBS: ${{ needs.route.outputs.attested-jobs }}
        run: |
          set -euo pipefail
          # A skipped job counts only when the route job itself succeeded and
          # reported a verified signed local run that covers that job by id.
          attested() {
            [ "${ROUTE_RESULT:-}" = "success" ] || return 1
            [ "${ATTESTED:-}" = "true" ] || return 1
            case "${ATTESTED_JOBS:-}" in
              *"\"$1\""*) return 0 ;;
            esac
            return 1
          }
          # A contract skipped because routing failed was never evaluated.
          if [ "${ROUTE_RESULT:-}" != "success" ]; then
            echo "::error::Runner routing did not succeed (result=${ROUTE_RESULT:-})"
            exit 1
          fi
          case "${CONTRACT_RESULT:-}" in
            success) exit 0 ;;
            skipped)
              if attested release-contract; then
                echo "release-contract skipped for a verified signed local run"
                exit 0
              fi
              echo "::error::Release contract was skipped without a verified signed local run"
              exit 1
              ;;
            *)
              echo "::error::Release contract + affected OCI images must pass (result=${CONTRACT_RESULT:-})"
              exit 1
              ;;
          esac
