name: HoBo Vercel credential evidence (read-only)

# Only a manually dispatched main-branch job can inspect these two candidates.
# It never deploys, modifies resources, or contacts the CI relay.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    name: Observe scoped Vercel credential access
    if: github.repository == 'Hobo-Labs/HoBo' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-pnpm
      - name: Install reviewed dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --config.confirmModulesPurge=false
      - name: Build the Vercel provider SDK
        run: pnpm exec turbo run build --filter=@hobo/provider-vercel... --concurrency=1 --output-logs=errors-only
      - name: Observe candidate presence and scoped project read
        shell: bash
        env:
          HOBO_VERCEL_TOKEN_CANDIDATE: ${{ secrets.VERCEL_TOKEN }}
          HOBO_VERCEL_ACCESS_TOKEN_CANDIDATE: ${{ secrets.VERCEL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node --experimental-strip-types --no-warnings scripts/ci/vercel-credential-evidence.mts | tee -a "$GITHUB_STEP_SUMMARY"
