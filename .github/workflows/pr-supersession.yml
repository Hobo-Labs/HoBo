name: PR supersession

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Print the decisions; close nothing
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-supersession
  cancel-in-progress: false

jobs:
  supersession:
    name: Close superseded pull requests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ci/pr-supersession.mts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Close superseded pull requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_SUPERSESSION_DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry-run }}
        run: node scripts/ci/pr-supersession.mts
