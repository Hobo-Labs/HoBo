name: HoBo Code release (npm dry-run + GHCR OCI)

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/code/**"
      - "deploy/release-images/hobo-code/**"
      - "release/oci-images.json"
      - "release/npm-scope-map.json"
      - "scripts/ci/build-release-oci-image.mts"
      - "scripts/ci/stage-release-oci-app.mts"
      - "scripts/ci/npm-publish-scope.mts"
      - "scripts/ci/release-oci-affected.mts"
      - "scripts/ci/pack-code-test-build-artifact.mts"
      - "scripts/ci/unpack-code-test-build-artifact.mts"
      - "scripts/lib/release-sparse-cone.mts"
      - "scripts/lib/ci-runner-contract.mts"
      - "scripts/ci-runner-preflight.mts"
      - ".github/actions/ci-runner-preflight/**"
      - "scripts/lib/release-oci-contract.mts"
      - "scripts/test/code-test-build-artifact.test.ts"
      - "scripts/test/release-sparse-cone.test.ts"
      - "scripts/test/release-oci-affected.test.ts"
      - "scripts/test/release-oci-image-contract.test.ts"
      - "scripts/test/stage-release-oci-app.test.ts"
      - ".github/actions/release-oci-attest/**"
      - ".github/workflows/release-code.yml"
      - "docs/release/pipelines.md"
  push:
    tags:
      - "code-v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hobo-code-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HOBO_TURBO_CONCURRENCY: "1"
  NODE_OPTIONS: --max-old-space-size=3072
  CODE_RELEASE_SPARSE_PATHS: |
    .github
    scripts
    test/setup
    packages
    external
    release
    deploy/release-images
    tools/pins
    .mise/locks
    mise.toml
    mise.lock
    package.json
    pnpm-lock.yaml
    pnpm-workspace.yaml
    turbo.json
    tsconfig.base.json

jobs:
  fork-policy:
    name: Fork PR policy (no Docker/secrets)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
    runs-on: hobo
    timeout-minutes: 5
    steps:
      - run: echo "Fork pull request skips code release docker jobs; see packages/ci/RUNNER-QUEUE.md"

  release-contract:
    name: HoBo Code release contract (static)
    runs-on: hobo
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: true
          sparse-checkout: ${{ env.CODE_RELEASE_SPARSE_PATHS }}
          submodules: recursive
      - uses: ./.github/actions/ci-runner-preflight
      - name: Fetch pinned ts-autocode
        run: pnpm run pins:fetch ts-autocode
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Shell syntax (changed scripts)
        run: pnpm run lint:shell:changed -- --base=origin/main
      - name: npm scope map + OCI manifest contract
        run: pnpm exec vitest run scripts/test/code-test-build-artifact.test.ts scripts/test/release-oci-affected.test.ts scripts/test/release-oci-image-contract.test.ts scripts/test/release-sparse-cone.test.ts scripts/test/stage-release-oci-app.test.ts

  code-build-cone:
    name: Lint + build @hobo/code test cone
    needs: release-contract
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: hobo
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          filter: blob:none
          sparse-checkout-cone-mode: true
          sparse-checkout: ${{ env.CODE_RELEASE_SPARSE_PATHS }}
          submodules: recursive
      - uses: ./.github/actions/ci-runner-preflight
      - name: Fetch pinned ts-autocode
        run: pnpm run pins:fetch ts-autocode
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - run: pnpm --filter @hobo/code lint
      - name: Turbo cache
        uses: ./.github/actions/turbo-cache
        with:
          turbo-token: ${{ github.event.pull_request.head.repo.fork && '' || secrets.TURBO_TOKEN }}
          turbo-team: ${{ vars.TURBO_TEAM }}
          remote-mode: ${{ github.event.pull_request.head.repo.fork && 'remote:ro' || 'remote:rw' }}
      - name: Build @hobo/code test dependency cone
        env:
          HOBO_RELEASE_TURBO_BASE: origin/main
        run: |
          git fetch --no-tags origin main
          pnpm exec turbo run build --filter=@hobo/code...[origin/main...HEAD] --filter=@hobo/hobo...[origin/main...HEAD] --filter=@hobo/adapter-hono...[origin/main...HEAD] --concurrency=1
      - name: Pack code test build artifact
        env:
          HOBO_CODE_RELEASE_ARTIFACT: "1"
        run: node --experimental-strip-types --no-warnings scripts/ci/pack-code-test-build-artifact.mts . /tmp/hobo-code-test-build.tar.gz
      - name: Upload code test build artifact
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hobo-code-test-build
          path: /tmp/hobo-code-test-build.tar.gz
      - name: Prune Turbo cache
        id: turbo-prune
        if: always() && env.TURBO_TOKEN == ''
        continue-on-error: true
        run: node --experimental-strip-types --no-warnings scripts/ci/turbo-cache-prune.mts
      - name: Save Turbo cache
        if: always() && steps.turbo-prune.outputs.save != 'false'
        uses: ./.github/actions/turbo-cache
        with:
          mode: save

  code-test:
    name: Test @hobo/code (shard ${{ matrix.shard }}/4)
    needs: code-build-cone
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: hobo
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - uses: ./.github/actions/ci-runner-preflight
      - name: Fetch pinned ts-autocode
        run: pnpm run pins:fetch ts-autocode
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Download code test build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hobo-code-test-build
          path: /tmp/hobo-code-test-build
      - name: Restore code test build artifact
        run: node --experimental-strip-types --no-warnings scripts/ci/unpack-code-test-build-artifact.mts /tmp/hobo-code-test-build/hobo-code-test-build.tar.gz .
      - name: Run test shard
        run: pnpm --filter @hobo/code exec vitest run --shard=${{ matrix.shard }}/4

  release-code-oci-affected:
    name: Select affected hobo-code OCI image
    if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
    needs: release-contract
    runs-on: hobo
    timeout-minutes: 10
    outputs:
      image_ids: ${{ steps.affected.outputs.image_ids }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-runner-preflight
      - name: Fetch default branch for diff base
        run: git fetch --no-tags origin main
      - name: Detect hobo-code image input changes
        id: affected
        env:
          HOBO_CHECK_BASE: origin/main
        run: |
          set -euo pipefail
          images="$(node --no-warnings scripts/ci/release-oci-affected.mts)"
          if node -e 'process.exit(JSON.parse(process.argv[1]).includes("hobo-code") ? 0 : 1)' "$images"; then
            echo 'image_ids=["hobo-code"]' >> "$GITHUB_OUTPUT"
          else
            echo 'image_ids=[]' >> "$GITHUB_OUTPUT"
          fi

  release-code-oci-build:
    name: Build hobo-code OCI image (no push)
    if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && needs.release-code-oci-affected.outputs.image_ids != '[]'
    needs: [release-contract, release-code-oci-affected]
    runs-on: hobo
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image_id: ${{ fromJSON(needs.release-code-oci-affected.outputs.image_ids) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - uses: ./.github/actions/ci-runner-preflight
      - name: Ensure digest-pinned worker toolchain image
        run: node --no-warnings scripts/ci/ensure-ci-worker-image.mts
      - name: Build hobo-code release image
        env:
          HOBO_RELEASE_VERSION: pr-${{ github.event.pull_request.number }}
          HOBO_RELEASE_REVISION: ${{ github.sha }}
        run: node --no-warnings scripts/ci/build-release-oci-image.mts ${{ matrix.image_id }}

  release-code-publish:
    name: Stage npm package + publish hobo-code GHCR image
    if: startsWith(github.ref, 'refs/tags/code-v') || github.event_name == 'workflow_dispatch'
    needs: [release-contract, code-build-cone, code-test]
    runs-on: hobo
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      HOBO_RELEASE_VERSION: ${{ github.ref_name }}
      HOBO_RELEASE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - uses: ./.github/actions/ci-runner-preflight
      - name: Fetch pinned ts-autocode
        run: pnpm run pins:fetch ts-autocode
      - uses: ./.github/actions/pnpm-store
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Download code test build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hobo-code-test-build
          path: /tmp/hobo-code-test-build
      - name: Restore code test build artifact
        run: node --experimental-strip-types --no-warnings scripts/ci/unpack-code-test-build-artifact.mts /tmp/hobo-code-test-build/hobo-code-test-build.tar.gz .
      - name: npm pack dry-run (scoped staging)
        run: |
          set -euo pipefail
          staging=/tmp/hobo-code-release-staging
          rm -rf "$staging"
          mkdir -p "$staging"
          cp -a packages/code/. "$staging/"
          node --no-warnings scripts/ci/npm-publish-scope.mts packages/code/package.json "$staging/package.json"
          grep -q '"name": "@hobo-labs/code"' "$staging/package.json"
          (cd "$staging" && npm pack --dry-run --ignore-scripts)
      - name: Ensure digest-pinned worker toolchain image
        run: node --no-warnings scripts/ci/ensure-ci-worker-image.mts
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push hobo-code release image
        run: |
          set -euo pipefail
          node --no-warnings scripts/ci/build-release-oci-image.mts hobo-code --skip-build --keep-candidate
          repo="${GITHUB_REPOSITORY,,}"
          tag="ghcr.io/${repo}/hobo/hobo-code:${HOBO_RELEASE_VERSION}"
          docker tag hobo-code:candidate "$tag"
          docker push "$tag"
          docker inspect --format='{{index .RepoDigests 0}}' "$tag" > /tmp/hobo-code-release-digests.txt
          docker rmi -f "$tag" || true
          node --no-warnings scripts/ci/build-release-oci-image.mts hobo-code --cleanup-only
          cat /tmp/hobo-code-release-digests.txt
      - name: Upload digest list
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hobo-code-release-digests
          path: /tmp/hobo-code-release-digests.txt

  release-code-attest:
    name: Attest hobo-code GHCR image
    if: startsWith(github.ref, 'refs/tags/code-v') || github.event_name == 'workflow_dispatch'
    needs: release-code-publish
    runs-on: hobo
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hobo-code-release-digests
          path: /tmp/hobo-code-release-attest
      - uses: ./.github/actions/release-oci-attest
        with:
          digest-list-path: /tmp/hobo-code-release-attest/hobo-code-release-digests.txt
          image-id: hobo-code
