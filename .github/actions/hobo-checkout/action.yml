name: HoBo sparse checkout
description: Partial clone (blob:none) with cone-mode sparse checkout for hermetic CI/release jobs.
inputs:
  fetch-depth:
    description: git fetch depth (0 = full history for diffs)
    required: false
    default: "1"
  sparse-paths:
    description: Newline-separated paths for sparse-checkout-cone-mode
    required: true
  submodules:
    description: Whether to fetch submodules after sparse checkout
    required: false
    default: "false"
  materialize-paths:
    description: Newline-separated paths that must exist on disk after checkout (promisor rematerialize)
    required: false
    default: ""
  ref:
    description: Optional git ref to checkout (defaults to the triggering commit)
    required: false
    default: ""
runs:
  using: composite
  steps:
    # The probe below is TypeScript run as written; a GitHub-hosted machine's
    # default Node may be too old for it. A no-op on the fleet's image.
    - name: Node for a GitHub-hosted machine
      shell: bash
      env:
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: bash "${GITHUB_ACTION_PATH}/../ci-runner-preflight/hosted-toolchain.sh"
    - name: Probe box git mirror
      shell: bash
      run: |
        set -euo pipefail
        cfg="${RUNNER_TEMP}/hobo-git-system.config"
        rm -f "$cfg"
        node --experimental-strip-types --no-warnings \
          "${{ github.action_path }}/box-git-mirror.mts" --write-config "$cfg"
        if [ -f "$cfg" ]; then
          echo "GIT_CONFIG_SYSTEM=$cfg" >> "$GITHUB_ENV"
          export GIT_CONFIG_SYSTEM="$cfg"
        fi
    - name: Stabilize partial-clone HTTP (HTTP/1.1)
      shell: bash
      run: git config --global http.version HTTP/1.1
    - name: Split sparse directory cones and root files
      id: sparse
      shell: bash
      env:
        SPARSE_PATHS: ${{ inputs.sparse-paths }}
      run: |
        set -euo pipefail
        root_files=(
          mise.toml
          mise.lock
          package.json
          pnpm-lock.yaml
          pnpm-workspace.yaml
          turbo.json
          tsconfig.base.json
          .env.example
          .gitattributes
          .gitignore
          .betterleaks.toml
          .gitmodules
          .mcp.json
          AGENTS.md
          AUTH.md
          CLAUDE.md
          CODE_OF_CONDUCT.md
          CONTRIBUTING.md
          DX.md
          GAPS.md
          LICENSE
          NOTES.md
          PRODUCT.md
          README.md
          SECURITY.md
          SUPPORT.md
          biome.json
          buf.gen.yaml
          cucumber.yaml
          konsistent.json
          oxlint.config.ts
          sgconfig.yml
          skills-lock.json
          stryker.scripts.conf.json
          tsconfig.json
          vitest.config.ts
          vitest.coverage.config.ts
          vitest.mutation.config.ts
          media/package.json
        )
        is_root_file() {
          local candidate="$1"
          for f in "${root_files[@]}"; do
            if [ "$f" = "$candidate" ]; then
              return 0
            fi
          done
          return 1
        }
        looks_like_nested_file() {
          local candidate="$1"
          case "$candidate" in
            */*)
              local base="${candidate##*/}"
              case "$base" in
                *.*) return 0 ;;
              esac
              ;;
          esac
          return 1
        }
        dir_cones=()
        checkout_root=()
        while IFS= read -r path; do
          [ -z "$path" ] && continue
          if is_root_file "$path" || looks_like_nested_file "$path"; then
            checkout_root+=("$path")
          else
            dir_cones+=("$path")
          fi
        done <<< "$SPARSE_PATHS"
        {
          printf 'dir_cones<<EOF\n'
          printf '%s\n' "${dir_cones[@]}"
          printf 'EOF\n'
          printf 'root_files<<EOF\n'
          printf '%s\n' "${checkout_root[@]}"
          printf 'EOF\n'
        } >> "$GITHUB_OUTPUT"
    - name: Sparse checkout (attempt 1)
      id: checkout1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      continue-on-error: true
      with:
        clean: false
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        filter: blob:none
        fetch-tags: false
        sparse-checkout: ${{ steps.sparse.outputs.dir_cones }}
        sparse-checkout-cone-mode: true
    - name: Reset partial clone after failed checkout
      if: steps.checkout1.outcome != 'success'
      shell: bash
      run: rm -rf .git
    - name: Disable box git mirror after transport errors
      if: steps.checkout1.outcome != 'success'
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${GIT_CONFIG_SYSTEM:-}" ]; then
          exit 0
        fi
        echo "Disabling box git mirror after checkout failure; later attempts use GitHub"
        rm -f "${GIT_CONFIG_SYSTEM}"
        echo "GIT_CONFIG_SYSTEM=" >> "$GITHUB_ENV"
    - name: Sparse checkout (attempt 2)
      id: checkout2
      if: steps.checkout1.outcome != 'success'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      continue-on-error: true
      with:
        clean: false
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        filter: blob:none
        fetch-tags: false
        sparse-checkout: ${{ steps.sparse.outputs.dir_cones }}
        sparse-checkout-cone-mode: true
    - name: Reset partial clone after failed checkout (attempt 2)
      if: steps.checkout1.outcome != 'success' && steps.checkout2.outcome != 'success'
      shell: bash
      run: rm -rf .git
    - name: Sparse checkout (attempt 3)
      id: checkout3
      if: steps.checkout1.outcome != 'success' && steps.checkout2.outcome != 'success'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      continue-on-error: true
      with:
        clean: false
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        filter: blob:none
        fetch-tags: false
        sparse-checkout: ${{ steps.sparse.outputs.dir_cones }}
        sparse-checkout-cone-mode: true
    - name: Reset partial clone before full-clone fallback
      if: steps.checkout1.outcome != 'success' && steps.checkout2.outcome != 'success' && steps.checkout3.outcome != 'success'
      shell: bash
      run: |
        set -euo pipefail
        echo "Partial sparse checkout failed after 3 promisor attempts; retrying with a full non-partial fetch"
        rm -rf .git
    - name: Sparse checkout (full clone fallback)
      id: checkout_full
      if: steps.checkout1.outcome != 'success' && steps.checkout2.outcome != 'success' && steps.checkout3.outcome != 'success'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      continue-on-error: true
      with:
        clean: false
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        fetch-tags: false
        sparse-checkout: ${{ steps.sparse.outputs.dir_cones }}
        sparse-checkout-cone-mode: true
    - name: Require successful sparse checkout
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ steps.checkout1.outcome }}" = "success" ] \
          || [ "${{ steps.checkout2.outcome }}" = "success" ] \
          || [ "${{ steps.checkout3.outcome }}" = "success" ] \
          || [ "${{ steps.checkout_full.outcome }}" = "success" ]; then
          exit 0
        fi
        echo "::error::sparse checkout failed after 3 partial attempts and 1 full-clone fallback (promisor fetch)"
        exit 1
    - name: Initialize sparse cone before root files
      shell: bash
      env:
        DIR_CONES: ${{ steps.sparse.outputs.dir_cones }}
      run: |
        set -euo pipefail
        git rev-parse --verify HEAD > /dev/null
        mapfile -t directory_cones <<< "$DIR_CONES"
        cones=()
        for path in "${directory_cones[@]}"; do
          [ -z "$path" ] && continue
          cones+=("$path")
        done
        if [ "${#cones[@]}" -gt 0 ]; then
          git sparse-checkout set --cone --skip-checks -- "${cones[@]}"
        fi
        index=$(git rev-parse --git-path index)
        if [ ! -s "$index" ]; then
          git reset --hard HEAD
        fi
    - name: Checkout sparse root files (non-cone)
      if: steps.sparse.outputs.root_files != ''
      shell: bash
      env:
        ROOT_FILES: ${{ steps.sparse.outputs.root_files }}
      run: |
        set -euo pipefail
        mapfile -t paths <<< "$ROOT_FILES"
        root=()
        nested=()
        for path in "${paths[@]}"; do
          [ -z "$path" ] && continue
          case "$path" in
            */*) nested+=("$path") ;;
            *) root+=("$path") ;;
          esac
        done
        if [ "${#root[@]}" -gt 0 ]; then
          git checkout HEAD -- "${root[@]}"
        fi
        # Cone mode only tracks directories. A nested file (media/package.json)
        # is not in any cone, so `git checkout HEAD --` says pathspec did not
        # match (Main Fabric 42054416861). --skip-checks adds the file pattern
        # without pulling the sibling asset tree.
        for path in "${nested[@]}"; do
          git sparse-checkout add --skip-checks -- "$path"
          git checkout HEAD -- "$path"
        done
    - name: Materialize required sparse paths
      if: inputs.materialize-paths != ''
      shell: bash
      env:
        MATERIALIZE_PATHS: ${{ inputs.materialize-paths }}
      run: |
        set -euo pipefail
        mapfile -t paths <<< "$MATERIALIZE_PATHS"
        assert_wit_station_file() {
          local wit_dir="$1"
          local wit_file="${wit_dir}/station.wit"
          if [ ! -s "$wit_file" ]; then
            echo "::error::sparse checkout missing or empty ${wit_file} after materializing ${wit_dir}"
            exit 1
          fi
          local expected actual
          expected=$(git rev-parse "HEAD:${wit_file}")
          actual=$(git hash-object "$wit_file")
          if [ "$expected" != "$actual" ]; then
            echo "::error::${wit_file} on disk does not match HEAD (expected blob ${expected}, got ${actual}); rematerialize required on reused worktrees"
            exit 1
          fi
        }
        materialize_path() {
          local target="$1"
          if ! git rev-parse --verify "HEAD:${target}" >/dev/null 2>&1 \
            && ! git rev-parse --verify "HEAD:${target%/}" >/dev/null 2>&1; then
            echo "::error::required sparse path missing from HEAD: ${target}"
            exit 1
          fi
          git sparse-checkout add --skip-checks -- "$target"
          git checkout HEAD -- "$target"
          if [ ! -e "$target" ]; then
            echo "::error::sparse checkout did not materialize required path: ${target}"
            exit 1
          fi
        }
        for path in "${paths[@]}"; do
          [ -z "$path" ] && continue
          materialize_path "$path"
        done
        for path in "${paths[@]}"; do
          [ -z "$path" ] && continue
          case "$path" in
            */wit)
              echo "::group::Materialized wit tree ${path}"
              ls -la "$path" || true
              echo "::endgroup::"
              assert_wit_station_file "$path"
              ;;
          esac
        done
    - name: Initialize submodules (sparse cone via pins:fetch in job)
      if: inputs.submodules == 'true'
      shell: bash
      run: git submodule sync --recursive && git submodule update --init --recursive --depth 1
