name: HoBo sparse checkout
description: Partial clone (blob:none) with cone-mode sparse checkout for hermetic CI/release jobs.
inputs:
  fetch-depth:
    description: git fetch depth (0 = full history for diffs)
    required: false
    default: "1"
  sparse-paths:
    description: Newline-separated paths for sparse-checkout-cone-mode
    required: true
  submodules:
    description: Whether to fetch submodules after sparse checkout
    required: false
    default: "false"
  ref:
    description: Optional git ref to checkout (defaults to the triggering commit)
    required: false
    default: ""
runs:
  using: composite
  steps:
    # The probe below is TypeScript run as written; a GitHub-hosted machine's
    # default Node may be too old for it. A no-op on the fleet's image.
    - name: Node for a GitHub-hosted machine
      shell: bash
      env:
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: bash "${GITHUB_ACTION_PATH}/../ci-runner-preflight/hosted-toolchain.sh"
    - name: Probe box git mirror
      shell: bash
      run: |
        set -euo pipefail
        cfg="${RUNNER_TEMP}/hobo-git-system.config"
        rm -f "$cfg"
        node --experimental-strip-types --no-warnings \
          "${{ github.action_path }}/box-git-mirror.mts" --write-config "$cfg"
        if [ -f "$cfg" ]; then
          echo "GIT_CONFIG_SYSTEM=$cfg" >> "$GITHUB_ENV"
          export GIT_CONFIG_SYSTEM="$cfg"
        fi
    - name: Stabilize partial-clone HTTP (HTTP/1.1)
      shell: bash
      run: git config --global http.version HTTP/1.1
    - name: Split sparse directory cones and root files
      id: sparse
      shell: bash
      env:
        SPARSE_PATHS: ${{ inputs.sparse-paths }}
      run: |
        set -euo pipefail
        root_files=(
          mise.toml
          mise.lock
          package.json
          pnpm-lock.yaml
          pnpm-workspace.yaml
          turbo.json
          tsconfig.base.json
          .env.example
          .gitattributes
          .gitignore
          .gitleaks.toml
          .gitmodules
          .mcp.json
          AGENTS.md
          AUTH.md
          CLAUDE.md
          CODE_OF_CONDUCT.md
          CONTRIBUTING.md
          DX.md
          GAPS.md
          LICENSE
          NOTES.md
          PRODUCT.md
          README.md
          SECURITY.md
          SUPPORT.md
          biome.json
          buf.gen.yaml
          cucumber.yaml
          konsistent.json
          oxlint.config.ts
          sgconfig.yml
          skills-lock.json
          stryker.scripts.conf.json
          tsconfig.json
          vitest.config.ts
          vitest.coverage.config.ts
          vitest.mutation.config.ts
          media/package.json
        )
        is_root_file() {
          local candidate="$1"
          for f in "${root_files[@]}"; do
            if [ "$f" = "$candidate" ]; then
              return 0
            fi
          done
          return 1
        }
        dir_cones=()
        checkout_root=()
        while IFS= read -r path; do
          [ -z "$path" ] && continue
          if is_root_file "$path"; then
            checkout_root+=("$path")
          else
            dir_cones+=("$path")
          fi
        done <<< "$SPARSE_PATHS"
        {
          printf 'dir_cones<<EOF\n'
          printf '%s\n' "${dir_cones[@]}"
          printf 'EOF\n'
          printf 'root_files<<EOF\n'
          printf '%s\n' "${checkout_root[@]}"
          printf 'EOF\n'
        } >> "$GITHUB_OUTPUT"
    - name: Sparse checkout (attempt 1)
      id: checkout1
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      continue-on-error: true
      with:
        clean: false
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        filter: blob:none
        fetch-tags: false
        sparse-checkout: ${{ steps.sparse.outputs.dir_cones }}
        sparse-checkout-cone-mode: true
    - name: Reset partial clone after failed checkout
      if: steps.checkout1.outcome != 'success'
      shell: bash
      run: rm -rf .git
    - name: Sparse checkout (attempt 2)
      id: checkout2
      if: steps.checkout1.outcome != 'success'
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      continue-on-error: true
      with:
        clean: false
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        filter: blob:none
        fetch-tags: false
        sparse-checkout: ${{ steps.sparse.outputs.dir_cones }}
        sparse-checkout-cone-mode: true
    - name: Reset partial clone after failed checkout (attempt 2)
      if: steps.checkout1.outcome != 'success' && steps.checkout2.outcome != 'success'
      shell: bash
      run: rm -rf .git
    - name: Sparse checkout (attempt 3)
      id: checkout3
      if: steps.checkout1.outcome != 'success' && steps.checkout2.outcome != 'success'
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        clean: false
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        filter: blob:none
        fetch-tags: false
        sparse-checkout: ${{ steps.sparse.outputs.dir_cones }}
        sparse-checkout-cone-mode: true
    - name: Require successful sparse checkout
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ steps.checkout1.outcome }}" = "success" ] \
          || [ "${{ steps.checkout2.outcome }}" = "success" ] \
          || [ "${{ steps.checkout3.outcome }}" = "success" ]; then
          exit 0
        fi
        echo "::error::sparse checkout failed after 3 attempts (partial clone / promisor fetch)"
        exit 1
    - name: Checkout sparse root files (non-cone)
      if: steps.sparse.outputs.root_files != ''
      shell: bash
      env:
        ROOT_FILES: ${{ steps.sparse.outputs.root_files }}
      run: |
        set -euo pipefail
        mapfile -t paths <<< "$ROOT_FILES"
        root=()
        nested=()
        for path in "${paths[@]}"; do
          [ -z "$path" ] && continue
          case "$path" in
            */*) nested+=("$path") ;;
            *) root+=("$path") ;;
          esac
        done
        if [ "${#root[@]}" -gt 0 ]; then
          git checkout HEAD -- "${root[@]}"
        fi
        # Cone mode only tracks directories. A nested file (media/package.json)
        # is not in any cone, so `git checkout HEAD --` says pathspec did not
        # match (Main Fabric 42054416861). --skip-checks adds the file pattern
        # without pulling the sibling asset tree.
        for path in "${nested[@]}"; do
          git sparse-checkout add --skip-checks -- "$path"
          git checkout HEAD -- "$path"
        done
    - name: Initialize submodules (sparse cone via pins:fetch in job)
      if: inputs.submodules == 'true'
      shell: bash
      run: git submodule sync --recursive && git submodule update --init --recursive --depth 1
