name: HoBo sparse checkout
description: Partial clone (blob:none) with cone-mode sparse checkout for hermetic CI/release jobs.
inputs:
  fetch-depth:
    description: git fetch depth (0 = full history for diffs)
    required: false
    default: "1"
  sparse-paths:
    description: Newline-separated paths for sparse-checkout-cone-mode
    required: true
  submodules:
    description: Whether to fetch submodules after sparse checkout
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        filter: blob:none
        sparse-checkout: ${{ inputs.sparse-paths }}
        sparse-checkout-cone-mode: true
    - name: Initialize submodules (sparse cone via pins:fetch in job)
      if: inputs.submodules == 'true'
      shell: bash
      run: git submodule sync --recursive && git submodule update --init --recursive --depth 1
