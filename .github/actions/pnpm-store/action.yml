name: HoBo pnpm store
description: >-
  Shared pnpm store. On the box worker the store is a host bind mount
  (HOBO_CI_PNPM_STORE_MOUNTED=1) and this is a no-op. An ARC pod names its
  node's shared store in HOBO_CI_PNPM_STORE_DIR, which scripts/ci/pnpm-install.mts
  installs into. A self-hosted runner with neither installs from the registry:
  on the fleet's network the ~1.3 GB actions/cache archive is slower still. GitHub-hosted PRs restore the store that main last
  saved (keyed on pnpm-lock.yaml), and main saves it.
inputs:
  mode:
    description: restore (PRs, merge queue) or save (push to main)
    required: false
    default: restore
runs:
  using: composite
  steps:
    - name: Resolve pnpm store
      id: store
      shell: bash
      env:
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: |
        set -euo pipefail
        # Read the process env here: an `if: env.X` expression only sees
        # workflow-level and GITHUB_ENV values, never the variables the box
        # worker sets on the job container.
        if [ "${HOBO_CI_PNPM_STORE_MOUNTED:-}" = "1" ]; then
          echo "use-cache=false" >> "$GITHUB_OUTPUT"
          echo "npm_config_package_import_method=hardlink" >> "$GITHUB_ENV"
          if [ -n "${npm_config_store_dir:-}" ]; then
            echo "npm_config_store_dir=${npm_config_store_dir}" >> "$GITHUB_ENV"
          fi
          echo "pnpm store is host-mounted (${npm_config_store_dir:-unset}); using hardlinks, skipping actions/cache"
        elif [ "${RUNNER_ENVIRONMENT}" != "github-hosted" ] && [ -n "${HOBO_CI_PNPM_STORE_DIR:-}" ]; then
          echo "use-cache=false" >> "$GITHUB_OUTPUT"
          echo "pnpm store is the node's shared store (${HOBO_CI_PNPM_STORE_DIR}); skipping actions/cache"
        elif [ "${RUNNER_ENVIRONMENT}" != "github-hosted" ]; then
          echo "use-cache=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=hobo-ci-cold-pnpm-store::self-hosted runner without a shared pnpm store; every package downloads from the registry (scripts/ci/arc-runner-caches.mts mounts one)"
        else
          echo "use-cache=true" >> "$GITHUB_OUTPUT"
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        fi
    - name: Restore pnpm store seeded by main
      if: steps.store.outputs.use-cache == 'true' && inputs.mode == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-
    - name: Save pnpm store from main
      if: steps.store.outputs.use-cache == 'true' && inputs.mode == 'save'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
