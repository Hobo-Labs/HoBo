name: Route runners
description: >-
  Chooses the runner label this run's jobs ask for: the hobo fleet while it is
  taking jobs, an enrolled local box when it is not, GitHub-hosted when neither
  is. Never fails: when the queue cannot be read, or the script cannot run,
  GitHub-hosted is chosen (this step is running there, so it is the one tier
  known to be up) and a warning says why. Pinned to the fleet, it stays there.
  What the fleet can take is not passed in: the script reads the routing slip
  the box relay writes to refs/hobo/routing-slip (ADR-0181) and the routing
  policy committed in .hobo/ci.json (runnerRouting), so the workflow must check
  out that file and scripts/ci/runner-routing.mts. With no usable slip the
  queue rule decides at once, as before slips.
  First it checks for a signed local run of this tree (verify-attestation.mts,
  when the workflow checked that script out): the jobs such a run covers are
  skipped, and what is left goes to GitHub-hosted without reading the queue.
  Each decision is one `hobo-ci-route` notice; a fallback (the script did not
  run, or no slip could be used) is a `hobo-ci-route-fallback` warning, so a
  monitor can count both. What this run chooses reaches the script as
  arguments, never as environment variables.
inputs:
  token:
    description: A token that can read this repository's Actions runs and jobs.
    required: true
  route:
    description: auto (default) follows runnerRouting.pin; fleet, local or github pins this run.
    required: false
    default: "auto"
  attest:
    description: "`false` skips the check for a signed local run (a second ask within a run)."
    required: false
    default: "true"
  include-own-run:
    description: >-
      `true` for a second ask later in a run: the queue reading keeps this
      run's own jobs, and when the script cannot decide no runner is output,
      so the run's first decision stands.
    required: false
    default: "false"
outputs:
  runner:
    description: The runs-on label for this run's jobs.
    value: ${{ steps.route.outputs.runner }}
  tier:
    description: fleet, local or github.
    value: ${{ steps.route.outputs.tier }}
  shard_runner:
    description: The runs-on label for the main gate's shards (the run's class).
    value: ${{ steps.route.outputs.shard_runner }}
  box_runner:
    description: >-
      runnerRouting.labels.box when committed runnerRouting.boxRunner is true,
      else empty: the label a pull request's deps-image job asks for.
    value: ${{ steps.route.outputs.box_runner }}
  attested:
    description: "`true` when a signed local run was verified for the checked-out tree, else `false`."
    value: ${{ steps.attest.outputs.attested || 'false' }}
  attested-jobs:
    description: JSON array of the job ids that run covers; `[]` when there is none.
    value: ${{ steps.attest.outputs.attested-jobs || '[]' }}
  merge-queue-green:
    description: >-
      `true` on a push to main whose tree a successful merge_group run of this
      workflow already tested (merge-queue-reuse.mts, when the workflow checked
      that script out), else `false`. Committed
      runnerRouting.mainGate.reuseMergeQueue `false` turns reuse off.
    value: ${{ steps.reuse.outputs.reuse || 'false' }}
runs:
  using: composite
  steps:
    # Never fails and never blocks: anything short of a verified attestation
    # is attested=false, and every job then runs as it always did.
    - id: attest
      if: inputs.attest != 'false'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        set -uo pipefail
        not_attested() {
          echo "not attested: $1"
          { echo "attested=false"; echo "attested-jobs=[]"; } >> "$GITHUB_OUTPUT"
        }
        if [ ! -f scripts/ci/verify-attestation.mts ]; then
          not_attested "this workflow does not check for a signed local run"
          exit 0
        fi
        cache="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
        node_bin=""
        for candidate in "$(command -v node || true)" \
          "${cache}"/node/24.*/*/bin/node "${cache}"/node/22.*/*/bin/node; do
          [ -x "${candidate}" ] || continue
          if "${candidate}" -e 'const [major, minor] = process.versions.node.split(".").map(Number); process.exit(major > 22 || (major === 22 && minor >= 18) ? 0 : 1)'; then
            node_bin="${candidate}"
            break
          fi
        done
        if [ -z "${node_bin}" ]; then
          not_attested "no Node 22.18 or later on this machine"
          exit 0
        fi
        # The script writes both outputs itself; if it dies first, say no here.
        outputs_before="$(wc -c < "$GITHUB_OUTPUT")"
        if ! "${node_bin}" --no-warnings scripts/ci/verify-attestation.mts \
          || [ "$(wc -c < "$GITHUB_OUTPUT")" = "${outputs_before}" ]; then
          not_attested "the verification script failed"
        fi
    - id: route
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        set -uo pipefail
        # What this run chose, as arguments. Each expression can only yield one of a fixed set
        # of literals, so nothing a caller passes reaches the shell as code.
        route='${{ contains(fromJSON('["auto","fleet","local","github"]'), inputs.route) && inputs.route || 'auto' }}'
        include_own_run='${{ inputs.include-own-run == 'true' && 'true' || 'false' }}'
        attested='${{ steps.attest.outputs.attested == 'true' && 'true' || 'false' }}'
        fleet=hobo
        case " push workflow_dispatch merge_group workflow_run " in
          *" ${GITHUB_EVENT_NAME} "*) fleet=hobo-trunk ;;
        esac
        # Without a decision, the one tier known to be up is the one this step is
        # running on. A run pinned to the fleet stays on the fleet. A second ask
        # within a run outputs nothing, so the run's first decision stands.
        # The titled warning is what a monitor counts (hobo-ci-route-fallback).
        without_a_decision() {
          if [ "${include_own_run}" = "true" ]; then
            echo "::warning title=hobo-ci-route-fallback::runner routing did not run ($1); keeping the run's route"
          elif [ "${route}" = "fleet" ]; then
            echo "::warning title=hobo-ci-route-fallback::runner routing did not run ($1); pinned to the fleet"
            { echo "runner=${fleet}"; echo "tier=fleet"; echo "shard_runner=${fleet}"; } >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=hobo-ci-route-fallback::runner routing did not run ($1); using GitHub-hosted runners"
            { echo "runner=ubuntu-24.04"; echo "tier=github"; echo "shard_runner=ubuntu-24.04"; } >> "$GITHUB_OUTPUT"
          fi
        }
        # The script is TypeScript run as written, which needs Node 22.18 or later.
        cache="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
        node_bin=""
        for candidate in "$(command -v node || true)" \
          "${cache}"/node/24.*/*/bin/node "${cache}"/node/22.*/*/bin/node; do
          [ -x "${candidate}" ] || continue
          if "${candidate}" -e 'const [major, minor] = process.versions.node.split(".").map(Number); process.exit(major > 22 || (major === 22 && minor >= 18) ? 0 : 1)'; then
            node_bin="${candidate}"
            break
          fi
        done
        if [ -z "${node_bin}" ]; then
          without_a_decision "no Node 22.18 or later on this machine"
          exit 0
        fi
        "${node_bin}" --no-warnings scripts/ci/route-runner.mts \
          --route "${route}" --include-own-run "${include_own_run}" --attested "${attested}" \
          || without_a_decision "the routing script failed"
    # Never fails and never blocks: anything short of a verified green
    # merge-queue run of this tree is reuse=false, and main runs its full gate.
    - id: reuse
      # A second ask later in a run only re-reads the fleet; the reuse answer is the first one.
      if: inputs.include-own-run != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        HEAD_SHA: ${{ github.sha }}
        HEAD_TREE: ${{ github.event.head_commit.tree_id }}
      run: |
        set -uo pipefail
        no_reuse() {
          echo "merge-queue reuse: no: $1"
          echo "reuse=false" >> "$GITHUB_OUTPUT"
        }
        if [ ! -f scripts/ci/merge-queue-reuse.mts ]; then
          no_reuse "this workflow does not reuse merge-queue results"
          exit 0
        fi
        if [ "${GITHUB_EVENT_NAME}" != "push" ] || [ "${GITHUB_REF}" != "refs/heads/main" ]; then
          no_reuse "not a push to main"
          exit 0
        fi
        cache="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
        node_bin=""
        for candidate in "$(command -v node || true)" \
          "${cache}"/node/24.*/*/bin/node "${cache}"/node/22.*/*/bin/node; do
          [ -x "${candidate}" ] || continue
          if "${candidate}" -e 'const [major, minor] = process.versions.node.split(".").map(Number); process.exit(major > 22 || (major === 22 && minor >= 18) ? 0 : 1)'; then
            node_bin="${candidate}"
            break
          fi
        done
        if [ -z "${node_bin}" ]; then
          no_reuse "no Node 22.18 or later on this machine"
          exit 0
        fi
        # The script writes the output itself; if it dies first, say no here.
        outputs_before="$(wc -c < "$GITHUB_OUTPUT")"
        if ! "${node_bin}" --no-warnings scripts/ci/merge-queue-reuse.mts \
          || [ "$(wc -c < "$GITHUB_OUTPUT")" = "${outputs_before}" ]; then
          no_reuse "the reuse check failed"
        fi
