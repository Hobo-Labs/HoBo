name: HoBo CI trace
description: >-
  Convert this job's Turbo run summaries into an OTLP/JSON trace (secrets
  redacted) and upload it with the Turbo profile as a per-job artifact.
inputs:
  disambiguator:
    description: >-
      Unique suffix within a matrix job (for example matrix.shard). Defaults to
      0 for non-matrix jobs.
    required: false
    default: "0"
runs:
  using: composite
  steps:
    - name: Export OTel trace
      shell: bash
      run: |
        set -euo pipefail
        trace_script="scripts/ci/ci-trace.mts"
        if [[ ! -f "$trace_script" ]]; then
          echo "::notice title=CI trace skipped::${trace_script} is absent (checkout or bootstrap did not populate the workspace)."
          exit 0
        fi
        node --experimental-strip-types --no-warnings "$trace_script" ci-traces "${GITHUB_JOB}"
    - name: Upload trace artifact
      # The trace is diagnostics. When GitHub's artifact service is down it answers
      # with an HTML page, the upload retries for ten minutes and fails, and that
      # failed the required Main full gate after every gate in it had passed (run
      # 43094500900). A missing trace must never block main or a release.
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ci-trace-${{ github.job }}-${{ inputs.disambiguator }}-${{ github.run_attempt }}
        path: ci-traces/
        retention-days: 14
        if-no-files-found: ignore
