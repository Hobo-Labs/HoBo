name: CI runner preflight
description: Fail fast when the hobo runner image is missing pinned toolchains (mise.lock + system packages).
inputs:
  browser:
    description: >-
      `true` for a job that runs browser tests. The runner image bakes the
      headless shell in; a GitHub-hosted machine downloads the same pinned one.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # The daemon deletes the host-mounted work dir at job teardown; /tmp goes with
    # the --rm container. Only untagged images over a day old are pruned here: the
    # base build's layer cache and every tagged image stay, and so does a build in
    # flight. Stopped containers are pruned only when they carry the job label and
    # are past the moment a warm spare sits between create and start.
    - name: Prune stale untagged images and stopped job containers
      shell: bash
      run: |
        set -uo pipefail
        git config --global http.version HTTP/1.1
        if command -v docker >/dev/null 2>&1 && [ -S /var/run/docker.sock ]; then
          docker image prune -f --filter until=24h >/dev/null || echo "::warning::docker image prune failed"
          docker container prune -f --filter label=hobo.ci/isolated=1 --filter until=10m >/dev/null \
            || echo "::warning::docker container prune failed"
          docker system df || true
        fi
    # A job routed to a GitHub-hosted machine gets the pinned toolchain here;
    # a no-op on the fleet's image. Its PATH additions reach the next step.
    - name: Toolchain for a GitHub-hosted machine
      shell: bash
      env:
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
        HOBO_CI_HOSTED_BROWSER: ${{ inputs.browser }}
      run: bash "${GITHUB_ACTION_PATH}/hosted-toolchain.sh"
    - shell: bash
      run: |
        set -euo pipefail
        export MISE_EXPERIMENTAL=1
        if command -v mise >/dev/null 2>&1; then
          mise trust ./mise.toml
          mise install --locked
        fi
        node --no-warnings scripts/ci-runner-preflight.mts
        node --experimental-strip-types scripts/ci/memory-env.mts
        echo "HOBO_CUE_BIN=$(command -v cue)" >> "$GITHUB_ENV"
