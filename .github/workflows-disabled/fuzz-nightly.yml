name: HoBo fuzz nightly

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  property-and-harness:
    if: ${{ false }}
    name: fast-check and Jazzer smoke
    runs-on: ${{ vars.HOBO_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Bounded property oracles
        run: pnpm run test:property
      - name: Serialized-input harness smoke
        run: pnpm run test:fuzz

  docker-gated:
    if: ${{ false }}
    name: RESTler and Toxiproxy
    runs-on: ${{ vars.HOBO_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      HOBO_FUZZ_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
      - name: Install Schemathesis
        run: |
          python3 -m venv "$RUNNER_TEMP/schemathesis"
          "$RUNNER_TEMP/schemathesis/bin/pip" install schemathesis==4.33.4
          printf '%s\n' "$RUNNER_TEMP/schemathesis/bin" >> "$GITHUB_PATH"
      - name: Run isolated campaigns
        run: pnpm run test:fuzz:nightly -- --api
