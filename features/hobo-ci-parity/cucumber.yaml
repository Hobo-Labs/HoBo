# The parity gauntlet on its own (scripts/ci/parity-scorecard.mts runs it).
# Paths are from the repository root. @pending scenarios wait for the work
# package that builds them; @met-differently ones are met another way and
# have nothing to run.
default:
  paths:
    - "features/hobo-ci-parity/*.feature"
  import:
    - "features/hobo-ci-parity/steps/**/*.ts"
  tags: "not @pending and not @met-differently"
  publishQuiet: true
