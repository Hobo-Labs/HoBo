# HoBo Fleet peer-to-peer relay (design §6.12, §6.16): iroh-relay 1.4.1, the
# release the pinned @number0/iroh binding is built against. Devices fall back
# to it when hole punching fails; traffic through it is end-to-end encrypted
# between the two endpoints. HoBo runs its own relays; the public ones are
# never used.
#
# Ports are unprivileged so the container needs no capability; the deployment
# publishes 8443 as 443 (relay over HTTPS), 7842/udp for QUIC address
# discovery, and 8080 as 80 (captive-portal checks only).

enable_relay = true
http_bind_addr = "[::]:8080"
enable_quic_addr_discovery = true

# Metrics: loopback only.
enable_metrics = true
metrics_bind_addr = "127.0.0.1:9090"

[tls]
https_bind_addr = "[::]:8443"
quic_bind_addr = "[::]:7842"
cert_mode = "Manual"
manual_cert_path = "/etc/hobo-fleet-relay/tls/relay.pem"
manual_key_path = "/etc/hobo-fleet-relay/tls/relay.key"
