# The provisioning job: `hobo fleet ops provision` creates the streams and
# buckets of design §6.7 (replicas 3). Run by an operator, never by a service:
#   kubectl -n hobo-fleet delete job hobo-fleet-provision --ignore-not-found
#   kubectl -n hobo-fleet apply -f provision-job.yaml   (or the kustomization)
# Its own service account is the only identity OpenBao lets read the
# provisioner's NATS credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hobo-fleet-provisioner
  labels: { app.kubernetes.io/name: hobo-fleet-provision, app.kubernetes.io/part-of: hobo-fleet }
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hobo-fleet-provision
  labels: { app.kubernetes.io/name: hobo-fleet-provision, app.kubernetes.io/part-of: hobo-fleet }
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: hobo-fleet-provision, app.kubernetes.io/part-of: hobo-fleet }
    spec:
      serviceAccountName: hobo-fleet-provisioner
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: provision
          image: ghcr.io/hobo-labs/hobo/hobo-cli:candidate
          args: ["fleet", "ops", "provision", "--config", "/etc/hobo-fleet/provisioner.json"]
          env:
            - { name: HOBO_FLEET_NATS_CA, value: /etc/hobo-fleet/tls/ca.pem }
            - { name: HOBO_HOME, value: /tmp/hobo }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/hobo-fleet/provisioner.json, subPath: provisioner.json, readOnly: true }
            - { name: nats-ca, mountPath: /etc/hobo-fleet/tls, readOnly: true }
            - { name: openbao-token, mountPath: /run/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: hobo-fleet-provisioner-config }
        - name: nats-ca
          secret:
            secretName: hobo-fleet-nats-tls
            items: [{ key: ca.pem, path: ca.pem }]
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken: { audience: openbao, expirationSeconds: 3600, path: openbao-token }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
