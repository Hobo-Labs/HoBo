# Three NATS servers in one cluster (design §6.7, §6.16, high availability),
# from deploy/fleet/nats/ha.conf. Client 4222 and WebSocket 443 are TLS;
# cluster routes bind each pod's own address and accept only the other NATS
# pods (mutual TLS plus the NetworkPolicy below); monitoring is on loopback,
# so the probes run inside the container.
#
# Secrets the operator creates (deploy/fleet/README.md):
#   hobo-fleet-nats-operator   operator.conf (from the key ceremony)
#   hobo-fleet-nats-tls        server.pem, server.key, ca.pem; the certificate
#                              names nats.fleet.example.com and
#                              *.hobo-fleet-nats.hobo-fleet.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: hobo-fleet-nats
  labels: { app.kubernetes.io/name: hobo-fleet-nats, app.kubernetes.io/part-of: hobo-fleet }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/name: hobo-fleet-nats }
  ports:
    - { name: client, port: 4222, targetPort: 4222 }
    - { name: cluster, port: 6222, targetPort: 6222 }
---
apiVersion: v1
kind: Service
metadata:
  name: hobo-fleet-nats-public
  labels: { app.kubernetes.io/name: hobo-fleet-nats, app.kubernetes.io/part-of: hobo-fleet }
spec:
  type: LoadBalancer
  selector: { app.kubernetes.io/name: hobo-fleet-nats }
  ports:
    - { name: client, port: 4222, targetPort: 4222 }
    - { name: websocket, port: 443, targetPort: 8443 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hobo-fleet-nats
  labels: { app.kubernetes.io/name: hobo-fleet-nats, app.kubernetes.io/part-of: hobo-fleet }
spec:
  serviceName: hobo-fleet-nats
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app.kubernetes.io/name: hobo-fleet-nats }
  template:
    metadata:
      labels: { app.kubernetes.io/name: hobo-fleet-nats, app.kubernetes.io/part-of: hobo-fleet }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: { app.kubernetes.io/name: hobo-fleet-nats }
      containers:
        - name: nats
          # NATS 2.15.3 or later (design §6.7, D13).
          image: nats:2.15.3-alpine
          command: ["nats-server"]
          args: ["-c", "/etc/nats/nats.conf"]
          env:
            - name: HOBO_FLEET_NATS_SERVER_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: HOBO_FLEET_NATS_CLUSTER_HOST
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: HOBO_FLEET_NATS_ROUTE_1
              value: nats-route://hobo-fleet-nats-0.hobo-fleet-nats.hobo-fleet.svc.cluster.local:6222
            - name: HOBO_FLEET_NATS_ROUTE_2
              value: nats-route://hobo-fleet-nats-1.hobo-fleet-nats.hobo-fleet.svc.cluster.local:6222
            - name: HOBO_FLEET_NATS_ROUTE_3
              value: nats-route://hobo-fleet-nats-2.hobo-fleet-nats.hobo-fleet.svc.cluster.local:6222
          ports:
            - { name: client, containerPort: 4222 }
            - { name: websocket, containerPort: 8443 }
            - { name: cluster, containerPort: 6222 }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          startupProbe:
            exec: { command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"] }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec: { command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"] }
            periodSeconds: 30
          readinessProbe:
            exec: { command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"] }
            periodSeconds: 10
          lifecycle:
            preStop:
              exec: { command: ["nats-server", "--signal", "ldm"] }
          volumeMounts:
            - { name: config, mountPath: /etc/nats/nats.conf, subPath: nats.conf, readOnly: true }
            - { name: operator, mountPath: /etc/nats/operator.conf, subPath: operator.conf, readOnly: true }
            - { name: tls, mountPath: /etc/nats/tls, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: hobo-fleet-nats-config }
        - name: operator
          secret: { secretName: hobo-fleet-nats-operator, defaultMode: 0440 }
        - name: tls
          secret: { secretName: hobo-fleet-nats-tls, defaultMode: 0440 }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 20Gi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hobo-fleet-nats
  labels: { app.kubernetes.io/name: hobo-fleet-nats, app.kubernetes.io/part-of: hobo-fleet }
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: hobo-fleet-nats }
---
# Cluster routes accept only the other NATS servers; clients reach 4222 and 8443.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hobo-fleet-nats
  labels: { app.kubernetes.io/name: hobo-fleet-nats, app.kubernetes.io/part-of: hobo-fleet }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: hobo-fleet-nats }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: hobo-fleet-nats }
      ports:
        - { protocol: TCP, port: 6222 }
    - ports:
        - { protocol: TCP, port: 4222 }
        - { protocol: TCP, port: 8443 }
