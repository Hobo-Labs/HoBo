# The authority (design §6.15, §6.16, high availability): two or more
# replicas behind the ingress, all callout responders in one queue group,
# journalling to FLEET_JOURNAL (no volume). Each replica reads its keys from
# OpenBao with its own projected service-account token (audience `openbao`),
# so only this workload identity can read the authority's secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hobo-fleet-authority
  labels: { app.kubernetes.io/name: hobo-fleet-authority, app.kubernetes.io/part-of: hobo-fleet }
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: hobo-fleet-authority
  labels: { app.kubernetes.io/name: hobo-fleet-authority, app.kubernetes.io/part-of: hobo-fleet }
spec:
  selector: { app.kubernetes.io/name: hobo-fleet-authority }
  ports:
    - { name: http, port: 8443, targetPort: 8443 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hobo-fleet-authority
  labels: { app.kubernetes.io/name: hobo-fleet-authority, app.kubernetes.io/part-of: hobo-fleet }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: hobo-fleet-authority }
  template:
    metadata:
      labels: { app.kubernetes.io/name: hobo-fleet-authority, app.kubernetes.io/part-of: hobo-fleet }
    spec:
      serviceAccountName: hobo-fleet-authority
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: hobo-fleet-authority }
      containers:
        - name: authority
          image: ghcr.io/hobo-labs/hobo/hobo-fleet-authority:candidate
          args: ["--config", "/etc/hobo-fleet/authority.json"]
          env:
            - { name: HOBO_FLEET_NATS_CA, value: /etc/hobo-fleet/tls/ca.pem }
          ports:
            - { name: http, containerPort: 8443 }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          volumeMounts:
            - { name: config, mountPath: /etc/hobo-fleet/authority.json, subPath: authority.json, readOnly: true }
            - { name: nats-ca, mountPath: /etc/hobo-fleet/tls, readOnly: true }
            - { name: openbao-token, mountPath: /run/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: hobo-fleet-authority-config }
        - name: nats-ca
          secret:
            secretName: hobo-fleet-nats-tls
            items: [{ key: ca.pem, path: ca.pem }]
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken: { audience: openbao, expirationSeconds: 3600, path: openbao-token }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hobo-fleet-authority
  labels: { app.kubernetes.io/name: hobo-fleet-authority, app.kubernetes.io/part-of: hobo-fleet }
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: hobo-fleet-authority }
---
# TLS for the issuer origin ends here; the authority speaks HTTP behind it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hobo-fleet-authority
  labels: { app.kubernetes.io/name: hobo-fleet-authority, app.kubernetes.io/part-of: hobo-fleet }
spec:
  tls:
    - hosts: [fleet.example.com]
      secretName: hobo-fleet-authority-tls
  rules:
    - host: fleet.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hobo-fleet-authority
                port: { name: http }
