# HoBo Fleet NATS server, high-availability profile (design §6.7, §6.16): three
# servers in one cluster, stream and bucket replicas 3. Operator mode with the
# full resolver, JetStream on, TLS on every listener (client, WebSocket and the
# cluster routes, which are mutually authenticated), the cluster listener bound
# to a private interface only, monitoring on localhost only. Leaf-node and MQTT
# listeners are absent; gateways stay off unless a multi-region deployment adds
# them in its own file.
#
# Files beside this one, mounted by the deployment (deploy/fleet/README.md):
#   operator.conf   operator JWT, system account and its preload (from the ceremony)
#   tls/server.pem, tls/server.key, tls/ca.pem   (the certificate names every server)
# Environment:
#   HOBO_FLEET_NATS_SERVER_NAME    unique per server
#   HOBO_FLEET_NATS_CLUSTER_HOST   this server's private address
#   HOBO_FLEET_NATS_ROUTE_1..3     nats-route://<server>:6222 for each server

server_name: $HOBO_FLEET_NATS_SERVER_NAME

# Operator mode: `operator`, `system_account` and `resolver_preload` (the
# system account's JWT) come from the ceremony, never from this template.
include "operator.conf"

resolver: {
  type: full
  dir: "/data/jwt"
  allow_delete: false
  interval: "2m"
  timeout: "5s"
}

# Client listener: TLS required.
host: "0.0.0.0"
port: 4222
tls: {
  cert_file: "/etc/nats/tls/server.pem"
  key_file: "/etc/nats/tls/server.key"
  ca_file: "/etc/nats/tls/ca.pem"
  timeout: 5
}

# WebSocket listener: TLS required. The container port is 8443 so the server
# needs no capability; the deployment publishes it as 443.
websocket: {
  port: 8443
  tls: {
    cert_file: "/etc/nats/tls/server.pem"
    key_file: "/etc/nats/tls/server.key"
  }
  compression: false
}

# Cluster routes: a private interface only, mutual TLS.
cluster: {
  name: "hobo-fleet"
  host: $HOBO_FLEET_NATS_CLUSTER_HOST
  port: 6222
  tls: {
    cert_file: "/etc/nats/tls/server.pem"
    key_file: "/etc/nats/tls/server.key"
    ca_file: "/etc/nats/tls/ca.pem"
    verify: true
    timeout: 5
  }
  routes: [
    $HOBO_FLEET_NATS_ROUTE_1
    $HOBO_FLEET_NATS_ROUTE_2
    $HOBO_FLEET_NATS_ROUTE_3
  ]
  no_advertise: true
}

# Monitoring: loopback only (health checks run inside the container).
http: "127.0.0.1:8222"

# The provisioner's user JWT is about 3.6 KiB; the default 4 KiB control line
# is too close.
max_control_line: 8192
max_payload: 1048576
ping_interval: "30s"
write_deadline: "10s"

jetstream: {
  store_dir: "/data"
  max_memory_store: 268435456
  max_file_store: 10737418240
}

lame_duck_duration: "30s"
lame_duck_grace_period: "10s"
