syntax = "proto3";

package hobo.draft.v1;


enum SdkIdiomConformanceGateEvidenceKind {
  EVIDENCE_KIND_UNSPECIFIED = 0;
  EVIDENCE_KIND_DESIGN_RECORD = 1;
  EVIDENCE_KIND_CONTRACT_TEST = 2;
}

message SdkIdiomConformanceGateRecord {
  string issue = 1;
  string summary = 2;
  repeated string evidence = 3;
  repeated string required_lanes = 4;
  repeated string helper_claims = 5;
}
