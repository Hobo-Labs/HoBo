syntax = "proto3";

package hobo.draft.v1;

// Architecture-guard evidence: protobuf data shapes the V1 Cutline Contract draft package
// reasons about. Documents the records/objects this package owns so the
// architecture guard has a language-neutral schema reference. Not compiled at
// runtime; this is a design-time contract artifact.

enum V1CutlineContractEvidenceKind {
  EVIDENCE_KIND_UNSPECIFIED = 0;
  EVIDENCE_KIND_DESIGN_RECORD = 1;
  EVIDENCE_KIND_CONTRACT_TEST = 2;
  EVIDENCE_KIND_M1_DOGFOOD_ALPHA = 3;
  EVIDENCE_KIND_M2_PRIVATE_BETA = 4;
  EVIDENCE_KIND_M3_RELEASE_CANDIDATE = 5;
  EVIDENCE_KIND_M4_GA_HANDOFF = 6;
}

message V1CutlineContractRecord {
  string issue = 1;
  string summary = 2;
  repeated string evidence = 3;
}

message V1CutlineDogfoodAlphaEvidence {
  string issue = 1;
  string phase = 2;
  string milestone_gate = 3;
  repeated string required_evidence_ids = 4;
  repeated string blockers = 5;
  repeated string accepted_risks = 6;
  repeated string cross_project_dependencies = 7;
  repeated string missing_evidence = 8;
  repeated string follow_up_issues = 9;
  bool parent_status_updated = 10;
}

message V1CutlinePrivateBetaEvidence {
  string issue = 1;
  string phase = 2;
  string milestone_gate = 3;
  repeated string required_evidence_ids = 4;
  repeated string blockers = 5;
  repeated string accepted_risks = 6;
  repeated string cross_project_dependencies = 7;
  repeated string missing_evidence = 8;
  repeated string follow_up_issues = 9;
  bool parent_status_updated = 10;
}

message V1CutlineReleaseCandidateEvidence {
  string issue = 1;
  string phase = 2;
  string milestone_gate = 3;
  repeated string required_evidence_ids = 4;
  repeated string blockers = 5;
  repeated string accepted_risks = 6;
  repeated string cross_project_dependencies = 7;
  repeated string missing_evidence = 8;
  repeated string follow_up_issues = 9;
  bool parent_status_updated = 10;
  repeated string scope_out = 11;
  repeated string public_claim_guards = 12;
}

message V1CutlineGaHandoffEvidence {
  string issue = 1;
  string phase = 2;
  string milestone_gate = 3;
  repeated string required_evidence_ids = 4;
  repeated string blockers = 5;
  repeated string accepted_risks = 6;
  repeated string cross_project_dependencies = 7;
  repeated string missing_evidence = 8;
  repeated string follow_up_issues = 9;
  bool parent_status_updated = 10;
  repeated string scope_out = 11;
  repeated string public_claim_guards = 12;
}
