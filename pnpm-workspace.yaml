packages:
  - "site"
  - "media"
  - "packages/*"
  - "packages/adapters/*"
  - "packages/connectors/*"
  - "packages/runtimes/*"
  - "packages/providers/*"
  - "packages/packs/*"
  - "packages/iac/*"
  - "examples/*"
  - "src/draft/technical-proofs/*"
  - "src/draft/exp-proofs/*/*"
  - "src/draft/epic-proofs/*"
  - "src/draft/projects/*"
  - "external/ts-autocode/packages/grounding"
  - "external/ts-autocode/packages/training"
  - "external/ts-autocode/packages/rewrite"
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.1'
  - '@turbo/darwin-arm64@2.10.1'
  - '@turbo/linux-64@2.10.1'
  - '@turbo/linux-arm64@2.10.1'
  - '@turbo/windows-64@2.10.1'
  - '@turbo/windows-arm64@2.10.1'
  - '@typescript/native-preview-darwin-arm64@7.0.0-dev.20260629.1'
  - '@typescript/native-preview-darwin-x64@7.0.0-dev.20260629.1'
  - '@typescript/native-preview-linux-arm64@7.0.0-dev.20260629.1'
  - '@typescript/native-preview-linux-arm@7.0.0-dev.20260629.1'
  - '@typescript/native-preview-linux-x64@7.0.0-dev.20260629.1'
  - '@typescript/native-preview-win32-arm64@7.0.0-dev.20260629.1'
  - '@typescript/native-preview-win32-x64@7.0.0-dev.20260629.1'
  - '@typescript/native-preview@7.0.0-dev.20260629.1'
  - turbo@2.10.1
allowBuilds:
  "@ast-grep/cli": true
  "@bufbuild/buf": true
  esbuild: true
  protobufjs: true

packageExtensions:
  "@bytecodealliance/componentize-js@0.19.3":
    dependencies:
      "@bytecodealliance/preview2-shim": "^0.17.4"
